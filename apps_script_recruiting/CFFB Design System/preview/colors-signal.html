<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Colors · Signal & Stars</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .label { font-family: var(--font-body); font-weight: 600; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-secondary); margin-bottom: 8px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .sw { border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
  .chip { height: 48px; }
  .meta { padding: 6px 8px; font-family: var(--font-mono); font-size: 9px; color: var(--fg-secondary); background: var(--bg-surface); line-height: 1.4; }
  .meta .name { font-family: var(--font-body); font-weight: 600; font-size: 10px; color: var(--fg-primary); }
</style></head>
<body>
  <div>
    <div class="label">Star Tiers</div>
    <div class="row">
      <div class="sw"><div class="chip" style="background:#C9A227"></div><div class="meta"><div class="name">5★</div>#C9A227 gold</div></div>
      <div class="sw"><div class="chip" style="background:#3B82C4"></div><div class="meta"><div class="name">4★</div>#3B82C4</div></div>
      <div class="sw"><div class="chip" style="background:#7BA4C9"></div><div class="meta"><div class="name">3★</div>#7BA4C9</div></div>
      <div class="sw"><div class="chip" style="background:#6A6A6A"></div><div class="meta"><div class="name">2★</div>#6A6A6A</div></div>
      <div class="sw"><div class="chip" style="background:#4A4A4A"></div><div class="meta"><div class="name">1★</div>#4A4A4A</div></div>
    </div>
  </div>
  <div>
    <div class="label">Value & Live</div>
    <div class="row" style="grid-template-columns: repeat(3, 1fr)">
      <div class="sw"><div class="chip" style="background:#2D7A4E"></div><div class="meta"><div class="name">Positive · Live</div>#2D7A4E</div></div>
      <div class="sw"><div class="chip" style="background:#B84545"></div><div class="meta"><div class="name">Negative</div>#B84545</div></div>
      <div class="sw"><div class="chip" style="background:#4A9968"></div><div class="meta"><div class="name">B grade</div>#4A9968</div></div>
    </div>
  </div>
</body></html>
