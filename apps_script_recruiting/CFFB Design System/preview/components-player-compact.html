<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>PlayerCardCompact.html</title>
<link rel="stylesheet" href="_base.css">
<style>body { padding: 20px; }</style>
</head><body>
<!-- CFFB · PlayerCard (compact)
     Row-density card for boards, lists, search results.
     Layout: team chip · position · name + meta · stars · bid · delta
     Hover: row tints lightly, gold 2px left bar slides in. -->
<style>
.cffb-pc { display: flex; flex-direction: column; gap: 8px; }
.cffb-pc-c {
  display: grid;
  grid-template-columns: 40px 32px 1fr auto auto auto;
  align-items: center;
  gap: 16px;
  padding: 12px 16px 12px 18px;
  background: #141414;
  border: 1px solid #2A2A2A;
  border-radius: 8px;
  position: relative;
  overflow: hidden;
  font-family: 'Inter', system-ui, sans-serif;
  transition: background 120ms;
}
.cffb-pc-c::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 2px; background: #C9A227;
  transform: scaleY(0);
  transform-origin: top;
  transition: transform 180ms cubic-bezier(0.2,0.8,0.2,1);
}
.cffb-pc-c:hover { background: #1F1F1F; }
.cffb-pc-c:hover::before { transform: scaleY(1); }
.cffb-pc-c__team {
  width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Saira Condensed', system-ui, sans-serif;
  font-weight: 700; font-size: 13px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
}
.cffb-pc-c__pos {
  font-family: 'Saira Condensed', system-ui, sans-serif;
  font-weight: 700; font-size: 14px;
  text-align: center;
  padding: 4px 6px;
  border-radius: 2px;
  letter-spacing: 0;
  color: #0A0A0A;
}
.cffb-pc-c__name {
  font-family: 'Saira Condensed', system-ui, sans-serif;
  font-weight: 700; font-size: 20px;
  text-transform: uppercase;
  letter-spacing: -0.01em;
  color: #F5F5F5; line-height: 1.1;
}
.cffb-pc-c__meta {
  font-size: 12px; color: #9A9A9A; margin-top: 2px;
  display: flex; gap: 6px; align-items: center;
}
.cffb-pc-c__stars { display: inline-flex; gap: 1px; }
.cffb-pc-c__star { color: #C9A227; font-size: 14px; line-height: 1; }
.cffb-pc-c__star--off { color: #2A2A2A; }
.cffb-pc-c__bid {
  font-family: 'Saira Condensed', system-ui, sans-serif;
  font-weight: 700; font-size: 22px;
  color: #F5F5F5;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  min-width: 64px; text-align: right;
}
.cffb-pc-c__delta {
  font-size: 12px; font-weight: 600;
  font-variant-numeric: tabular-nums;
  min-width: 54px; text-align: right;
}
.cffb-pc-c__delta--pos { color: #2D7A4E; }
.cffb-pc-c__delta--neg { color: #B84545; }
</style>
<div class="cffb-pc">
  <div class="cffb-pc-c">
    <div class="cffb-pc-c__team" style="background:#BF5700; color:#fff;">TEX</div>
    <div class="cffb-pc-c__pos" style="background:#C9A227;">QB</div>
    <div>
      <div class="cffb-pc-c__name">Arch Manning</div>
      <div class="cffb-pc-c__meta">Texas · Jr · 6'4" 215</div>
    </div>
    <div class="cffb-pc-c__stars">
      <span class="cffb-pc-c__star">★</span><span class="cffb-pc-c__star">★</span>
      <span class="cffb-pc-c__star">★</span><span class="cffb-pc-c__star">★</span>
      <span class="cffb-pc-c__star">★</span>
    </div>
    <div class="cffb-pc-c__bid">$112</div>
    <div class="cffb-pc-c__delta cffb-pc-c__delta--neg">▼ −$14</div>
  </div>
  <div class="cffb-pc-c">
    <div class="cffb-pc-c__team" style="background:#990000; color:#FEC10C;">UGA</div>
    <div class="cffb-pc-c__pos" style="background:#3B82C4; color:#F5F5F5;">RB</div>
    <div>
      <div class="cffb-pc-c__name">Jeremiyah Love</div>
      <div class="cffb-pc-c__meta">Notre Dame · So · 6'0" 206</div>
    </div>
    <div class="cffb-pc-c__stars" style="color:#3B82C4">
      <span class="cffb-pc-c__star" style="color:#3B82C4">★</span><span class="cffb-pc-c__star" style="color:#3B82C4">★</span>
      <span class="cffb-pc-c__star" style="color:#3B82C4">★</span><span class="cffb-pc-c__star" style="color:#3B82C4">★</span>
      <span class="cffb-pc-c__star cffb-pc-c__star--off">★</span>
    </div>
    <div class="cffb-pc-c__bid">$48</div>
    <div class="cffb-pc-c__delta cffb-pc-c__delta--pos">▲ +$6</div>
  </div>
  <div class="cffb-pc-c">
    <div class="cffb-pc-c__team" style="background:#BB0000; color:#fff;">OSU</div>
    <div class="cffb-pc-c__pos" style="background:#7BA4C9; color:#0A0A0A;">WR</div>
    <div>
      <div class="cffb-pc-c__name">Jeremiah Smith</div>
      <div class="cffb-pc-c__meta">Ohio State · So · 6'3" 215</div>
    </div>
    <div class="cffb-pc-c__stars">
      <span class="cffb-pc-c__star">★</span><span class="cffb-pc-c__star">★</span>
      <span class="cffb-pc-c__star">★</span><span class="cffb-pc-c__star">★</span>
      <span class="cffb-pc-c__star">★</span>
    </div>
    <div class="cffb-pc-c__bid">$94</div>
    <div class="cffb-pc-c__delta cffb-pc-c__delta--pos">▲ +$8</div>
  </div>
</div>

</body></html>
