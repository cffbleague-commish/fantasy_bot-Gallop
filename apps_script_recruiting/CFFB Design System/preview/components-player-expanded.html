<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>PlayerCard · Expanded</title>
<link rel="stylesheet" href="_base.css">
<style>body { padding: 20px; }</style>
</head><body>
<!-- CFFB · PlayerCard (expanded)
     Profile-forward layout: large player photo on the left, identity
     block on the right. No projections / fair value / deltas — those
     require data feeds we don't have. Use the compact card for live
     bid context; this card is for the player's IDENTITY surface.

     Photo slot anatomy:
       • Aspect ~4:5 portrait, 160×200 at default size.
       • In-card label "PHOTO" + silhouette glyph make the slot legible
         even when empty.
       • Team-colored top-bar frames the photo and ties it to the team.
       • Jersey number bottom-right, class chip top-left as broadcast
         lower-third overlays.
       • Drop in <img src="..."/> to replace the silhouette; the team
         color frame and overlays stay layered above it via z-index.
-->
<style>
.cffb-pc-e {
  background: #141414;
  border: 1px solid #2A2A2A;
  border-radius: 8px;
  padding: 20px 24px;
  font-family: 'Inter', system-ui, sans-serif;
  color: #F5F5F5;
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-columns: 168px 1fr;
  gap: 24px;
  align-items: stretch;
}
.cffb-pc-e::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px;
  background: linear-gradient(180deg, #E8C547, #C9A227 50%, #8B6F1F);
}

/* ============ Photo slot ============ */
.cffb-pc-e__photo {
  width: 168px;
  aspect-ratio: 4 / 5;
  border-radius: 6px;
  background: #1C1C1C;
  position: relative;
  overflow: hidden;
  /* Dashed inner outline communicates "drop a photo here" when empty */
  outline: 1px dashed rgba(201,162,39,0.35);
  outline-offset: -8px;
}
.cffb-pc-e__photo img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  z-index: 1;
  filter: saturate(0.88) contrast(1.05);
}
/* Team-colored top bar — sits over the photo, ties team to portrait */
.cffb-pc-e__photo-bar {
  position: absolute; top: 0; left: 0; right: 0;
  height: 4px;
  background: #BF5700; /* default: Texas burnt orange — set per player */
  z-index: 3;
}
/* Empty-state silhouette + label */
.cffb-pc-e__photo-empty {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px;
  z-index: 2;
  color: #3A3A3A;
}
.cffb-pc-e__photo-empty svg { width: 56px; height: 56px; stroke: #3A3A3A; fill: none; stroke-width: 1.5; }
.cffb-pc-e__photo-empty-label {
  font-family: 'Inter', system-ui, sans-serif;
  font-weight: 700; font-size: 10px;
  letter-spacing: 0.24em; text-transform: uppercase;
  color: #5A5A5A;
}
.cffb-pc-e__photo-empty-sub {
  font-family: 'Inter', system-ui, sans-serif;
  font-weight: 500; font-size: 10px;
  color: #3A3A3A;
  margin-top: -8px;
}
/* Broadcast-style overlays on top of photo */
.cffb-pc-e__photo-class {
  position: absolute;
  top: 10px; left: 10px; z-index: 4;
  font-family: 'Saira Condensed', system-ui, sans-serif;
  font-weight: 700; font-size: 11px;
  letter-spacing: 0.08em;
  padding: 3px 7px;
  border-radius: 2px;
  color: #F5F5F5;
  background: rgba(10,10,10,0.78);
  backdrop-filter: blur(4px);
}
.cffb-pc-e__photo-num {
  position: absolute;
  bottom: 10px; right: 12px; z-index: 4;
  font-family: 'Saira Condensed', system-ui, sans-serif;
  font-weight: 700; font-size: 36px;
  line-height: 0.9;
  letter-spacing: -0.04em;
  color: #F5F5F5;
  text-shadow: 0 2px 6px rgba(0,0,0,0.7);
  font-variant-numeric: tabular-nums;
}
.cffb-pc-e__photo-team {
  position: absolute;
  bottom: -10px; left: -10px; z-index: 5;
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Saira Condensed', system-ui, sans-serif;
  font-weight: 700; font-size: 13px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 0 0 3px #141414;
}

/* ============ Identity block ============ */
.cffb-pc-e__id {
  display: flex; flex-direction: column; gap: 10px;
  min-width: 0;
}
.cffb-pc-e__tagrow { display: flex; gap: 6px; align-items: center; }
.cffb-pc-e__pos {
  font-family: 'Saira Condensed', system-ui, sans-serif;
  font-weight: 700; font-size: 12px;
  text-transform: uppercase;
  padding: 3px 7px; border-radius: 2px;
  color: #0A0A0A;
}
.cffb-pc-e__conf {
  font-family: 'Inter', system-ui, sans-serif;
  font-weight: 600; font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase;
  padding: 4px 8px; border-radius: 2px;
}
.cffb-pc-e__name {
  font-family: 'Saira Condensed', system-ui, sans-serif;
  font-weight: 700; font-size: 40px;
  text-transform: uppercase;
  letter-spacing: -0.01em;
  color: #F5F5F5; line-height: 0.95;
}
.cffb-pc-e__meta {
  font-size: 13px; color: #9A9A9A;
}
.cffb-pc-e__stars { display: inline-flex; gap: 2px; }
.cffb-pc-e__star { font-size: 18px; color: #C9A227; }

.cffb-pc-e__facts {
  margin-top: auto;
  display: grid;
  grid-template-columns: repeat(4, auto);
  gap: 24px;
  padding-top: 14px;
  border-top: 1px solid #2A2A2A;
}
.cffb-pc-e__fact-label {
  font-size: 9.5px; font-weight: 600; letter-spacing: 0.14em;
  text-transform: uppercase; color: #9A9A9A;
}
.cffb-pc-e__fact-val {
  font-family: 'Saira Condensed', system-ui, sans-serif;
  font-weight: 700; font-size: 22px;
  color: #F5F5F5; line-height: 1; margin-top: 4px;
  font-variant-numeric: tabular-nums;
}
.cffb-pc-e__fact-val--hero {
  background: linear-gradient(135deg, #E8C547 0%, #C9A227 50%, #8B6F1F 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}

.cffb-pc-e__actions { display: flex; gap: 8px; margin-top: 14px; }
.cffb-pc-e__btn {
  font-family: 'Inter', system-ui, sans-serif;
  font-weight: 600; font-size: 12px;
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 9px 16px;
  border-radius: 4px;
  border: 1px solid transparent;
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
}
.cffb-pc-e__btn--primary { background: linear-gradient(135deg, #E8C547 0%, #C9A227 50%, #8B6F1F 100%); color: #0A0A0A; }
.cffb-pc-e__btn--secondary { background: #1C1C1C; color: #F5F5F5; border-color: #2A2A2A; }
.cffb-pc-e__btn--ghost { background: transparent; color: #9A9A9A; box-shadow: none; }
</style>

<div class="cffb-pc-e">

  <!-- ============ PLAYER PHOTO SLOT ============
       Replace the .cffb-pc-e__photo-empty block with
       <img src="path/to/headshot.jpg" alt="..." />
       The frame, overlays, and team chip stay layered above.
  -->
  <div class="cffb-pc-e__photo">
    <div class="cffb-pc-e__photo-bar" style="background:#BF5700;"></div>
    <!-- IMG GOES HERE — example: <img src="assets/players/arch-manning.jpg" alt="Arch Manning"/> -->
    <div class="cffb-pc-e__photo-empty">
      <svg viewBox="0 0 56 56">
        <circle cx="28" cy="20" r="9"/>
        <path d="M10 50 C10 38 18 32 28 32 C38 32 46 38 46 50"/>
      </svg>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <div class="cffb-pc-e__photo-empty-label">Photo</div>
        <div class="cffb-pc-e__photo-empty-sub">168 × 210</div>
      </div>
    </div>
    <span class="cffb-pc-e__photo-class">JR</span>
    <span class="cffb-pc-e__photo-num">16</span>
    <div class="cffb-pc-e__photo-team" style="background:#BF5700; color:#fff;">TEX</div>
  </div>

  <div class="cffb-pc-e__id">
    <div class="cffb-pc-e__tagrow">
      <span class="cffb-pc-e__pos" style="background:#C9A227;">QB</span>
      <span class="cffb-pc-e__conf" style="background:rgba(255,199,42,0.12); color:#FFC72A; border:1px solid rgba(255,199,42,0.35);">SEC</span>
    </div>
    <div class="cffb-pc-e__name">Arch Manning</div>
    <div class="cffb-pc-e__meta">Texas Longhorns · Junior · 6'4" 215</div>
    <div class="cffb-pc-e__stars">
      <span class="cffb-pc-e__star">★</span><span class="cffb-pc-e__star">★</span>
      <span class="cffb-pc-e__star">★</span><span class="cffb-pc-e__star">★</span>
      <span class="cffb-pc-e__star">★</span>
    </div>

    <div class="cffb-pc-e__facts">
      <div>
        <div class="cffb-pc-e__fact-label">Pos Rank</div>
        <div class="cffb-pc-e__fact-val cffb-pc-e__fact-val--hero">#3</div>
      </div>
      <div>
        <div class="cffb-pc-e__fact-label">Composite</div>
        <div class="cffb-pc-e__fact-val">.9842</div>
      </div>
      <div>
        <div class="cffb-pc-e__fact-label">State</div>
        <div class="cffb-pc-e__fact-val">#1 TX</div>
      </div>
      <div>
        <div class="cffb-pc-e__fact-label">Offers</div>
        <div class="cffb-pc-e__fact-val">34</div>
      </div>
    </div>

    <div class="cffb-pc-e__actions">
      <button class="cffb-pc-e__btn cffb-pc-e__btn--primary">Add to Watch</button>
      <button class="cffb-pc-e__btn cffb-pc-e__btn--secondary">View Profile</button>
      <button class="cffb-pc-e__btn cffb-pc-e__btn--ghost">Compare</button>
    </div>
  </div>

</div>

</body></html>
