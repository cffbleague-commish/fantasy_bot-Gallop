<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--fg-tertiary); width: 80px; flex-shrink: 0; letter-spacing: 0.04em; }
  button {
    font-family: var(--font-body); font-weight: 600; font-size: 12px;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 10px 18px; border-radius: 4px;
    border: 1px solid transparent; cursor: pointer;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    transition: filter 120ms;
  }
  button:hover { filter: brightness(1.08); }
  .btn-gold     { background: var(--gold-gradient); color: #0A0A0A; }
  .btn-primary  { background: #C9A227; color: #0A0A0A; }
  .btn-secondary{ background: #1C1C1C; color: #F5F5F5; border-color: #2A2A2A; }
  .btn-danger   { background: #B84545; color: #F5F5F5; }
  .btn-ghost    { background: transparent; color: #9A9A9A; box-shadow: none; }
  .btn-disabled { background: #1C1C1C; color: #5A5A5A; border-color: #2A2A2A; cursor: not-allowed; box-shadow: none; }
  .btn-sm { padding: 6px 12px; font-size: 11px; }
  .btn-lg { padding: 14px 22px; font-size: 13px; }
</style></head>
<body>
  <div class="row"><div class="label">Gold (hero)</div>
    <button class="btn-gold btn-lg">Bid +$1</button>
    <button class="btn-gold">Confirm Class</button>
  </div>
  <div class="row"><div class="label">Primary</div>
    <button class="btn-primary">Place Bid</button>
    <button class="btn-primary btn-sm">+$1</button>
  </div>
  <div class="row"><div class="label">Secondary</div>
    <button class="btn-secondary">Nominate</button>
    <button class="btn-secondary">Watch</button>
    <button class="btn-secondary btn-sm">Pass</button>
  </div>
  <div class="row"><div class="label">Signal</div>
    <button class="btn-danger">Withdraw</button>
    <button class="btn-ghost">Cancel</button>
    <button class="btn-disabled" disabled>Bid Closed</button>
  </div>
</body></html>
