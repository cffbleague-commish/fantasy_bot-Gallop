<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Radii & Shadows</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .section { display: flex; flex-direction: column; gap: 10px; }
  .label { font-family: var(--font-body); font-weight: 600; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-secondary); }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .box { width: 86px; height: 56px; background: #1C1C1C; border: 1px solid #2A2A2A; }
  .name { font-family: var(--font-body); font-weight: 600; font-size: 11px; color: var(--fg-primary); }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-tertiary); }
</style></head>
<body>
  <div class="section">
    <div class="label">Radii</div>
    <div class="row">
      <div class="item"><div class="box" style="border-radius:2px"></div><div class="name">r-1</div><div class="meta">2px chips</div></div>
      <div class="item"><div class="box" style="border-radius:4px"></div><div class="name">r-2</div><div class="meta">4px btn</div></div>
      <div class="item"><div class="box" style="border-radius:8px"></div><div class="name">r-3</div><div class="meta">8px card</div></div>
      <div class="item"><div class="box" style="border-radius:12px"></div><div class="name">r-4</div><div class="meta">12px sheet</div></div>
      <div class="item"><div class="box" style="border-radius:999px; width:130px;"></div><div class="name">pill</div><div class="meta">999px</div></div>
    </div>
  </div>
  <div class="section">
    <div class="label">Shadows & Glows</div>
    <div class="row">
      <div class="item"><div class="box" style="box-shadow:0 1px 2px rgba(0,0,0,0.5); border-radius:6px;"></div><div class="name">shadow-sm</div></div>
      <div class="item"><div class="box" style="box-shadow:0 8px 24px rgba(0,0,0,0.6); border-radius:6px;"></div><div class="name">shadow-md</div></div>
      <div class="item"><div class="box" style="box-shadow:0 0 24px rgba(201,162,39,0.45); border-color:#C9A227; border-radius:6px;"></div><div class="name">glow-gold</div></div>
      <div class="item"><div class="box" style="box-shadow:0 0 12px rgba(45,122,78,0.65); border-color:#2D7A4E; border-radius:6px;"></div><div class="name">glow-live</div></div>
    </div>
  </div>
</body></html>
