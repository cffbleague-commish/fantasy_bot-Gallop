<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <?!= include('Stylesheet') ?>
</head>
<body>
  <!-- Header -->
  <header class="dashboard-header">
    <h1>Recruiting Analytics</h1>
    <div class="year-picker">
      <label for="yearSelect">Draft Year:</label>
      <select id="yearSelect"></select>
    </div>
  </header>

  <!-- Tab Navigation -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="board">Recruiting Board</button>
    <button class="tab-btn" data-tab="rankings">Team Rankings</button>
    <button class="tab-btn" data-tab="grades">Player Grades</button>
    <button class="tab-btn" data-tab="budget">Budget Tool</button>
  </nav>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <input type="text" id="searchInput" placeholder="Search player or team...">
    <select id="positionFilter">
      <option value="">All Positions</option>
      <option value="QB">QB</option>
      <option value="RB">RB</option>
      <option value="WR">WR</option>
      <option value="TE">TE</option>
    </select>
    <select id="conferenceFilter" style="display:none;">
      <option value="">All Conferences</option>
    </select>
  </div>

  <!-- Tab Panels -->
  <div id="boardPanel" class="tab-panel active">
    <div id="boardLoading" class="loading">Loading recruiting board...</div>
    <div id="boardTable" class="table-container"></div>
  </div>

  <div id="rankingsPanel" class="tab-panel">
    <div id="rankingsLoading" class="loading">Loading team rankings...</div>
    <div id="rankingsTable" class="table-container"></div>
  </div>

  <div id="gradesPanel" class="tab-panel">
    <div id="gradesLoading" class="loading">Loading player grades...</div>
    <div id="gradesTable" class="table-container"></div>
  </div>

  <div id="budgetPanel" class="tab-panel">
    <!-- Budget Summary Bar -->
    <div class="budget-summary" id="budgetSummary">
      <div class="budget-field">
        <label for="budgetInput">Budget:</label>
        <span class="budget-dollar">$</span><input type="number" id="budgetInput" class="budget-input" value="100" min="0" step="1">
      </div>
      <div class="budget-field">
        <span class="budget-label">Remaining:</span>
        <span id="budgetRemaining" class="budget-value">$100</span>
      </div>
      <div class="budget-field">
        <span class="budget-label">Players:</span>
        <span id="budgetPlayers" class="budget-value">0</span>
      </div>
      <div class="budget-field">
        <span class="budget-label">Class Score:</span>
        <span id="budgetClassScore" class="budget-value">0.0</span>
      </div>
      <div class="budget-field">
        <span class="budget-label">Stars:</span>
        <span id="budgetStars" class="budget-value">--</span>
      </div>
      <div class="budget-field">
        <span class="budget-label">Positions:</span>
        <span id="budgetPositions" class="budget-value">--</span>
      </div>
    </div>

    <div id="budgetLoading" class="loading">Loading recruiting board...</div>
    <div id="budgetTable" class="table-container"></div>

    <!-- Your Haul Panel -->
    <div class="haul-panel" id="haulPanel">
      <button class="haul-toggle" id="haulToggle" onclick="toggleHaul()">Your Haul (0 players) &#9650;</button>
      <div class="haul-content" id="haulContent"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="dashboard-footer">
    Data refreshed when board is regenerated in Google Sheets
  </footer>

  <?!= include('JavaScript') ?>
</body>
</html>
