<style>
/* ============================================================
   CFFB.css — College Fantasy Football League stylesheet
   Drop-in stylesheet for MyFantasyLeague custom CSS.

   Built on: CFFB Design System (dark mode, championship gold)
   Inspiration: ESPN GameDay, CFP broadcast graphics, 247sports.

   Sections
   --------
   01  Foundations  — tokens, fonts, reset
   02  Typography   — display + body helpers
   03  Page chrome  — top bar, sidebar, page shell, ticker
   04  Surfaces     — cards, KPI tiles, panels
   05  Tables       — MFL legacy tables + custom data tables
   06  Buttons + forms
   07  Player atoms — name plate, position chip, team chip
   08  NEW · Redshirt chips (traditional + medical bandage)
   09  NEW · Eligibility dots (class + years used)
   10  NEW · Award badges (Heisman, Davey O'Brien, Doak Walker,
            Biletnikoff, Conference All-American)
   11  Misc · stars, conference badges, grade pills, value delta
   12  Utilities
   ============================================================ */


/* ============================================================
   01 · FOUNDATIONS
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root {
  /* Surfaces */
  --bg-canvas:        #0A0A0A;
  --bg-surface:       #141414;
  --bg-surface-elev:  #1C1C1C;
  --bg-surface-hover: #1F1F1F;
  --border:           #2A2A2A;
  --border-strong:    #3A3A3A;

  /* Text */
  --fg-primary:   #F5F5F5;
  --fg-secondary: #9A9A9A;
  --fg-tertiary:  #5A5A5A;

  /* Championship gold */
  --gold:          #C9A227;
  --gold-light:    #E8C547;
  --gold-dark:     #8B6F1F;
  --gold-gradient: linear-gradient(135deg, #E8C547 0%, #C9A227 50%, #8B6F1F 100%);

  /* Star tiers */
  --star-5: #C9A227;
  --star-4: #3B82C4;
  --star-3: #7BA4C9;
  --star-2: #6A6A6A;
  --star-1: #4A4A4A;

  /* Grades */
  --grade-a: #2D7A4E;
  --grade-b: #4A9968;
  --grade-c: #C9A227;
  --grade-d: #B84545;
  --grade-f: #B84545;

  /* Deltas */
  --delta-pos:  #2D7A4E;
  --delta-neg:  #B84545;
  --delta-flat: #5A5A5A;

  /* Live */
  --live: #2D7A4E;

  /* Conferences */
  --conf-sec: #C9A227; --conf-b1g: #4A6FA5; --conf-acc: #8B4A5C;
  --conf-big12: #B84545; --conf-pac: #5C7A6A; --conf-aac: #6B5C8B;
  --conf-mw: #8B6F1F; --conf-ind: #5A5A5A;

  /* Eligibility / Redshirt */
  --rs-trad:    #C9A227;   /* gold shield */
  --rs-medical: #D17575;   /* dusty red bandage */

  /* Type */
  --font-display: 'Saira Condensed', 'Oswald', 'Bebas Neue', system-ui, sans-serif;
  --font-body:    'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono:    ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;

  /* Type scale */
  --ds-hero: 64px; --ds-1: 48px; --ds-2: 32px; --ds-3: 24px; --ds-4: 18px;
  --tx-lg: 16px; --tx-md: 14px; --tx-sm: 13px; --tx-xs: 12px; --tx-2xs: 11px;

  /* Weights */
  --w-400: 400; --w-500: 500; --w-600: 600; --w-700: 700;

  /* Spacing — 8px base */
  --s-half: 4px;
  --s-1:  8px; --s-2: 16px; --s-3: 24px; --s-4: 32px;
  --s-5: 40px; --s-6: 48px; --s-7: 64px; --s-8: 80px;

  /* Radii */
  --r-1: 2px; --r-2: 4px; --r-3: 8px; --r-4: 12px; --r-pill: 999px;

  /* Shadows */
  --shadow-sm:        0 1px 2px rgba(0,0,0,0.5);
  --shadow-md:        0 8px 24px rgba(0,0,0,0.6);
  --shadow-lg:        0 20px 60px rgba(0,0,0,0.7);
  --shadow-glow-gold: 0 0 24px rgba(201,162,39,0.28);
  --shadow-glow-live: 0 0 12px rgba(45,122,78,0.55);
  --inset-metallic:   inset 0 1px 0 rgba(255,255,255,0.06);

  /* Motion */
  --ease-out:   cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-in:    cubic-bezier(0.4, 0, 1, 1);
  --ease-inout: cubic-bezier(0.4, 0, 0.2, 1);
  --dur-fast: 120ms; --dur-base: 180ms; --dur-slow: 240ms;

  /* Layout */
  --container-max: 1280px;
  --topbar-h: 64px;
  --ticker-h: 44px;
}

/* Reset (light, MFL-friendly) */


/* Tabular numerics on anything that holds a number */
.cffb-num, .cffb-num *, td.cffb-num, th.cffb-num {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}


/* ============================================================
   02 · TYPOGRAPHY
   ============================================================ */

.cffb-display-hero,
.cffb-display-1,
.cffb-display-2,
.cffb-display-3,
.cffb-display-4 {
  font-family: var(--font-display);
  text-transform: uppercase;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  margin: 0;
}
.cffb-display-hero { font-weight: 700; font-size: var(--ds-hero); line-height: 1; }
.cffb-display-1    { font-weight: 700; font-size: var(--ds-1); line-height: 1.05; }
.cffb-display-2    { font-weight: 700; font-size: var(--ds-2); line-height: 1.1; }
.cffb-display-3    { font-weight: 600; font-size: var(--ds-3); line-height: 1.15; }
.cffb-display-4    { font-weight: 600; font-size: var(--ds-4); line-height: 1.2; }

.cffb-h1 { font: 700 28px/1.2 var(--font-body); letter-spacing: -0.01em; margin: 0; }
.cffb-h2 { font: 600 20px/1.25 var(--font-body); margin: 0; }
.cffb-h3 { font: 600 16px/1.3 var(--font-body); margin: 0; }
.cffb-body    { font-size: var(--tx-md); color: var(--fg-primary); }
.cffb-body-sm { font-size: var(--tx-sm); color: var(--fg-secondary); }

.cffb-label {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--tx-2xs);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-secondary);
}
.cffb-eyebrow {
  font-family: var(--font-body);
  font-weight: 700;
  font-size: var(--tx-2xs);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold);
}

/* Gold-gradient text — RESERVE for the page's hero value only. */
.cffb-gold-text {
  background: var(--gold-gradient);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}


/* ============================================================
   03 · PAGE CHROME
   ============================================================ */

.cffb-shell {
  min-height: 100vh;
  display: flex; flex-direction: column;
}

/* Top bar — sticky, 64px, holds wordmark + nav + manager chip */
.cffb-topbar {
  position: sticky; top: 0; z-index: 50;
  height: var(--topbar-h);
  background: rgba(10,10,10,0.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 var(--s-3);
  gap: var(--s-3);
}
.cffb-topbar__brand {
  display: flex; align-items: center; gap: var(--s-1);
  font-family: var(--font-display); font-weight: 700;
  text-transform: uppercase; font-size: var(--ds-4);
  letter-spacing: 0.02em;
  color: var(--fg-primary);
  border-right: 1px solid var(--border);
  padding-right: var(--s-3);
  height: 100%;
}
.cffb-topbar__brand-mark {
  width: 28px; height: 28px;
  background: var(--gold-gradient);
  -webkit-mask: url('assets/cffb-mark.svg') center/contain no-repeat;
          mask: url('assets/cffb-mark.svg') center/contain no-repeat;
}
.cffb-topbar__nav {
  display: flex; align-items: center; gap: var(--s-half);
  height: 100%;
}
.cffb-topbar__nav a {
  font-family: var(--font-body); font-weight: 600;
  font-size: var(--tx-sm); letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--fg-secondary);
  padding: 0 var(--s-2); height: 100%;
  display: inline-flex; align-items: center;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  text-decoration: none;
  transition: color var(--dur-fast) var(--ease-out);
}
.cffb-topbar__nav a:hover { color: var(--fg-primary); text-decoration: none; }
.cffb-topbar__nav a.is-active {
  color: var(--fg-primary);
  border-bottom-color: var(--gold);
}
.cffb-topbar__spacer { flex: 1; }
.cffb-topbar__manager {
  display: inline-flex; align-items: center; gap: var(--s-1);
  padding: var(--s-half) var(--s-2);
  background: var(--bg-surface-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-2);
  font-size: var(--tx-sm); font-weight: 600;
}
.cffb-topbar__manager-cap {
  font-variant-numeric: tabular-nums;
  color: var(--gold);
  font-family: var(--font-display);
  font-size: 16px;
}

/* Ticker — sticky under topbar, 44px, scrolls left */
.cffb-ticker {
  position: sticky; top: var(--topbar-h); z-index: 49;
  height: var(--ticker-h);
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  display: flex; align-items: center;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
          mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
}
.cffb-ticker__label {
  position: absolute; left: 0; top: 0; bottom: 0;
  display: inline-flex; align-items: center; gap: var(--s-1);
  padding: 0 var(--s-2);
  background: var(--bg-surface-elev);
  border-right: 1px solid var(--border);
  font-family: var(--font-display); font-weight: 700;
  font-size: var(--tx-sm); letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--gold);
  z-index: 2;
}
.cffb-ticker__track {
  display: inline-flex; align-items: center; gap: var(--s-4);
  white-space: nowrap;
  padding-left: 140px;
  animation: cffb-ticker-scroll 60s linear infinite;
}
.cffb-ticker__item {
  display: inline-flex; align-items: baseline; gap: var(--s-1);
  font-size: var(--tx-sm); color: var(--fg-secondary);
  font-variant-numeric: tabular-nums;
}
.cffb-ticker__item strong {
  font-family: var(--font-display); font-weight: 700;
  color: var(--fg-primary); font-size: var(--tx-md);
  text-transform: uppercase;
}
.cffb-ticker__item em { font-style: normal; color: var(--gold); font-weight: 600; }
.cffb-ticker__sep { color: var(--border-strong); }
@keyframes cffb-ticker-scroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* Page shell */
.cffb-page {
  flex: 1;
  max-width: var(--container-max);
  width: 100%;
  margin: 0 auto;
  padding: var(--s-3) var(--s-3) var(--s-7);
}
.cffb-page__head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: var(--s-3);
  margin-bottom: var(--s-3);
  padding-bottom: var(--s-2);
  border-bottom: 1px solid var(--border);
}
.cffb-page__title {
  font-family: var(--font-display); font-weight: 700;
  font-size: 40px; line-height: 1; text-transform: uppercase;
  letter-spacing: -0.005em;
}

/* Footer */
.cffb-footer {
  border-top: 1px solid var(--border);
  padding: var(--s-3);
  font-size: var(--tx-xs);
  color: var(--fg-tertiary);
  text-align: center;
}


/* ============================================================
   04 · SURFACES — cards, KPI tiles, panels
   ============================================================ */

.cffb-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--r-3);
  padding: var(--s-2) var(--s-3);
}
.cffb-card--featured { box-shadow: var(--inset-metallic); }
.cffb-card--featured::before {
  content: ""; display: block; height: 3px;
  background: var(--gold-gradient);
  margin: calc(var(--s-2) * -1) calc(var(--s-3) * -1) var(--s-2);
  border-radius: var(--r-3) var(--r-3) 0 0;
}
.cffb-card__head {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s-2);
  margin-bottom: var(--s-2);
}
.cffb-card__title {
  font-family: var(--font-display);
  font-weight: 700; font-size: 20px;
  text-transform: uppercase; letter-spacing: 0.02em;
}
.cffb-card__action {
  font-size: var(--tx-xs); color: var(--fg-secondary);
  text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600;
}

/* KPI tile */
.cffb-kpi {
  background: var(--bg-surface-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-3);
  padding: var(--s-2) var(--s-3) 18px;
  display: flex; flex-direction: column; gap: var(--s-1);
  min-width: 0;
}
.cffb-kpi__label { /* alias for .cffb-label */
  font-family: var(--font-body);
  font-weight: 600; font-size: var(--tx-2xs);
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--fg-secondary);
}
.cffb-kpi__value {
  font-family: var(--font-display); font-weight: 700;
  font-size: var(--ds-1); line-height: 1;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
  text-transform: uppercase;
}
.cffb-kpi__value--hero {
  background: var(--gold-gradient);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.cffb-kpi__sub {
  font-size: var(--tx-xs); color: var(--fg-secondary);
  font-variant-numeric: tabular-nums;
}
.cffb-kpi__sub--pos { color: var(--delta-pos); }
.cffb-kpi__sub--neg { color: var(--delta-neg); }
.cffb-kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-2); }

/* Live indicator */
.cffb-live {
  display: inline-flex; align-items: center; gap: var(--s-1);
  font-family: var(--font-body); font-weight: 700;
  font-size: var(--tx-2xs); letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--live);
}
.cffb-live__dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--live);
  box-shadow: var(--shadow-glow-live);
  animation: cffb-live-pulse 1.4s ease-in-out infinite;
}
@keyframes cffb-live-pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50%      { transform: scale(0.7); opacity: 0.55; }
}


/* ============================================================
   05 · TABLES (MFL legacy + custom)
   ============================================================ */

.cffb-table-wrap {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--r-3);
  overflow: hidden;
}
.cffb-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--tx-sm);
  font-variant-numeric: tabular-nums;
}
.cffb-table thead th {
  text-align: left;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--tx-2xs);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-secondary);
  padding: 12px var(--s-2);
  background: var(--bg-surface-elev);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.cffb-table tbody td {
  padding: 12px var(--s-2);
  border-bottom: 1px solid var(--border);
  color: var(--fg-primary);
  vertical-align: middle;
}
.cffb-table tbody tr:last-child td { border-bottom: none; }
.cffb-table tbody tr {
  position: relative;
  transition: background var(--dur-fast);
}
.cffb-table tbody tr:hover { background: var(--bg-surface-hover); }
.cffb-table tbody tr:hover td:first-child { box-shadow: inset 2px 0 0 var(--gold); }
.cffb-table tbody tr.is-active td:first-child { box-shadow: inset 2px 0 0 var(--gold); }
.cffb-table__num { text-align: right; }
.cffb-table__rank {
  font-family: var(--font-display); font-weight: 700;
  color: var(--fg-secondary);
  width: 40px; text-align: center;
}


/* ============================================================
   06 · BUTTONS + FORMS
   ============================================================ */

.cffb-btn {
  display: inline-flex; align-items: center; gap: var(--s-1);
  font-family: var(--font-body); font-weight: 600;
  font-size: var(--tx-xs); letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: var(--r-2);
  background: var(--bg-surface-elev);
  color: var(--fg-primary);
  cursor: pointer;
  box-shadow: var(--inset-metallic);
  transition: filter var(--dur-fast) var(--ease-out), background var(--dur-fast);
}
.cffb-btn:hover { filter: brightness(1.08); }
.cffb-btn:active { filter: brightness(0.9); }
.cffb-btn--primary {
  background: var(--gold-gradient);
  color: #0A0A0A;
  border-color: transparent;
}
.cffb-btn--ghost {
  background: transparent;
  color: var(--fg-secondary);
  border-color: transparent;
  box-shadow: none;
}
.cffb-btn--sm { padding: 6px 10px; font-size: 10px; }

.cffb-input {
  font-family: var(--font-body); font-size: var(--tx-md);
  padding: 10px 12px;
  background: var(--bg-surface-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-2);
  color: var(--fg-primary);
  width: 100%;
}
.cffb-input::placeholder { color: var(--fg-tertiary); }
.cffb-input:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201,162,39,0.18);
}


/* ============================================================
   07 · PLAYER ATOMS — name plate, position chip, team chip
   ============================================================ */

.cffb-player {
  display: inline-flex; align-items: center; gap: var(--s-1);
  min-width: 0;
}
.cffb-player__name {
  font-family: var(--font-display);
  font-weight: 700; font-size: 18px;
  text-transform: uppercase; letter-spacing: -0.005em;
  color: var(--fg-primary);
  white-space: nowrap;
}
.cffb-player__meta {
  font-size: var(--tx-xs); color: var(--fg-secondary);
  font-variant-numeric: tabular-nums;
}

.cffb-pos {
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; font-size: 12px;
  min-width: 28px; padding: 3px 6px;
  border-radius: var(--r-1);
  color: #0A0A0A;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.cffb-pos--qb { background: #C9A227; }
.cffb-pos--rb { background: #3B82C4; color: #F5F5F5; }
.cffb-pos--wr { background: #7BA4C9; }
.cffb-pos--te { background: #8B6F1F; color: #F5F5F5; }
.cffb-pos--ol { background: #6A6A6A; color: #F5F5F5; }
.cffb-pos--def, .cffb-pos--lb, .cffb-pos--db { background: #B84545; color: #F5F5F5; }
.cffb-pos--k  { background: #5C7A6A; color: #F5F5F5; }

/* Team logo — canonical "ripped pill" PNGs in assets/teams/<slug>.png.
   Conference badge on left, torn-paper edge, team art on right (250×60).
   Sizes match the design system: sm 30px, md 48px, lg 60px tall. */
.cffb-team {
  display: inline-block;
  height: 48px; width: auto;
  vertical-align: middle;
  flex-shrink: 0;
}
.cffb-team--sm { height: 30px; }
.cffb-team--md { height: 48px; }
.cffb-team--lg { height: 60px; }

/* Team chip — circular fallback for teams without ripped art yet */
.cffb-team-chip {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px;
  border-radius: 50%;
  font-family: var(--font-display); font-weight: 700;
  font-size: 11px; letter-spacing: 0;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
  flex-shrink: 0;
}
.cffb-team-chip--sm { width: 24px; height: 24px; font-size: 9px; }
.cffb-team-chip--lg { width: 48px; height: 48px; font-size: 14px; }


/* ============================================================
   08 · REDSHIRT CHIPS — Traditional + Medical (NEW)
   ------------------------------------------------------------
   Sits inline next to a player's name. Shield silhouette,
   gold for traditional, dusty-red bandage for medical.

   Markup:
     <span class="cffb-rs cffb-rs--trad" title="Traditional Redshirt">
       <svg class="cffb-rs__icon" viewBox="0 0 20 22">…shield…</svg>
       <span class="cffb-rs__txt">RS</span>
     </span>
     <span class="cffb-rs cffb-rs--med" title="Medical Redshirt">
       <svg class="cffb-rs__icon" viewBox="0 0 20 22">…shield+bandage…</svg>
       <span class="cffb-rs__txt">MRS</span>
     </span>

   Sizes: --xs (12px), --sm (14px default), --md (18px)
   ------------------------------------------------------------ */

.cffb-rs {
  display: inline-flex; align-items: center;
  gap: 4px;
  vertical-align: middle;
  cursor: help;
}
.cffb-rs__icon {
  display: block;
  width: 14px; height: auto;
  flex-shrink: 0;
}
.cffb-rs__txt {
  font-family: var(--font-display); font-weight: 700;
  font-size: 10px; letter-spacing: 0.06em;
  text-transform: uppercase;
  line-height: 1;
}

/* Sizes */
.cffb-rs--xs .cffb-rs__icon { width: 10px; }
.cffb-rs--xs .cffb-rs__txt  { font-size: 8.5px; }
.cffb-rs--sm .cffb-rs__icon { width: 14px; }
.cffb-rs--sm .cffb-rs__txt  { font-size: 10px; }
.cffb-rs--md .cffb-rs__icon { width: 18px; }
.cffb-rs--md .cffb-rs__txt  { font-size: 12px; }

/* Traditional */
.cffb-rs--trad           { color: var(--rs-trad); }
.cffb-rs--trad .cffb-rs__icon { stroke: var(--rs-trad); fill: rgba(201,162,39,0.08); }

/* Medical */
.cffb-rs--med            { color: var(--rs-medical); }
.cffb-rs--med .cffb-rs__icon { stroke: var(--rs-medical); fill: rgba(209,117,117,0.08); }

/* Icon-only variant (no text), used in tight rows/tables */
.cffb-rs--solo .cffb-rs__txt { display: none; }
.cffb-rs--solo { gap: 0; }


/* ============================================================
   09 · ELIGIBILITY DOTS — class + years used (NEW)
   ------------------------------------------------------------
   Class label (FR / SO / JR / SR / GR) + 5 dots showing years
   used / remaining. Redshirt years marked with a ring (◎) instead
   of a fill — communicates "burned a year but no eligibility used".

   Markup:
     <span class="cffb-elig">
       <span class="cffb-elig__class">JR</span>
       <span class="cffb-elig__dots" aria-label="2 of 5 eligibility used">
         <span class="cffb-elig__dot is-used"></span>
         <span class="cffb-elig__dot is-rs"></span>   ← redshirt
         <span class="cffb-elig__dot is-used"></span>
         <span class="cffb-elig__dot"></span>
         <span class="cffb-elig__dot"></span>
       </span>
       <span class="cffb-elig__remain">2 left</span>
     </span>
   ------------------------------------------------------------ */

.cffb-elig {
  display: inline-flex; align-items: center; gap: var(--s-1);
  font-family: var(--font-body);
  font-variant-numeric: tabular-nums;
  vertical-align: middle;
}
.cffb-elig__class {
  font-family: var(--font-display); font-weight: 700;
  font-size: 13px; letter-spacing: 0.04em;
  text-transform: uppercase;
  min-width: 26px; padding: 3px 6px;
  border: 1px solid var(--border-strong);
  border-radius: var(--r-1);
  color: var(--fg-primary);
  text-align: center;
  background: var(--bg-surface-elev);
}
.cffb-elig__class--fr { border-color: var(--gold-dark); color: var(--gold-light); }
.cffb-elig__class--so { border-color: var(--gold-dark); color: var(--gold-light); }
.cffb-elig__class--jr { border-color: var(--gold); color: var(--gold); }
.cffb-elig__class--sr { border-color: var(--gold); color: var(--gold); }
.cffb-elig__class--gr { border-color: var(--gold-light); color: var(--gold-light); background: rgba(201,162,39,0.12); }

.cffb-elig__dots {
  display: inline-flex; gap: 3px; align-items: center;
}
.cffb-elig__dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  border: 1.5px solid var(--border-strong);
  background: transparent;
  transition: background var(--dur-fast);
}
.cffb-elig__dot.is-used {
  background: var(--gold);
  border-color: var(--gold);
}
.cffb-elig__dot.is-rs {
  /* Redshirt: filled ring with hollow center — "year burned, no game time" */
  background:
    radial-gradient(circle, transparent 0 2.5px, var(--rs-trad) 2.5px 100%);
  border-color: var(--rs-trad);
}
.cffb-elig__dot.is-rs-med {
  background:
    radial-gradient(circle, transparent 0 2.5px, var(--rs-medical) 2.5px 100%);
  border-color: var(--rs-medical);
}
.cffb-elig__remain {
  font-size: var(--tx-xs); color: var(--fg-secondary);
  font-weight: 600;
  margin-left: 2px;
}

/* Compact variant — no remaining label, no class chip */
.cffb-elig--compact { gap: var(--s-half); }
.cffb-elig--compact .cffb-elig__class { display: none; }
.cffb-elig--compact .cffb-elig__remain { display: none; }


/* ============================================================
   10 · AWARD BADGES — Heisman, Davey O'Brien, Doak Walker,
        Biletnikoff, Conference All-American (NEW)
   ------------------------------------------------------------
   Stacked horizontal badges with a stroke-icon glyph, award
   name, and year. The Heisman is the hero — metallic gold
   gradient fill; the four position awards share a uniform
   gold-outline treatment. Conference All-American picks up the
   player's conference accent color.

   Markup:
     <div class="cffb-awards">
       <span class="cffb-award cffb-award--heisman">
         <svg class="cffb-award__glyph" viewBox="0 0 24 24">…</svg>
         <span class="cffb-award__name">Heisman</span>
         <span class="cffb-award__year">2024</span>
       </span>
       <span class="cffb-award cffb-award--obrien">…</span>
       …
     </div>
   ------------------------------------------------------------ */

.cffb-awards {
  display: flex; flex-wrap: wrap;
  gap: var(--s-1);
  align-items: center;
}

.cffb-award {
  display: inline-flex; align-items: center; gap: var(--s-1);
  padding: 5px 10px 5px 8px;
  border-radius: var(--r-2);
  border: 1px solid var(--border-strong);
  background: var(--bg-surface-elev);
  font-family: var(--font-body);
  font-size: var(--tx-xs); font-weight: 600;
  color: var(--fg-primary);
  white-space: nowrap;
  transition: filter var(--dur-fast);
  cursor: default;
}
.cffb-award:hover { filter: brightness(1.08); }

.cffb-award__glyph {
  width: 16px; height: 16px;
  flex-shrink: 0;
  stroke: currentColor; fill: none; stroke-width: 1.75;
  color: var(--gold);
}
.cffb-award__name {
  letter-spacing: 0.04em;
}
.cffb-award__year {
  color: var(--fg-secondary);
  font-variant-numeric: tabular-nums;
  font-weight: 500;
  font-size: 11px;
}

/* Heisman — hero treatment, metallic gold fill */
.cffb-award--heisman {
  background: var(--gold-gradient);
  border-color: transparent;
  color: #0A0A0A;
  box-shadow: var(--shadow-glow-gold), var(--inset-metallic);
  font-weight: 700;
}
.cffb-award--heisman .cffb-award__glyph { color: #0A0A0A; stroke-width: 2; }
.cffb-award--heisman .cffb-award__year  { color: rgba(10,10,10,0.65); }

/* Position awards — gold outline */
.cffb-award--obrien,
.cffb-award--walker,
.cffb-award--biletnikoff {
  border-color: rgba(201,162,39,0.45);
  background: rgba(201,162,39,0.06);
}

/* Conference All-American — picks up conference color */
.cffb-award--allamerican {
  border-color: rgba(154,154,154,0.35);
}
.cffb-award--allamerican.is-sec   { border-color: rgba(201,162,39,0.45); color: var(--fg-primary); }
.cffb-award--allamerican.is-sec .cffb-award__glyph { color: var(--gold); }
.cffb-award--allamerican.is-b1g   { border-color: rgba(74,111,165,0.55); }
.cffb-award--allamerican.is-b1g .cffb-award__glyph { color: #7DA0CC; }
.cffb-award--allamerican.is-acc   { border-color: rgba(139,74,92,0.55); }
.cffb-award--allamerican.is-acc .cffb-award__glyph { color: #C58DA0; }
.cffb-award--allamerican.is-big12 { border-color: rgba(184,69,69,0.55); }
.cffb-award--allamerican.is-big12 .cffb-award__glyph { color: #D88787; }
.cffb-award--allamerican.is-pac   { border-color: rgba(92,122,106,0.55); }
.cffb-award--allamerican.is-pac .cffb-award__glyph { color: #9CB8A8; }

/* Size variants */
.cffb-awards--sm .cffb-award { padding: 3px 8px 3px 6px; font-size: 11px; gap: 5px; }
.cffb-awards--sm .cffb-award__glyph { width: 13px; height: 13px; }
.cffb-awards--sm .cffb-award__year { font-size: 10px; }


/* ============================================================
   11 · MISC — stars, conference badges, grade pills, value delta
   ============================================================ */

/* Stars */
.cffb-stars { display: inline-flex; align-items: center; gap: 2px; }
.cffb-star { font-size: 14px; line-height: 1; color: var(--star-5); }
.cffb-star--off { color: var(--border); }
.cffb-stars--t5 .cffb-star { color: var(--star-5); }
.cffb-stars--t4 .cffb-star { color: var(--star-4); }
.cffb-stars--t3 .cffb-star { color: var(--star-3); }
.cffb-stars--t2 .cffb-star { color: var(--star-2); }

/* Conference badges */
.cffb-conf {
  display: inline-flex; align-items: center;
  font-family: var(--font-body); font-weight: 600;
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 4px 8px; border-radius: var(--r-1);
  border: 1px solid transparent; color: var(--fg-primary);
}
.cffb-conf--sec   { background: rgba(201,162,39,0.15); color: var(--gold); border-color: rgba(201,162,39,0.4); }
.cffb-conf--b1g   { background: rgba(74,111,165,0.15); color: #7DA0CC; border-color: rgba(74,111,165,0.4); }
.cffb-conf--acc   { background: rgba(139,74,92,0.18); color: #C58DA0; border-color: rgba(139,74,92,0.45); }
.cffb-conf--big12 { background: rgba(184,69,69,0.15); color: #D88787; border-color: rgba(184,69,69,0.4); }
.cffb-conf--pac   { background: rgba(92,122,106,0.18); color: #9CB8A8; border-color: rgba(92,122,106,0.45); }
.cffb-conf--aac   { background: rgba(107,92,139,0.18); color: #A799C0; border-color: rgba(107,92,139,0.45); }
.cffb-conf--mw    { background: rgba(139,111,31,0.18); color: #BFA058; border-color: rgba(139,111,31,0.45); }
.cffb-conf--ind   { background: var(--bg-surface-elev); color: var(--fg-secondary); border-color: var(--border); }

/* Grade pill */
.cffb-grade {
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700;
  letter-spacing: -0.02em; text-transform: uppercase;
  border-radius: var(--r-2);
  padding: 4px 10px 5px; color: var(--fg-primary);
  font-size: 20px;
}
.cffb-grade--sm { font-size: 14px; padding: 2px 6px 3px; }
.cffb-grade--lg { font-size: 36px; padding: 6px 16px 8px; line-height: 1; }
.cffb-grade--a  { background: var(--gold-gradient); color: #0A0A0A; box-shadow: 0 0 12px rgba(201,162,39,0.25); }
.cffb-grade--b  { background: var(--grade-a); color: var(--fg-primary); }
.cffb-grade--bp { background: var(--grade-b); color: var(--fg-primary); }
.cffb-grade--c  { background: var(--gold); color: #0A0A0A; }
.cffb-grade--d  { background: var(--grade-d); color: var(--fg-primary); }
.cffb-grade--f  { background: var(--grade-f); color: var(--fg-primary); }

/* Value delta */
.cffb-delta {
  display: inline-flex; align-items: center; gap: 3px;
  font-family: var(--font-body); font-weight: 600;
  font-variant-numeric: tabular-nums;
  font-size: var(--tx-sm);
}
.cffb-delta--pos  { color: var(--delta-pos); }
.cffb-delta--neg  { color: var(--delta-neg); }
.cffb-delta--flat { color: var(--delta-flat); }
.cffb-delta__arrow { font-size: 0.85em; line-height: 1; }


/* ============================================================
   12 · UTILITIES
   ============================================================ */

.cffb-row     { display: flex; gap: var(--s-2); align-items: center; }
.cffb-row--sb { justify-content: space-between; }
.cffb-row--end{ justify-content: flex-end; }
.cffb-stack   { display: flex; flex-direction: column; gap: var(--s-1); }
.cffb-stack--2 { gap: var(--s-2); }
.cffb-stack--3 { gap: var(--s-3); }

.cffb-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2); }
.cffb-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-2); }
.cffb-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-2); }

.cffb-divider { height: 1px; background: var(--border); margin: var(--s-2) 0; }
.cffb-spacer  { flex: 1; }

.cffb-muted     { color: var(--fg-secondary); }
.cffb-tertiary  { color: var(--fg-tertiary); }
.cffb-gold      { color: var(--gold); }
.cffb-mono      { font-family: var(--font-mono); }

.cffb-mt-1 { margin-top: var(--s-1); }
.cffb-mt-2 { margin-top: var(--s-2); }
.cffb-mt-3 { margin-top: var(--s-3); }
.cffb-mb-2 { margin-bottom: var(--s-2); }

/* CFFB · Roster Board — module styles (extends cffb.css) */
/* Responsive by CONTAINER width — the module adapts to the space MFL gives it,
   not the browser window, so it works in any page column or phone. */
#cffb-rb-root{container-type:inline-size}
.rb-wrap{max-width:1240px;margin:0 auto;padding:24px 24px 64px}
.rb-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.rb-head__title{font-family:var(--font-display);font-weight:700;font-size:34px;line-height:1;text-transform:uppercase;letter-spacing:.01em;color:var(--fg-primary)}
.rb-head__eyebrow{font:700 10px/1 var(--font-body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.rb-head__meta{display:flex;align-items:center;gap:8px;font:600 11px/1 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-secondary)}
.rb-head__meta .dot{width:5px;height:5px;border-radius:50%;background:var(--gold)}
/* Conference tab strip + team dropdown */
.rb-tabs{display:flex;flex-wrap:wrap;gap:6px;padding:6px;background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;margin-bottom:16px}
.rb-conftab{position:relative}
.rb-conflogo{width:26px;height:26px;object-fit:contain;flex:none}
.rb-caret{font-size:10px;color:var(--fg-tertiary);margin-left:2px}
.rb-tab__cur{font:700 10px/1 var(--font-body);letter-spacing:.08em;color:var(--gold);background:rgba(201,162,39,.1);border:1px solid rgba(201,162,39,.35);border-radius:2px;padding:3px 5px}
.rb-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:150px;max-height:min(60vh,360px);overflow-y:auto;display:flex;flex-direction:column;gap:2px;padding:4px;background:var(--bg-surface-elev);border:1px solid var(--border);border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.6)}
.rb-menu--right{left:auto;right:0}
.rb-menu__item{display:flex;align-items:center;gap:10px;cursor:pointer;padding:7px 9px;border-radius:3px;border:none;background:transparent;color:var(--fg-secondary);text-align:left;transition:background 120ms cubic-bezier(.2,.8,.2,1),color 120ms}
.rb-menu__item:hover{background:var(--bg-surface-hover);color:var(--fg-primary)}
.rb-menu__item.is-active{background:rgba(201,162,39,.08);color:var(--fg-primary);box-shadow:inset 2px 0 0 var(--gold)}
.rb-menu__abbr{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.02em;text-transform:uppercase}
.rb-tab{display:flex;align-items:center;gap:8px;flex:none;cursor:pointer;padding:8px 12px 8px 8px;border-radius:4px;border:1px solid transparent;background:transparent;color:var(--fg-secondary);font:600 12px/1 var(--font-body);transition:background 140ms cubic-bezier(.2,.8,.2,1),color 140ms}
.rb-tab:hover{background:var(--bg-surface-hover);color:var(--fg-primary)}
.rb-tab.is-active{background:var(--bg-surface-elev);border-color:rgba(201,162,39,.5);color:var(--fg-primary)}
.rb-tab__abbr{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.02em;text-transform:uppercase}
.rb-tab__you{font:700 8px/1 var(--font-body);letter-spacing:.14em;color:#0A0A0A;background:var(--gold);border-radius:2px;padding:2px 4px}
/* Team summary card */
.rb-team{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 20px;background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;border-top:3px solid var(--gold);margin-bottom:16px}
.rb-team__name{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1;text-transform:uppercase;color:var(--fg-primary)}
.rb-team__owner{font:500 12px/1.4 var(--font-body);color:var(--fg-secondary)}
.rb-team__kpis{display:flex;gap:24px;margin-left:auto;flex-wrap:wrap}
.rb-kpi{display:flex;flex-direction:column;gap:5px;min-width:64px}
.rb-kpi__label{font:700 9px/1 var(--font-body);letter-spacing:.16em;text-transform:uppercase;color:var(--fg-tertiary)}
.rb-kpi__val{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1;color:var(--fg-primary);font-variant-numeric:tabular-nums}
.rb-kpi__val.is-gold{background:var(--gold-gradient);-webkit-background-clip:text;background-clip:text;color:transparent}
/* Roster table */
.rb-table{background:var(--bg-surface);border:1px solid var(--border);border-radius:8px;overflow-x:auto}
.rb-table>*{min-width:1100px}
.rb-cols{display:grid;grid-template-columns:minmax(210px,1.5fr) 56px 150px 96px minmax(150px,1.2fr) 118px 76px 132px;gap:12px;align-items:center;padding:0 16px}
.rb-thead{border-bottom:1px solid var(--border);background:var(--bg-surface-elev)}
.rb-thead span{font:700 9px/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-tertiary);padding:11px 0;display:block}
.rb-thead .t-r,.rb-row .t-r{text-align:right}
.rb-group{display:flex;align-items:center;gap:10px;padding:9px 16px;background:#101010;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.rb-group:first-of-type{border-top:none}
.rb-group__pos{font-family:var(--font-display);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-primary)}
.rb-group__bar{width:8px;height:16px;border-radius:1px}
.rb-group__n{font:600 10px/1 var(--font-body);color:var(--fg-tertiary);letter-spacing:.1em}
.rb-group__pts{margin-left:auto;font:600 11px/1 var(--font-body);color:var(--fg-secondary);font-variant-numeric:tabular-nums}
.rb-group--squad{border-top:1px dashed var(--border-strong,#3A3A3A);background:#0D0D0D;padding-top:12px;padding-bottom:12px}
.rb-group--squad .rb-group__pos{color:var(--gold)}
.rb-group--ir .rb-group__pos{color:#D88787}
.rb-group__note{margin-left:auto;font:500 10.5px/1 var(--font-body);color:var(--fg-tertiary);letter-spacing:.04em}
.rb-inel{font:700 8px/1 var(--font-body);letter-spacing:.12em;color:#D88787;border:1px solid rgba(184,69,69,.5);border-radius:2px;padding:2px 4px;cursor:help}
.rb-row{position:relative;padding-top:9px;padding-bottom:9px;border-bottom:1px solid rgba(42,42,42,.55);transition:background 140ms cubic-bezier(.2,.8,.2,1)}
.rb-row:last-child{border-bottom:none}
.rb-row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold);transform:scaleY(0);transition:transform 140ms cubic-bezier(.2,.8,.2,1)}
.rb-row:hover{background:var(--bg-surface-hover)}
.rb-row:hover::before{transform:scaleY(1)}
.rb-row.is-dim>*:not(.rb-cell-status){opacity:.55}
/* Player cell */
.rb-player{display:flex;align-items:center;gap:12px;min-width:0}
.rb-photo{position:relative;width:40px;height:40px;flex:none;border-radius:5px;background:var(--bg-surface-elev);overflow:hidden;outline:1px dashed rgba(201,162,39,.28);outline-offset:-4px;display:flex;align-items:center;justify-content:center}
.rb-photo__bar{position:absolute;top:0;left:0;right:0;height:3px}
.rb-photo__init{font-family:var(--font-display);font-weight:700;font-size:13px;letter-spacing:.04em;color:#5A5A5A}
.rb-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rb-pname{min-width:0}
.rb-pname__name{display:flex;align-items:center;gap:7px;font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1.1;text-transform:uppercase;color:var(--fg-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-pname__sub{font:500 10.5px/1.3 var(--font-body);color:var(--fg-tertiary);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Medical redshirt eligibility dot */
.cffb-elig__dot.is-rs-med{background:radial-gradient(circle,transparent 0 2.5px,var(--rs-medical,#D17575) 2.5px 100%)}
/* Distinct per-class eligibility colors (override cffb.css's gold-only scheme):
   FR green → SO blue → JR purple → SR gold → GR red. Loaded after cffb.css so
   it wins at equal specificity. The R- redshirt prefix is stripped before the
   modifier is applied, so a redshirt junior still colors as JR. */
.cffb-elig__class--fr{border-color:#3E7D57;color:#6FBF8E;background:rgba(74,153,104,.08)}
.cffb-elig__class--so{border-color:#41608C;color:#85A9D6;background:rgba(74,111,165,.10)}
.cffb-elig__class--jr{border-color:#6E5794;color:#B79AD9;background:rgba(139,111,176,.10)}
.cffb-elig__class--sr{border-color:#C9A227;color:#E8C547;background:rgba(201,162,39,.10)}
.cffb-elig__class--gr{border-color:#9E4141;color:#D88787;background:rgba(184,69,69,.12)}
/* Status (injury / redshirt-now) tags */
.rb-status{display:inline-flex;align-items:center;gap:6px;font:600 10px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:2px;border:1px solid var(--border);color:var(--fg-secondary);cursor:help}
.rb-status .d{width:6px;height:6px;border-radius:50%;flex:none}
.rb-status--ok{border-color:rgba(45,122,78,.4);color:#4A9968}
.rb-status--q{border-color:rgba(201,162,39,.45);color:var(--gold)}
.rb-status--o{border-color:rgba(184,69,69,.55);color:#D88787}
.rb-status--rs{border-color:rgba(201,162,39,.35);color:var(--gold);background:rgba(201,162,39,.06)}
.rb-none{color:var(--fg-tertiary)}
.rb-mob-status{display:none}
/* Points */
.rb-pts{font-family:var(--font-display);font-weight:700;font-size:17px;color:var(--fg-primary);font-variant-numeric:tabular-nums}
.rb-pts.is-zero{color:var(--fg-tertiary)}
/* Other copy cell — logo pill only */
.rb-copy{display:inline-flex;align-items:center;cursor:pointer;border-radius:15px;transition:filter 140ms cubic-bezier(.2,.8,.2,1)}
.rb-copy:hover{filter:brightness(1.15)}
.rb-foot{display:flex;gap:16px;flex-wrap:wrap;padding:12px 16px;font:500 10.5px/1.5 var(--font-body);color:var(--fg-tertiary);border-top:1px solid var(--border)}
@container (max-width:720px){
.rb-wrap{padding:16px 12px 48px}
.rb-head__title{font-size:28px}
.rb-team__kpis{margin-left:0;width:100%;justify-content:space-between;gap:12px}
.rb-table>*{min-width:0}
.rb-thead.rb-cols{display:none}
.rb-cols{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.rb-row{padding:10px 12px}
.rb-player{width:100%;padding-right:70px;gap:10px}
.rb-photo{width:32px;height:32px}
.rb-photo__init{font-size:11px}
.rb-pname__name{font-size:15px}
.rb-pts{position:absolute;top:11px;right:12px;font-size:15px}
.rb-pts::after{content:" pts";font:600 9px/1 var(--font-body);color:var(--fg-tertiary);letter-spacing:.08em}
.rb-group__note{display:none}
/* Condensed award badges: glyph + year only */
.cffb-award__name{display:none}
.cffb-awards--sm .cffb-award{padding:3px 6px;gap:4px}
.rb-status{padding:3px 6px;font-size:9px}
.cffb-elig__class{font-size:10px}
/* Other-copy pill drops off on small screens */
.rb-cell-copy{display:none}
/* Status tag moves up beside the player name */
.rb-cell-status{display:none}
.rb-mob-status{display:inline-flex;margin-left:2px}
/* Condensed conference tabs: logo + caret only (active keeps team abbr chip) */
.rb-tabs{gap:4px;padding:4px}
.rb-tab{padding:7px 8px;gap:5px}
.rb-tab .rb-tab__abbr{display:none}
.rb-conflogo{width:24px;height:24px}
.rb-team__name{font-size:22px}
}

.cffb-boot{padding:40px;text-align:center;color:var(--fg-secondary,#9A9A96);font-family:var(--font-body,sans-serif)}
.cffb-boot--err{color:#D88787}
#cffb-rb-root .rb-plink{color:var(--fg-primary,#F5F5F5) !important;text-decoration:none}
#cffb-rb-root .rb-plink:hover{color:#D88787 !important;text-decoration:underline;text-underline-offset:3px}
.rb-copy-badge{display:inline-flex;align-items:center;font:700 10px/1 var(--font-body,sans-serif);letter-spacing:.08em;color:var(--fg-tertiary,#6A6A66);border:1px solid var(--border,#262629);border-radius:2px;padding:3px 5px}
#cffb-rb-root .rb-copy .cffb-team{height:20px;width:auto;max-width:110px;object-fit:contain}
.rb-flag{display:inline-flex;align-items:center;justify-content:center;font-size:11px;line-height:1;color:#E8C547;cursor:help;flex:none}
#cffb-rb-root .rb-manage-btn{margin-left:auto;align-self:center;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font:700 11px/1 var(--font-body,sans-serif);letter-spacing:.06em;text-transform:uppercase;color:#0A0A0A;background:var(--gold-gradient,linear-gradient(135deg,#E8C547,#C9A227 50%,#8B6F1F));border:none;border-radius:4px;padding:9px 14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
#cffb-rb-root .rb-manage-btn:hover{filter:brightness(1.07)}
.rb-modal{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;background:rgba(0,0,0,.66);overflow-y:auto}
.rb-modal__box{width:100%;max-width:560px;background:var(--bg-surface,#141414);border:1px solid var(--border,#2A2A2A);border-top:3px solid var(--gold,#C9A227);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.rb-modal__head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 20px 8px}
.rb-modal__eyebrow{font:700 9px/1 var(--font-body,sans-serif);letter-spacing:.2em;text-transform:uppercase;color:var(--gold,#C9A227);margin-bottom:7px}
.rb-modal__title{font-family:var(--font-display,sans-serif);font-weight:700;font-size:22px;line-height:1;text-transform:uppercase;color:var(--fg-primary,#F5F5F5)}
#cffb-rb-root .rb-modal__x{cursor:pointer;background:transparent;border:none;color:var(--fg-secondary,#9A9A9A);font-size:18px;line-height:1;padding:4px 6px;border-radius:4px}
#cffb-rb-root .rb-modal__x:hover{color:var(--fg-primary,#F5F5F5);background:var(--bg-surface-hover,#1F1F1F)}
.rb-modal__note{padding:0 20px 12px;font:500 11px/1.5 var(--font-body,sans-serif);color:var(--fg-tertiary,#6A6A66)}
.rb-mng__load{padding:24px 20px;text-align:center;font:500 12px/1.4 var(--font-body,sans-serif);color:var(--fg-secondary,#9A9A9A)}
.rb-mng__load--err{color:#D88787}
.rb-mng__result{margin:0 20px 12px;padding:10px 12px;border-radius:6px;font:600 12px/1.4 var(--font-body,sans-serif)}
.rb-mng__result.is-ok{color:#8FCBA4;background:rgba(45,122,78,.12);border:1px solid rgba(45,122,78,.4)}
.rb-mng__result.is-err{color:#E4A6A6;background:rgba(184,69,69,.12);border:1px solid rgba(184,69,69,.45)}
.rb-mng__confirm{margin:0 20px 12px;padding:12px;border-radius:6px;background:var(--bg-surface-elev,#1C1C1C);border:1px solid var(--gold,#C9A227);display:flex;flex-direction:column;gap:10px}
.rb-mng__confirm-txt{font:600 13px/1.4 var(--font-body,sans-serif);color:var(--fg-primary,#F5F5F5);display:flex;flex-direction:column;gap:4px}
.rb-mng__warn{font:500 11px/1.4 var(--font-body,sans-serif);color:var(--gold-light,#E8C547)}
.rb-mng__confirm-btns{display:flex;gap:8px}
.rb-mng__body{padding:0 20px 20px}
.rb-mng__sec{margin-top:14px}
.rb-mng__sechead{display:flex;align-items:center;gap:8px;font:700 10px/1 var(--font-body,sans-serif);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-tertiary,#6A6A66);padding-bottom:8px;border-bottom:1px solid var(--border,#2A2A2A);margin-bottom:6px}
.rb-mng__sechead span{color:var(--fg-secondary,#9A9A9A)}
.rb-mng__row{display:flex;align-items:center;gap:12px;padding:7px 0}
.rb-mng__id{min-width:0;flex:1}
.rb-mng__name{font-family:var(--font-display,sans-serif);font-weight:700;font-size:14px;line-height:1.1;text-transform:uppercase;color:var(--fg-primary,#F5F5F5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-mng__sub{font:500 10.5px/1.3 var(--font-body,sans-serif);color:var(--fg-tertiary,#6A6A66);margin-top:2px}
.rb-mng__acts{display:flex;gap:6px;flex:none;align-items:center}
.rb-mng__none{font:600 10px/1 var(--font-body,sans-serif);color:var(--fg-tertiary,#5A5A5A);letter-spacing:.08em}
#cffb-rb-root .rb-mbtn{cursor:pointer;font:700 10px/1 var(--font-body,sans-serif);letter-spacing:.06em;text-transform:uppercase;color:var(--fg-primary,#F5F5F5);background:var(--bg-surface-elev,#1C1C1C);border:1px solid var(--border-strong,#3A3A3A);border-radius:4px;padding:8px 11px;white-space:nowrap;transition:filter 120ms}
#cffb-rb-root .rb-mbtn:hover{filter:brightness(1.15)}
#cffb-rb-root .rb-mbtn:disabled{opacity:.5;cursor:default}
#cffb-rb-root .rb-mbtn--taxi{border-color:rgba(201,162,39,.55);color:var(--gold-light,#E8C547)}
#cffb-rb-root .rb-mbtn--ir{border-color:rgba(184,69,69,.55);color:#D88787}
#cffb-rb-root .rb-mbtn--go{background:var(--gold-gradient,linear-gradient(135deg,#E8C547,#C9A227 50%,#8B6F1F));color:#0A0A0A;border-color:transparent}
</style>

  LB: 'DB',
  ILB: 'DB',

// ── Live state (populated during load; rb-app reads these at render) ──────────
let SEASON = 2026;

let MY_TEAM = null;

let FID_TO_ABBR = {}; // retained so reloads after a roster move can rebuild
let TEAMS = {};
let TEAM_ORDER = [];
let MFL_CTX = {
  origin: '',
  host: '',
  year: '2026',
  league: '12011'

// Per-player identity + per-team membership, built once from the export feeds.
let PLAYERS_BY_ID = {}; // pid -> { name, pos, pts, injury, initials, playerId }
let ROSTER_MEMBERS = {}; // teamAbbr -> [ { pid, status, enc } ]
let MEMBERSHIP = {}; // pid -> [teamAbbr, ...]

// MFL's export *API* answers on any host, but league *pages* (/player, etc.) are
// bound to the league's numbered server (e.g. www46). Building the link from a

const MFL_PLAYER_LINK = pid => `${MFL_CTX.host || MFL_CTX.origin}/${MFL_CTX.year}/player?L=${MFL_CTX.league}&P=${pid}`;

// ── Encoded contract-string parser (mirrors mfl-player-parser.js) ─────────────
// A single copy string: OWNER_CLASS[_MODS]. OWNER is the 4-digit MFL franchise id
// (e.g. "0032") or "FA" for a free-agent copy. Returns { owner, cls, redshirt, awards }.
const ENC_RE = /^(?:FA|\d{4})_(?:FR|SO|JR|SR|GR)(?:_[A-Za-z0-9]+)*$/;
function parseEncoded(str) {
  if (!str || !ENC_RE.test(str)) return null;
  const parts = str.split('_');
  const out = {
    owner: parts[0],
    cls: parts[1],
    redshirt: null,
    awards: []
  };
  for (let i = 2; i < parts.length; i++) {
    const seg = parts[i];
    let j = 0;
    while (j < seg.length) {
      const ch = seg[j];
      if (ch === 'E') {
        j++;
      } else if (ch === 'r' || ch === 'm') {
        const yy = seg.slice(j + 1, j + 3);
        if (/^\d{2}$/.test(yy)) out.redshirt = {
          type: ch === 'm' ? 'med' : 'trad',
          year: 2000 + parseInt(yy, 10)
        };
        j += 3;
      } else if (ch === 'N' || ch === 'A') {
        const m = seg.slice(j + 1).match(/^(\d+)/);
        const count = m ? parseInt(m[1], 10) : 1;
        out.awards.push({
          type: ch === 'N' ? 'national' : 'allconf',
          count
        });
        j += m ? 1 + m[1].length : 1;
      } else {
        j++;
      } // tolerate unknown modifier characters
    }
  }
  return out;
}

// Award objects in the shape the Awards component wants (kind -> GLYPHS key).
const encAwardToDisplay = a => ({
  kind: a.type === 'national' ? 'heisman' : 'allamerican',
  name: a.type === 'national' ? 'National' : 'All-Conf',
  count: a.count || 1,
  year: '',
  conf: null
});

// Resolve the encoded contract string for THIS franchise's copy of a player.
// A player exists as two copies (e.g. "0032_FR_r25" and "0015_FR_r25"); the
// export row exposes them in contractStatus (Copy 1) and contractInfo (Copy 2).
// The owner segment is now the 4-digit MFL franchise id, so we match it exactly
// against fid (fr.id) — no abbreviation aliasing. Returns { parsed, matched }:
//  - matched=true  → a copy whose OWNER id equals this franchise (the correct copy),
//  - matched=false → tokens exist but none belong to this franchise (a free-agent
//                    copy or awaiting an import) → we show NOTHING (never another
//                    team's copy) and flag it.
// Returns null only when the row has no encoded contract token at all.
function encodedForFranchise(pl, fid) {
  if (!pl) return null;
  const tokens = [];
  for (const k in pl) {
    const v = pl[k];
    if (typeof v !== 'string') continue;
    v.split(/[;,]/).forEach(s => {
      s = s.trim();
      if (ENC_RE.test(s)) tokens.push(s);
    });
  }
  if (!tokens.length) return null;
  const mine = tokens.find(t => t.split('_')[0] === fid);
  if (mine) return {
    parsed: parseEncoded(mine),
    matched: true
  };
  return {
    parsed: null,
    matched: false
  };
}

// ── Eligibility clock from class + redshirt (approximation of deriveElig) ─────
function deriveElig(cls, rs) {
  const idx = Math.max(0, CLASS_SEQ.indexOf(cls)); // FR=0 … GR=4
  const played = idx + 1; // seasons enrolled incl. this one
  const rsYear = rs ? rs.year : null;
  const rsKind = rs ? rs.type === 'med' ? 'rs-med' : 'rs' : null;
  const hasRS = rsYear != null;
  const dots = [];
  for (let i = 0; i < played; i++) dots.push('used');
  if (hasRS) dots.splice(Math.min(dots.length, 1), 0, rsKind);
  const allowed = 4 + (hasRS ? 1 : 0);
  const usedBefore = Math.max(played - 1, 0);
  const remaining = allowed - usedBefore;
  while (dots.length < Math.min(allowed + (hasRS ? 1 : 0), 6)) dots.push('open');
  const remainLabel = remaining <= 0 ? 'No eligibility' : remaining === 1 ? 'Final year' : remaining + ' left';
  return {
    cls: (hasRS ? 'R-' : '') + cls,
    dots,
    remaining,
    remainLabel,
    redshirtingNow: rsYear === SEASON

}
const initialsOf = name => {
  // MFL names are "Last, First" — show First-Last initials.
  const clean = name.indexOf(',') >= 0 ? name.split(',').reverse().join(' ') : name;
  return clean.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
};
const displayName = name => name.indexOf(',') >= 0 ? name.split(',').map(s => s.trim()).reverse().join(' ') : name;

// Normalize an MFL injury status string to the board's P / Q / O codes.
function injuryCode(status) {
  const s = String(status || '').toUpperCase().trim();
  if (!s) return null;
  if (s === 'P' || s.indexOf('PROB') >= 0) return 'P'; // probable
  if (s === 'Q' || s.indexOf('QUES') >= 0 || s.indexOf('GTD') >= 0 || s.indexOf('GAME') >= 0 || s.indexOf('DAY') >= 0) return 'Q'; // questionable / day-to-day
  if (s === 'O' || s.indexOf('OUT') >= 0 || s === 'D' || s.indexOf('DOUBT') >= 0 || s === 'IR' || s.indexOf('RESERVE') >= 0 || s.indexOf('PUP') >= 0 || s.indexOf('SUSP') >= 0 || s.indexOf('NFI') >= 0) return 'O'; // out / doubtful / IR / PUP / suspended
  return 'Q'; // unrecognized but present → surface it as questionable rather than hide
}

// MEMBERSHIP is keyed by franchise id, so teamKey and the returned "other copy"
// are franchise ids (the app resolves them via TEAMS[id] for display).
const otherCopyOf = (pid, teamKey) => {
  const on = MEMBERSHIP[pid] || [];
  for (const t of on) if (t !== teamKey) return t;
  return null;
};

// ── buildRoster(teamKey): teamKey is a franchise id ───────────────────────────
const enrichRow = teamKey => m => {
  const p = PLAYERS_BY_ID[m.pid] || {
    name: m.pid,
    pos: 'WR',
    pts: 0,
    injury: null
  };
  const enc = m.enc;
  const rs = enc ? enc.redshirt : null;
  // No matching copy for this franchise → leave contract fields blank (never show
  // another team's copy); m.unverified drives the ⚠ "awaiting contract" flag.
  const elig = enc ? deriveElig(enc.cls, rs) : {
    cls: '',
    dots: [],
    remaining: null,
    remainLabel: 'No contract copy assigned to this team yet',
    redshirtingNow: false
  };
  return {
    pid: m.pid,
    playerId: p.playerId,
    photo: p.playerId ? PLAYER_PHOTO(p.playerId) : null,
    team: p.team || '',
    bye: p.bye || BYE_BY_TEAM[(p.team || '').toUpperCase()] || null,
    name: displayName(p.name),
    pos: normPos(p.pos),
    pts: p.pts || 0,
    injury: p.injury || null,
    initials: initialsOf(p.name),
    awards: enc ? enc.awards.map(encAwardToDisplay) : [],
    rs: rs ? {
      type: rs.type,
      year: rs.year
    } : null,
    elig,
    contractUnverified: !!m.unverified,
    other: otherCopyOf(m.pid, teamKey)
  };
};
function buildRoster(teamKey) {
  const members = ROSTER_MEMBERS[teamKey] || [];
  const e = enrichRow(teamKey);
  const active = [],
    taxi = [],
    ir = [];
  members.forEach(m => {
    const row = e(m);
    if (m.status === 'TAXI_SQUAD') taxi.push(row);else if (m.status === 'INJURED_RESERVE') ir.push(row);else active.push(row);
  });
  const groups = POS_ORDER.map(pos => {
    const players = active.filter(r => r.pos === pos).sort((a, b) => b.pts - a.pts);
    return {
      pos,
      players,
      pts: players.reduce((s, r) => s + r.pts, 0)
    };
  }).filter(g => g.players.length);
  const all = active.concat(taxi, ir);
  const totalPts = all.reduce((s, r) => s + r.pts, 0);
  const rsCount = all.filter(r => r.rs && r.rs.year === SEASON).length;
  const outCount = all.filter(r => r.injury && r.injury[0] === 'O').length;
  return {
    groups,
    taxi,
    ir,
    totalPts,
    rsCount,
    outCount,
    count: all.length
  };
}

// ── MFL context + franchise directory ────────────────────────────────────────
// MFL league pages must be requested on the league's numbered server. Prefer
// location.origin when it already is one (https://wwwNN.myfantasyleague.com);
// otherwise sniff the numbered host from any MFL asset the page has loaded
// (its own script/link/img/anchor URLs); finally fall back to origin.
const MFL_HOST_RE = /^https?:\/\/www\d+\.myfantasyleague\.com/i;
function resolveMflHost(origin) {
  try {
    const om = String(origin).match(MFL_HOST_RE);
    if (om) return om[0];
    if (typeof document !== 'undefined' && document.querySelectorAll) {
      const nodes = document.querySelectorAll('script[src],link[href],img[src],a[href]');
      for (let i = 0; i < nodes.length; i++) {
        const m = String(nodes[i].src || nodes[i].href || '').match(MFL_HOST_RE);
        if (m) return m[0];
      }
    }
  } catch (e) {/* ignore */}
  return origin;
}
function resolveCtx() {
  const origin = location.origin;
  const host = resolveMflHost(origin);
  const yr = (String(location.pathname).match(/\/(20\d{2})\//) || [])[1] || (String(location.href).match(/\/(20\d{2})\//) || [])[1] || String(SEASON);
  const league = String(window.league_id || (String(location.href).match(/[?&]L=(\d+)/) || [])[1] || '12011');
  MFL_CTX = {
    origin,
    host,
    year: yr,
    league
  };
  SEASON = parseInt(yr, 10) || SEASON;
  if (host !== origin) console.log('[CFFB Roster Board] player links use MFL host ' + host + ' (page origin ' + origin + ')');
}
function buildTeams() {
  const db = window.franchiseDatabase || {};
  const fidToAbbr = {};
  const teams = {};
  Object.keys(db).forEach(key => {
    const f = db[key];
    if (!f || !f.id || f.id === '0000') return; // skip commissioner pseudo-franchise
    const abbr = (f.abbrev || f.id).toUpperCase();
    const conf = DIV_TO_CONF[f.division] || 'acc';
    fidToAbbr[f.id] = abbr;
    // TEAMS is keyed by the 4-digit franchise id (the same key the contract
    // tokens now use and the rosters export groups by). abbr/name stay as
    // display fields — the id is never shown to the user.
    teams[f.id] = {
      name: f.name || abbr,
      abbr,
      owner: '',
      conf,
      bg: '#1B1B1E',
      fg: '#E8E7E4',
      rec: '',
      pill: f.icon || f.logo || '',
      // franchise ICON (small pill) preferred; logo is the large page art
      fid: f.id
    };
  });
  const order = Object.keys(teams).sort((a, b) => {
    const ca = CONF_ORDER.indexOf(teams[a].conf),
      cb = CONF_ORDER.indexOf(teams[b].conf);
    return ca !== cb ? ca - cb : teams[a].name.localeCompare(teams[b].name);
  });
  TEAMS = teams;
  TEAM_ORDER = order; // list of franchise ids, sorted by conference then name
  // Signed-in franchise → default team (its id).
  const myFid = String(window.franchise_id || '');
  MY_FID = myFid;
  FID_TO_ABBR = fidToAbbr;
  MY_TEAM = teams[myFid] ? myFid : TEAM_ORDER[0] || null;
  console.log('[CFFB Roster Board] signed-in franchise_id=' + (myFid || '(none)') + ' → default team ' + MY_TEAM + (MY_TEAM && TEAMS[MY_TEAM] ? ' (' + TEAMS[MY_TEAM].abbr + ')' : '') + (teams[myFid] ? '' : ' (fell back — commissioner/unknown franchise)'));
  return fidToAbbr;
}

// ── Fetch helpers ────────────────────────────────────────────────────────────
async function fetchJSON(type, extra) {
  const url = `${MFL_CTX.origin}/${MFL_CTX.year}/export?TYPE=${type}&L=${MFL_CTX.league}&JSON=1${extra || ''}`;
  const res = await fetch(url, {
    cache: 'no-store'
  });
  if (!res.ok) throw new Error('HTTP ' + res.status + ' for ' + type);
  return res.json();
}
const asArray = x => Array.isArray(x) ? x : x != null ? [x] : [];
// MFL injuries payload -> array, tolerant of shape ({injuries:{injury:[]}},
// {injuries:[]}, or a bare array).
function injuryListOf(d) {
  const root = d && (d.injuries || d.nflInjuries || d);
  return asArray(root && (root.injury || (Array.isArray(root) ? root : null)));
}

// Best-effort current NFL week from the browser clock (MFL's injuries export is
// week-specific and the page exposes no reliable week global). Week 1 ~ the
// first Tuesday of September of the given season.
function guessNflWeek(y) {
  try {
    const now = new Date();
    const sep1 = new Date(y, 8, 1);
    const firstTue = new Date(y, 8, 1 + (2 - sep1.getDay() + 7) % 7);
    const wk = Math.floor((now - firstTue) / (7 * 864e5)) + 1;
    return Math.min(Math.max(wk, 1), 18);
  } catch (e) {
    return 0;
  }
}

// Injuries and byes are GLOBAL NFL state, not league data — MFL merges the
// *current* season's status into pages regardless of the league's year. A
// rolled-back test league (e.g. /2025/) still shows injury/bye badges, but the
// 2025 injury/bye export is archived/empty. So sweep the league's URL year AND
// the real current year, using whichever returns data. (No &L= — global feed.)
function nflYears() {
  const ys = [];
  const push = y => {
    y = parseInt(y, 10);
    if (y && ys.indexOf(y) < 0) ys.push(y);
  };
  push(MFL_CTX.year);
  try {
    push(new Date().getFullYear());
  } catch (e) {/* ignore */}
  return ys;
}
async function fetchExport(year, type, extra) {
  const url = `${MFL_CTX.origin}/${year}/export?TYPE=${type}&JSON=1${extra || ''}`;
  const res = await fetch(url, {
    cache: 'no-store'
  });
  if (!res.ok) throw new Error('HTTP ' + res.status + ' for ' + type + ' ' + year);
  return res.json();
}
// Returns the raw injuries payload from the first (year, week) that has data.
async function loadInjuriesRaw() {
  for (const y of nflYears()) {
    for (const wk of [0, guessNflWeek(y)]) {
      try {
        const d = await fetchExport(y, 'injuries', wk ? '&W=' + wk : '');
        if (injuryListOf(d).length) {
          console.log('[CFFB Roster Board] injuries from year ' + y + ' week ' + (wk || 'default'));
          return d;
        }
      } catch (e) {/* try next */}
    }
  }
  console.log('[CFFB Roster Board] injuries: none found across years ' + nflYears().join(', '));
  return null;
}
// Returns team->bye map from the first year that has data.
async function loadByeMap() {
  for (const y of nflYears()) {
    try {
      const m = parseByeWeeks(await fetchExport(y, 'nflByeWeeks'));
      if (Object.keys(m).length) {
        console.log('[CFFB Roster Board] byes from year ' + y + ' (' + Object.keys(m).length + ' teams)');
        return m;
      }
    } catch (e) {/* try next */}
  }
  console.log('[CFFB Roster Board] byes: none found across years ' + nflYears().join(', '));
  return {};
}
// Map NFL team -> bye week from whatever shape MFL uses. Handles both
// team-keyed rows ({id/team, bye_week/week}) and week-keyed rows that nest a
// team array ({week, team:[{id},...]}).
function parseByeWeeks(d) {
  const map = {};
  const root = d && (d.nflByeWeeks || d.byeWeeks || d);
  if (!root || typeof root !== 'object') return map;
  const visit = (arr, inheritedWk) => {
    asArray(arr).forEach(it => {
      if (it == null) return;
      if (typeof it === 'string') {
        if (inheritedWk) map[it.toUpperCase()] = String(inheritedWk);
        return;
      }
      if (typeof it !== 'object') return;
      const wk = it.bye_week || it.week || it.bye || it.bye_wk || inheritedWk;
      if (Array.isArray(it.team)) {
        visit(it.team, wk);
        return;
      } // week-keyed → recurse into its teams
      const team = String(it.id || it.team_id || (typeof it.team === 'string' ? it.team : '')).toUpperCase();
      if (team && wk) map[team] = String(wk);
    });
  };
  for (const k in root) if (Array.isArray(root[k])) visit(root[k]);
  return map;
}

// ── localStorage stale-while-revalidate cache (widget-unique key) ─────────────
const RB_CACHE_KEY = 'cffb_roster_board_v9'; // v9: franchise-id keying + id-based contract match
const RB_FRESH_MS = 30 * 60 * 1000; // serve without refetch
const RB_MAX_MS = 24 * 60 * 60 * 1000; // hard cap
function rbReadCache() {
  try {
    const rec = JSON.parse(localStorage.getItem(RB_CACHE_KEY) || 'null');
    if (!rec || typeof rec.ts !== 'number' || !rec.payload) return null;
    const age = Date.now() - rec.ts;
    if (age < 0 || age > RB_MAX_MS) return null;
    return {
      payload: rec.payload,
      age
    };
  } catch (e) {
    return null;
  }
}
function rbWriteCache(payload) {
  try {
    localStorage.setItem(RB_CACHE_KEY, JSON.stringify({
      ts: Date.now(),
      payload
    }));
  } catch (e) {/* ignore */}
}

// ── Assemble the live payload from the export feeds ───────────────────────────
async function rbFetchPayload(fidToAbbr) {
  const [rostersD, playersD, scoresD, injuriesD, byeMap] = await Promise.all([fetchJSON('rosters'), fetchJSON('players', '&DETAILS=1'), fetchJSON('playerScores', '&W=YTD&YEAR=' + MFL_CTX.year).catch(() => null), loadInjuriesRaw().catch(e => {
    console.warn('[CFFB Roster Board] injuries fetch failed:', e && e.message);
    return null;
  }), loadByeMap().catch(() => ({}))]);

  // Player identity: id -> name/pos/team/bye.
  const playersById = {};
  const playerList = asArray(playersD && playersD.players && playersD.players.player);
  if (playerList.length) console.log('[CFFB Roster Board] sample player fields:', Object.keys(playerList[0]));
  playerList.forEach(p => {
    const team = (p.team || '').toUpperCase();
    playersById[p.id] = {
      name: p.name || p.id,
      pos: p.position || 'WR',
      pts: 0,
      injury: null,
      playerId: p.id,
      team,
      bye: p.bye_week || p.bye || p.byeweek || p.bye_wk || byeMap[team] || null
    };
  });

  // Season points.
  asArray(scoresD && scoresD.playerScores && scoresD.playerScores.playerScore).forEach(s => {
    if (playersById[s.id]) playersById[s.id].pts = parseFloat(s.score) || 0;
  });

  // Injuries: MFL's TYPE=injuries report (these are real NFL players, so it
  // matches by id). Normalize the status to P / Q / O — MFL sends full words
  // ("Questionable"), short codes ("Q"), or variants ("IR", "PUP", "Doubtful"),
  // so map broadly and treat any other non-empty designation as questionable
  // rather than dropping it.
  const injList = injuryListOf(injuriesD);
  let injMatched = 0;
  injList.forEach(inj => {
    const code = injuryCode(inj.status);
    if (code && playersById[inj.id]) {
      playersById[inj.id].injury = [code, inj.details || inj.status || ''];
      injMatched++;
    }
  });
  console.log('[CFFB Roster Board] injuries: ' + injList.length + ' report entries, ' + injMatched + ' matched to rostered players');

  // Membership + this franchise's encoded contract copy (matched by franchise id).
  // Keyed by the 4-digit franchise id (fr.id) — the same key TEAMS uses and the
  // token owner now carries — so no abbreviation aliasing.
  const rosterMembers = {}; // fid -> [{pid,status,enc,verified,unverified}]
  const membership = {}; // pid -> [fid]
  let encMatched = 0,
    encUnverified = 0,
    encNone = 0;
  asArray(rostersD && rostersD.rosters && rostersD.rosters.franchise).forEach(fr => {
    if (!TEAMS[fr.id]) return; // skip franchises not in the directory (commissioner/unknown)
    rosterMembers[fr.id] = rosterMembers[fr.id] || [];
    asArray(fr.player).forEach(pl => {
      const res = encodedForFranchise(pl, fr.id);
      if (res && res.matched) encMatched++;else if (res) encUnverified++;else encNone++;
      rosterMembers[fr.id].push({
        pid: pl.id,
        status: pl.status || 'ROSTER',
        enc: res ? res.parsed : null,
        verified: !!(res && res.matched),
        unverified: !!(res && !res.matched) // tokens present but none owned by this franchise
      });
      (membership[pl.id] = membership[pl.id] || []).push(fr.id);
    });
  });
  console.log('[CFFB Roster Board] contract copies: ' + encMatched + ' matched by id, ' + encUnverified + ' no copy for this franchise (flagged), ' + encNone + ' no contract token');
  return {
    season: SEASON,
    thruWeek: THRU_WEEK,
    playersById,
    rosterMembers,
    membership,
    byeMap
  };
}
function applyPayload(pd, fidToAbbr) {
  PLAYERS_BY_ID = pd.playersById || {};
  MEMBERSHIP = pd.membership || {};
  BYE_BY_TEAM = pd.byeMap || {};
  THRU_WEEK = pd.thruWeek || THRU_WEEK;
  // enc is already resolved to this franchise's copy at build time.
  ROSTER_MEMBERS = pd.rosterMembers || {};
}

// ── Public loader (awaited by the boot wrapper before mount) ──────────────────
async function loadRosterBoard() {
  resolveCtx();
  const fidToAbbr = buildTeams();
  THRU_WEEK = parseInt(window.currentWeek, 10) || THRU_WEEK;
  const cached = rbReadCache();
  if (cached && cached.payload.season === SEASON) {
    applyPayload(cached.payload, fidToAbbr);
    if (cached.age > RB_FRESH_MS) {
      rbFetchPayload(fidToAbbr).then(pd => {
        applyPayload(pd, fidToAbbr);
        rbWriteCache(pd);
      }).catch(() => {});
    }
    return;
  }
  const pd = await rbFetchPayload(fidToAbbr);
  applyPayload(pd, fidToAbbr);
  rbWriteCache(pd);
}

// ── Roster actions (Taxi / IR) via MFL form-replay ────────────────────────────
// These drive MFL's OWN action forms rather than a hand-built API call, so:
//  • auth is the signed-in session cookie (same-origin, no APIKEY/token needed —
//    the captured forms carry no CSRF field),
//  • eligibility + locks are whatever MFL renders: a player is movable *iff* the
//    page emits a checkbox for them (ineligible players show "Cannot be demoted"
//    / "Can not be deactivated" and get no checkbox),
//  • we read the EXACT field name (demote/promote/deactivate/activate + fid) out
//    of the live HTML — never guessed — and POST a single-player delta, so one
//    action moves exactly one player and nothing else.
// Only the signed-in owner's own roster is actionable; MFL rejects anything else.
const RB_ACTION_PAGE = {
  taxi: 'O=98',
  ir: 'O=18'
}; // options page that renders each form
const RB_ACTION_SUFFIX = {
  taxi: 'taxi_squad',
  ir: 'ir'
}; // form action path suffix

// Pull the target form out of a fetched options page and read its hidden fields
// + per-player checkboxes. Scoped to the form so unrelated page inputs are ignored.
function rbParseMoveForm(html, suffix) {
  const open = new RegExp('<form[^>]*action="([^"]+\\/' + suffix + ')"[^>]*>', 'i').exec(html);
  if (!open) return null;
  const end = html.indexOf('</form>', open.index);
  const inner = html.slice(open.index, end < 0 ? html.length : end);
  const hidden = {};
  let m;
  const hidRe = /<input[^>]*type="hidden"[^>]*name="([^"]+)"[^>]*value="([^"]*)"[^>]*>/gi;
  while (m = hidRe.exec(inner)) hidden[m[1]] = m[2];
  const moves = {}; // pid -> { name, dir }  (dir 'out' = leaves active roster, 'in' = returns to it)
  const cbRe = /<input[^>]*type="checkbox"[^>]*name="(demote|promote|deactivate|activate)(\d{3,4})"[^>]*value="(\d+)"[^>]*>/gi;
  while (m = cbRe.exec(inner)) {
    const prefix = m[1],
      fid = m[2],
      pid = m[3];
    moves[pid] = {
      name: prefix + fid,
      dir: prefix === 'demote' || prefix === 'deactivate' ? 'out' : 'in'
    };
  }
  return {
    actionUrl: open[1],
    hidden,
    moves
  };
}

// forceFid appends &FRANCHISE_ID for the commissioner (franchise '0000'), who
// can act on any team — MFL scopes a regular owner's form to their own session,
// so the param is only added for the commish. The parsed form's own FRANCHISE_ID
// is stamped on the result so the caller can verify MFL returned the intended
// team and refuse to act on the wrong one.
async function rbFetchForm(kind, targetFid, forceFid) {
  const fidParam = forceFid && targetFid ? '&FRANCHISE_ID=' + targetFid : '';
  const url = `${MFL_CTX.host || MFL_CTX.origin}/${MFL_CTX.year}/options?L=${MFL_CTX.league}&${RB_ACTION_PAGE[kind]}${fidParam}`;
  const res = await fetch(url, {
    credentials: 'include',
    cache: 'no-store'
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const parsed = rbParseMoveForm(await res.text(), RB_ACTION_SUFFIX[kind]);
  if (parsed) parsed.fid = parsed.hidden.FRANCHISE_ID || parsed.hidden.FRANCHISE || null;
  return parsed;
}

// Load taxi + IR eligibility for the target franchise. Returns, per kind, the
// action URL, hidden fields, the franchise the form is scoped to (.fid), and a
// { pid -> {name,dir} } map of legal moves.
async function rbLoadActions(targetFid, forceFid) {
  const out = {
    taxi: null,
    ir: null
  };
  await Promise.all(['taxi', 'ir'].map(async k => {
    try {
      out[k] = await rbFetchForm(k, targetFid, forceFid);
    } catch (e) {
      console.warn('[CFFB Roster Board] ' + k + ' form load failed:', e && e.message);
    }
  }));
  return out;
}

// POST a single-player delta the way MFL's form would, then report raw result.
async function rbSubmitMove(actionUrl, hidden, fieldName, pid) {
  const fields = Object.assign({}, hidden);
  fields[fieldName] = pid;
  const body = Object.keys(fields).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(fields[k])).join('&');
  const res = await fetch(actionUrl, {
    method: 'POST',
    credentials: 'include',
    headers: {
      'Content-Type': 'application/x-www-form-urlencoded'
    },
    body
  });
  return {
    ok: res.ok,
    status: res.status
  };
}

// Re-fetch rosters after a write so the board reflects MFL's new truth (the POST
// response HTML is not trusted — the export feed is the source of truth).
async function rbReloadRosters() {
  const pd = await rbFetchPayload(FID_TO_ABBR);
  applyPayload(pd, FID_TO_ABBR);
  rbWriteCache(pd);
}

// Current bucket of a pid on a team ('ROSTER' | 'TAXI_SQUAD' | 'INJURED_RESERVE').
function rbStatusOf(teamAbbr, pid) {
  const m = (ROSTER_MEMBERS[teamAbbr] || []).find(x => x.pid === pid);
  return m ? m.status : null;
}
