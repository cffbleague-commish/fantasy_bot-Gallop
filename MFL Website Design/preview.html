<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CFFB Contract Board — Preview</title>
  <style>
    /* Simulate MFL's dark BackinBlack theme */
    body {
      margin: 0;
      padding: 20px;
      background: #0A0A0A;
      color: #ccc;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
    }
    .preview-note {
      max-width: 960px;
      margin: 0 auto 16px;
      padding: 8px 12px;
      background: #1a1a2e;
      border: 1px solid #333;
      border-radius: 4px;
      font-size: 12px;
      color: #888;
      text-align: center;
    }
  </style>
  <link rel="stylesheet" href="mfl-custom.css">
</head>
<body>
  <div class="preview-note">
    Local preview — simulates MFL's dark theme. Open in browser to test views, sorting, and filtering.
  </div>
  <!-- Injected home-message.html content below -->
  <script>
    fetch('home-message.html')
      .then(r => r.text())
      .then(html => {
        var container = document.createElement('div');
        container.innerHTML = html;
        document.body.appendChild(container);
        // Execute any script tags in the loaded HTML
        var scripts = container.querySelectorAll('script');
        scripts.forEach(function(s) {
          var ns = document.createElement('script');
          ns.textContent = s.textContent;
          document.body.appendChild(ns);
        });
      })
      .catch(err => {
        document.body.innerHTML += '<p style="color:red">Failed to load home-message.html: ' + err.message + '</p>';
      });
  </script>
</body>
</html>
