<!--
  CFFB Playoff Bracket — MFL home page message
  ============================================
  Paste this entire file into a single MFL home page message.

  Prerequisites:
    - In league settings, set "Use Advanced Editor on league type-in boxes?" to No.
      The WYSIWYG editor will mangle <style> / <script> blocks.

  This file is self-contained: CSS + JS inline, no external image files.
  Fonts are loaded via @import so MFL's editor does not strip <link> tags.

  Data (LIVE from MFL — no external service, no deploy):
    When this message is displayed on an MFL page, the script reads the
    globals MFL already defines (franchiseDatabase / league_id /
    franchise_id) and calls the MFL export API *same-origin* (no CORS):
      export?TYPE=playoffBrackets               -> find the bracket
      export?TYPE=playoffBracket&BRACKET_ID=..  -> games + live results
      export?TYPE=leagueStandings               -> record / points for/against
    It auto-selects the bracket named "National Championship Playoffs"
    (falls back to the first bracket) and fills in real teams, seeds,
    matchups, scores, winners and the champion.
    If those globals/feeds are unavailable (e.g. opening this file
    locally), it falls back to the built-in demo data so the layout
    still renders.
-->

<div id="cffb-pb-root">

<style>
@import url('https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

/* ============================================================
   CFFB Playoff Bracket — 16 teams, self-contained for MFL.
   All styles scoped under #cffb-pb-root / .cffb-pb to avoid
   clobbering the rest of the MFL page.
   ============================================================ */
#cffb-pb-root{
  --bg-canvas:#0A0A0A; --bg-surface:#141414; --bg-surface-elev:#1C1C1C;
  --bg-surface-hover:#1F1F1F; --border:#2A2A2A; --border-strong:#3A3A3A;
  --fg-primary:#F5F5F5; --fg-secondary:#9A9A9A; --fg-tertiary:#5A5A5A;
  --gold:#C9A227; --gold-light:#E8C547; --gold-dark:#8B6F1F;
  --gold-gradient:linear-gradient(135deg,#E8C547 0%,#C9A227 50%,#8B6F1F 100%);
  --live:#2D7A4E; --win:#2D7A4E; --loss:#B84545;
  --font-display:'Saira Condensed','Oswald',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --s-half:4px; --s-1:8px; --s-2:16px; --s-3:24px; --s-4:32px; --s-5:40px;
  --r-1:2px; --r-2:4px; --r-3:8px; --r-4:12px; --r-pill:999px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow-md:0 8px 24px rgba(0,0,0,.6);
  --shadow-lg:0 20px 60px rgba(0,0,0,.7);
  --shadow-glow-gold:0 0 24px rgba(201,162,39,.28);
  --shadow-glow-live:0 0 12px rgba(45,122,78,.55);
  --inset-metallic:inset 0 1px 0 rgba(255,255,255,.06);
  --ease-out:cubic-bezier(.2,.8,.2,1);
}
#cffb-pb-root *,#cffb-pb-root *::before,#cffb-pb-root *::after{box-sizing:border-box;}
#cffb-pb-root .cffb-pb,#cffb-pb-root .cffb-pb *{margin:0;padding:0;}
#cffb-pb-root .cffb-pb{
  background:
    radial-gradient(120% 70% at 50% -8%, rgba(201,162,39,.07), transparent 60%),
    var(--bg-canvas);
  color:var(--fg-primary);
  font-family:var(--font-body); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  font-variant-numeric:tabular-nums;
  padding:var(--s-4) var(--s-3) var(--s-5);
}
#cffb-pb-root .cffb-pb__inner{ max-width:1320px; margin:0 auto; }

/* ---- Header ------------------------------------------------ */
#cffb-pb-root .pb-head{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:var(--s-3); flex-wrap:wrap;
  border-bottom:1px solid var(--border);
  padding-bottom:var(--s-2); margin-bottom:var(--s-3);
}
#cffb-pb-root .pb-head__l{ display:flex; flex-direction:column; gap:6px; }
#cffb-pb-root .pb-eyebrow{
  display:inline-flex; align-items:center; gap:var(--s-1);
  font-weight:700; font-size:11px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--gold);
}
#cffb-pb-root .pb-eyebrow::before{
  content:""; width:18px; height:18px; flex-shrink:0;
  background:var(--gold-gradient);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M6 3h12v3a6 6 0 0 1-5 5.9V15h2.5a1 1 0 0 1 1 1v1H7.5v-1a1 1 0 0 1 1-1H11v-3.1A6 6 0 0 1 6 6V3z'/></svg>") center/contain no-repeat;
          mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M6 3h12v3a6 6 0 0 1-5 5.9V15h2.5a1 1 0 0 1 1 1v1H7.5v-1a1 1 0 0 1 1-1H11v-3.1A6 6 0 0 1 6 6V3z'/></svg>") center/contain no-repeat;
}
#cffb-pb-root .pb-title{
  font-family:var(--font-display); font-weight:700;
  font-size:clamp(30px,4.4vw,46px); line-height:1.0;
  text-transform:uppercase; letter-spacing:-.01em;
}
#cffb-pb-root .pb-title em{ font-style:normal; display:block; line-height:1;
  background:var(--gold-gradient);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
}
#cffb-pb-root .pb-sub{ font-size:13px; color:var(--fg-secondary); margin-top:8px; }
#cffb-pb-root .pb-head__r{ display:flex; align-items:center; gap:var(--s-2); }
#cffb-pb-root .pb-live{
  display:inline-flex; align-items:center; gap:var(--s-1);
  font-weight:700; font-size:11px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--live);
}
#cffb-pb-root .pb-live__dot{ width:8px; height:8px; border-radius:50%;
  background:var(--live); box-shadow:var(--shadow-glow-live);
  animation:cffb-pb-pulse 1.4s ease-in-out infinite; }
@keyframes cffb-pb-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.55}}
#cffb-pb-root .pb-week{
  font-family:var(--font-display); font-weight:700; text-transform:uppercase;
  font-size:14px; letter-spacing:.06em; color:var(--fg-secondary);
  padding:6px 12px; border:1px solid var(--border); border-radius:var(--r-2);
  background:var(--bg-surface-elev);
}
#cffb-pb-root .pb-week b{ color:var(--fg-primary); }

/* ---- Bracket area ----------------------------------------- */
#cffb-pb-root .pb-bracket{ position:relative; min-height:780px; }
#cffb-pb-root .pb-svg{ position:absolute; inset:0; width:100%; height:100%;
  pointer-events:none; z-index:1; overflow:visible; }
#cffb-pb-root .pb-grid{
  position:relative; z-index:2;
  display:flex; align-items:stretch;
  gap:0 clamp(14px,2vw,34px);
  min-height:780px;
}
#cffb-pb-root .pb-col{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; }
#cffb-pb-root .pb-col--final{ flex:1.05 1 0; }
#cffb-pb-root .pb-round-label{
  height:30px; flex:0 0 auto; text-align:center;
  font-family:var(--font-display); font-weight:700;
  font-size:12px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--fg-tertiary);
  display:flex; align-items:center; justify-content:center; gap:8px;
}
#cffb-pb-root .pb-round-label span{ font-size:9.5px; color:var(--fg-tertiary);
  font-family:var(--font-body); font-weight:600; letter-spacing:.08em; }
#cffb-pb-root .pb-col__body{ flex:1 1 auto; display:flex; flex-direction:column;
  justify-content:space-around; gap:0; }
#cffb-pb-root .pb-col--final .pb-col__body{ justify-content:center; }

/* ---- Match card ------------------------------------------- */
#cffb-pb-root .pb-match{
  background:var(--bg-surface);
  border:1px solid var(--border); border-radius:var(--r-3);
  overflow:hidden; box-shadow:var(--shadow-sm); position:relative;
}
#cffb-pb-root .pb-match__tag{
  display:flex; align-items:center; justify-content:space-between;
  padding:3px 9px; background:var(--bg-surface-elev);
  border-bottom:1px solid var(--border);
}
#cffb-pb-root .pb-match__tag-name{ font-family:var(--font-display); font-weight:600;
  font-size:9px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--fg-secondary); white-space:nowrap; }
#cffb-pb-root .pb-match__status{ font-size:8.5px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--fg-tertiary); }
#cffb-pb-root .pb-match__status.is-live{ color:var(--live); display:inline-flex; gap:5px; align-items:center; }
#cffb-pb-root .pb-match__status.is-live::before{ content:""; width:5px; height:5px; border-radius:50%;
  background:var(--live); box-shadow:var(--shadow-glow-live);
  animation:cffb-pb-pulse 1.4s ease-in-out infinite; }
#cffb-pb-root .pb-match__status.is-final{ color:var(--gold); }

/* team slot */
#cffb-pb-root .pb-slot{
  display:flex; align-items:center; gap:8px;
  padding:6px 9px; cursor:pointer;
  border:none; width:100%; background:transparent; text-align:left;
  color:var(--fg-primary); font-family:inherit;
  transition:background .12s var(--ease-out); position:relative;
}
#cffb-pb-root .pb-slot + .pb-slot{ border-top:1px solid var(--border); }
#cffb-pb-root .pb-slot:hover{ background:var(--bg-surface-hover); }
#cffb-pb-root .pb-slot:focus-visible{ outline:2px solid var(--gold); outline-offset:-2px; }
#cffb-pb-root .pb-slot.is-selected{ background:rgba(201,162,39,.10); }
#cffb-pb-root .pb-slot.is-selected::before{ content:""; position:absolute; left:0; top:0; bottom:0;
  width:3px; background:var(--gold-gradient); }
#cffb-pb-root .pb-slot.is-loser{ opacity:.46; }
#cffb-pb-root .pb-slot.is-tbd{ cursor:default; }
#cffb-pb-root .pb-slot.is-tbd:hover{ background:transparent; }

#cffb-pb-root .pb-seed{
  font-family:var(--font-display); font-weight:700; font-size:11px;
  color:var(--fg-tertiary); width:15px; text-align:center; flex-shrink:0;
}
#cffb-pb-root .pb-chip{
  width:24px; height:24px; border-radius:50%; flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:8.5px;
  letter-spacing:.01em; color:#0A0A0A;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14), var(--shadow-sm);
}
#cffb-pb-root .pb-slot__name{ font-family:var(--font-display); font-weight:600; font-size:13px;
  letter-spacing:.005em; text-transform:uppercase; line-height:1.02;
  flex:1; min-width:0; overflow-wrap:normal; word-break:keep-all; }
#cffb-pb-root .pb-slot__name--tbd{ color:var(--fg-tertiary); }

/* team pill — primary identifier (stand-in for a real team logo/pill). */
#cffb-pb-root .pb-pill{
  display:inline-flex; align-items:center; gap:6px;
  height:27px; padding:0 12px 0 8px; flex-shrink:0;
  border-radius:var(--r-pill);
  font-family:var(--font-display); font-weight:700; font-size:13px;
  letter-spacing:.04em; color:#0A0A0A; white-space:nowrap;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.20), inset 0 1px 0 rgba(255,255,255,.28), var(--shadow-sm);
}
#cffb-pb-root .pb-pill__dot{ width:12px; height:12px; border-radius:50%; flex-shrink:0;
  background:rgba(0,0,0,.30); box-shadow:inset 0 0 0 1px rgba(255,255,255,.30); }
#cffb-pb-root .pb-pill--tbd{ background:var(--bg-surface-elev); color:var(--fg-tertiary);
  box-shadow:inset 0 0 0 1px var(--border); }
#cffb-pb-root .pb-pill--tbd .pb-pill__dot{ background:rgba(255,255,255,.06); box-shadow:inset 0 0 0 1px var(--border); }
#cffb-pb-root .pb-pill-img{ height:30px; width:auto; max-width:130px; flex-shrink:0; display:block; vertical-align:middle; }
#cffb-pb-root .pb-slot.is-loser .pb-pill{ filter:saturate(.5) brightness(.85); }

#cffb-pb-root .pb-slot__score{
  font-family:var(--font-display); font-weight:700; font-size:14px;
  letter-spacing:-.01em; color:var(--fg-secondary); flex-shrink:0;
  min-width:38px; text-align:right; margin-left:auto; font-variant-numeric:tabular-nums;
}
#cffb-pb-root .pb-slot.is-winner .pb-slot__score{ color:var(--gold); }
#cffb-pb-root .pb-slot__score--tbd{ color:var(--fg-tertiary); font-size:12px; }

/* ---- Final / champion ------------------------------------- */
#cffb-pb-root .pb-final-wrap{ display:flex; flex-direction:column; align-items:center; gap:var(--s-2); }
#cffb-pb-root .pb-trophy{
  width:58px; height:58px; display:flex; align-items:center; justify-content:center;
  border-radius:50%; background:radial-gradient(circle at 50% 30%, rgba(201,162,39,.22), transparent 70%);
}
#cffb-pb-root .pb-trophy svg{ width:48px; height:48px; }
#cffb-pb-root .pb-final{ width:100%; box-shadow:var(--inset-metallic), var(--shadow-md); }
#cffb-pb-root .pb-final .pb-match__tag{ background:linear-gradient(180deg, rgba(201,162,39,.16), var(--bg-surface-elev)); padding:5px 10px; }
#cffb-pb-root .pb-final .pb-match__tag-name{ color:var(--gold); font-size:10px; }
#cffb-pb-root .pb-final .pb-slot{ padding:9px 11px; }
#cffb-pb-root .pb-final .pb-slot__name{ font-size:14.5px; }
#cffb-pb-root .pb-final .pb-slot__score{ font-size:16px; min-width:42px; }
#cffb-pb-root .pb-final .pb-pill{ height:30px; font-size:14px; }
#cffb-pb-root .pb-final .pb-pill-img{ height:34px; }
#cffb-pb-root .pb-champion-slot{
  text-align:center; padding:9px; border-top:1px dashed var(--border);
  background:rgba(201,162,39,.04);
}
#cffb-pb-root .pb-champion-slot__label{ font-size:9px; font-weight:700; letter-spacing:.16em;
  text-transform:uppercase; color:var(--fg-tertiary); }
#cffb-pb-root .pb-champion-slot__val{ font-family:var(--font-display); font-weight:700;
  font-size:15px; text-transform:uppercase; color:var(--fg-secondary); margin-top:2px; }

/* ---- Detail panel ----------------------------------------- */
#cffb-pb-root .pb-detail{
  margin-top:var(--s-4);
  background:var(--bg-surface);
  border:1px solid var(--border); border-radius:var(--r-4);
  box-shadow:var(--shadow-md); overflow:hidden;
  display:none;
}
#cffb-pb-root .pb-detail.is-open{ display:block; }
#cffb-pb-root .pb-detail__bar{ height:4px; background:var(--gold-gradient); }
#cffb-pb-root .pb-detail__top{
  display:flex; align-items:center; gap:var(--s-2);
  padding:var(--s-3); border-bottom:1px solid var(--border);
  background:linear-gradient(90deg, rgba(201,162,39,.06), transparent 60%);
  flex-wrap:wrap;
}
#cffb-pb-root .pb-detail__chip{
  width:54px; height:54px; border-radius:50%; flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:15px;
  color:#0A0A0A; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16), var(--shadow-md);
}
#cffb-pb-root .pb-detail__id{ display:flex; flex-direction:column; gap:4px; min-width:0; flex:1; }
#cffb-pb-root .pb-detail__seedline{ display:flex; align-items:center; gap:var(--s-1); flex-wrap:wrap; }
#cffb-pb-root .pb-detail__seedbadge{
  font-family:var(--font-display); font-weight:700; font-size:11px;
  letter-spacing:.08em; text-transform:uppercase; color:var(--gold);
  border:1px solid rgba(201,162,39,.4); border-radius:var(--r-1);
  padding:2px 8px; background:rgba(201,162,39,.08); white-space:nowrap;
}
/* Solid-gold CFFB power-rank chip beside the outlined seed badge. Distinct fill
   so the two read as different metrics. Absent when the rank feed has no rank. */
#cffb-pb-root .pb-detail__rankbadge{
  font-family:var(--font-display); font-weight:800; font-size:11px;
  letter-spacing:.06em; text-transform:uppercase; color:#0A0A0A;
  border-radius:var(--r-1); padding:2px 8px; background:var(--gold);
  white-space:nowrap; font-variant-numeric:tabular-nums;
}
#cffb-pb-root .pb-detail__name{ font-family:var(--font-display); font-weight:700;
  font-size:clamp(24px,3.4vw,32px); line-height:1; text-transform:uppercase;
  letter-spacing:-.01em; }
#cffb-pb-root .pb-detail__mgr{ font-size:12px; color:var(--fg-secondary); }
#cffb-pb-root .pb-detail__mgr b{ color:var(--fg-primary); font-weight:600; }
#cffb-pb-root .pb-statuspill{
  font-family:var(--font-display); font-weight:700; font-size:12px;
  letter-spacing:.06em; text-transform:uppercase;
  padding:6px 12px; border-radius:var(--r-pill); white-space:nowrap;
}
#cffb-pb-root .pb-statuspill--live{ color:var(--live); background:rgba(45,122,78,.12); border:1px solid rgba(45,122,78,.45); }
#cffb-pb-root .pb-statuspill--adv{ color:var(--gold); background:rgba(201,162,39,.1); border:1px solid rgba(201,162,39,.4); }
#cffb-pb-root .pb-statuspill--out{ color:var(--loss); background:rgba(184,69,69,.1); border:1px solid rgba(184,69,69,.4); }
#cffb-pb-root .pb-detail__close{
  margin-left:auto; width:34px; height:34px; flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--border); border-radius:var(--r-2);
  background:var(--bg-surface-elev); color:var(--fg-secondary);
  cursor:pointer; font-size:18px; line-height:1; transition:filter .12s;
}
#cffb-pb-root .pb-detail__close:hover{ filter:brightness(1.3); color:var(--fg-primary); }

#cffb-pb-root .pb-detail__body{ display:grid; grid-template-columns:1.1fr 1.3fr; gap:0; }
#cffb-pb-root .pb-detail__col{ padding:var(--s-3); }
#cffb-pb-root .pb-detail__col + .pb-detail__col{ border-left:1px solid var(--border); }
#cffb-pb-root .pb-detail__h{ font-family:var(--font-body); font-weight:600; font-size:11px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--fg-secondary);
  margin-bottom:var(--s-2); }

#cffb-pb-root .pb-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s-2); margin-bottom:var(--s-3); }
#cffb-pb-root .pb-stat{ display:flex; flex-direction:column; gap:3px; }
#cffb-pb-root .pb-stat__l{ font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--fg-tertiary); }
#cffb-pb-root .pb-stat__v{ font-family:var(--font-display); font-weight:700; font-size:25px; line-height:1;
  letter-spacing:-.01em; }
#cffb-pb-root .pb-stat__v.is-pos{ color:var(--win); }
#cffb-pb-root .pb-stat__v.is-neg{ color:var(--loss); }

#cffb-pb-root .pb-path{ display:flex; flex-direction:column; gap:var(--s-1); }
#cffb-pb-root .pb-path__row{ display:flex; align-items:center; gap:10px; font-size:12.5px; }
#cffb-pb-root .pb-path__node{ font-family:var(--font-display); font-weight:700; font-size:10px;
  min-width:30px; height:26px; padding:0 6px; border-radius:var(--r-pill); flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--border-strong); color:var(--fg-secondary); }
#cffb-pb-root .pb-path__row.is-done .pb-path__node{ background:var(--win); border-color:var(--win); color:#fff; }
#cffb-pb-root .pb-path__row.is-live .pb-path__node{ border-color:var(--live); color:var(--live);
  box-shadow:0 0 0 3px rgba(45,122,78,.18); }
#cffb-pb-root .pb-path__row.is-out .pb-path__node{ background:var(--loss); border-color:var(--loss); color:#fff; }
#cffb-pb-root .pb-path__row.is-next .pb-path__node{ border-style:dashed; }
#cffb-pb-root .pb-path__txt{ color:var(--fg-secondary); }
#cffb-pb-root .pb-path__txt b{ color:var(--fg-primary); font-weight:600; }

#cffb-pb-root .pb-hint{ text-align:center; font-size:12px; color:var(--fg-tertiary); margin-top:var(--s-3); }
#cffb-pb-root .pb-hint b{ color:var(--fg-secondary); }

/* ---- Responsive ------------------------------------------- */
@media (max-width:1080px){
  #cffb-pb-root .cffb-pb{ padding:var(--s-3) var(--s-2) var(--s-4); }
  #cffb-pb-root .pb-bracket{ overflow-x:auto; overflow-y:hidden; padding-bottom:var(--s-2);
    -webkit-overflow-scrolling:touch; }
  #cffb-pb-root .pb-grid{ min-width:1040px; }
}
@media (max-width:680px){
  #cffb-pb-root .pb-detail__body{ grid-template-columns:1fr; }
  #cffb-pb-root .pb-detail__col + #cffb-pb-root .pb-detail__col{ border-left:none; border-top:1px solid var(--border); }
}
</style>

<div class="cffb-pb">
<div class="cffb-pb__inner">

  <!-- Header -->
  <div class="pb-head">
    <div class="pb-head__l">
      <span class="pb-eyebrow">CFFB Postseason &middot; Est. 2021</span>
      <h1 class="pb-title">Championship <em>Bracket</em></h1>
      <p class="pb-sub">Sixteen teams. Four rounds. One champion.</p>
    </div>
    <div class="pb-head__r">
      <span class="pb-live" id="pbLiveTag" style="display:none"><span class="pb-live__dot" id="pbLiveDot"></span><span id="pbLiveTxt">Live</span></span>
      <span class="pb-week" id="pbWeekTag">WEEK <b id="pbWeekNum">&mdash;</b></span>
    </div>
  </div>

  <!-- Bracket -->
  <div class="pb-bracket">
    <svg class="pb-svg" id="pbSvg" preserveAspectRatio="none"></svg>
    <div class="pb-grid" id="pbGrid"><!-- injected by JS --></div>
  </div>

  <!-- Detail panel -->
  <div class="pb-detail" id="pbDetail" aria-live="polite"></div>

  <p class="pb-hint">Tap any team to see <b>record, points, and their path to the title</b>.</p>

</div>
</div>

<script>
(function(){
  if (window.__CFFB_PB_LOADED) return;
  window.__CFFB_PB_LOADED = true;

  /* ============================================================
     LIVE MFL wiring
     ------------------------------------------------------------
     TEAMS / ROUNDS / PAIRS / F below are the DEMO fallback used
     for local preview. On an MFL page they are rebuilt from the
     league's real playoff bracket (see boot() at the bottom).
     ============================================================ */
  var SEASON = 2025;                                  // fallback; overridden by page year
  var BRACKET_NAME_RE = /national championship/i;     // preferred bracket name
  var MFL_CTX = { origin:'', host:'', year:String(SEASON), league:'12011' };
  var BRACKET_META = null;

  /* ---- Shared rank feed (sheet-driven CFFB power rank, keyed by franchise id) ----
     Reuses the SAME Apps Script /exec payload + localStorage cache
     (cffb_webapp_payload_v1) the Power Rankings / Standings / Live Scoring widgets
     populate. Reads the cache synchronously (ready before first paint when any
     sibling widget or a prior visit warmed it), then refreshes in the background.
     Purely additive: cold cache / feed down / no rank → rankOf() returns null and
     the badge simply isn't drawn. Guarded so a co-resident CFFB widget's copy wins
     (no double fetch). Mirror of shared/cffb-rank-feed.js (this file is hand-authored). */
  (function(){
    if (window.__cffbRankFeed) return;
    var URL = 'https://script.google.com/macros/s/AKfycbzPEJXZ0aL7GaveabunScoXiLhca0h52bYKJxXMkPdZexoEO186KreVclj7VcAGB_yW/exec';
    var CACHE_KEY = 'cffb_webapp_payload_v1', MAX_MS = 7*24*60*60*1000, byFid = {};
    // Feed ids are unpadded ("039"); MFL ids are 4-digit ("0039"). Pad both to
    // MFL's canonical 4 digits so lookups match regardless of zero-padding width.
    function normFid(id){ var s=String(id==null?'':id).trim(); return /^\d+$/.test(s)?s.padStart(4,'0'):s; }
    function absorb(p){ try{ var ts=p&&p.teams; if(!ts||!ts.length) return;
      for(var i=0;i<ts.length;i++){ var t=ts[i]; if(t&&t.id!=null&&t.rank!=null&&+t.rank>0) byFid[normFid(t.id)]=+t.rank; } }catch(e){} }
    try{ var rec=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
      if(rec&&typeof rec.ts==='number'&&rec.payload!=null&&(Date.now()-rec.ts)<=MAX_MS) absorb(rec.payload); }catch(e){}
    try{ fetch(URL,{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(d){ if(!d||!d.teams) return; absorb(d);
      try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ts:Date.now(),payload:d})); }catch(e){} }).catch(function(){}); }catch(e){}
    window.__cffbRankFeed = { rankOf:function(fid){ var r=byFid[normFid(fid)]; return r||null; }, all:function(){ return byFid; } };
  })();

  /* ---- small utils ---- */
  var asArray = function(x){ return Array.isArray(x) ? x : (x!=null ? [x] : []); };
  function fmtNum(v){
    var n = parseFloat(v);
    if(!isFinite(n)) return (v==null ? '—' : String(v));
    return n.toLocaleString('en-US',{maximumFractionDigits:1});
  }
  // Game/matchup scores always render to two decimals (MFL points arrive at mixed precision).
  function fmtScore(v){
    var n = parseFloat(v);
    return isFinite(n) ? n.toFixed(2) : (v==null ? '' : String(v));
  }
  var PALETTE = ['#4B9CD3','#B84545','#C9A227','#2C5F8A','#5C7A6A','#6B5C8B',
    '#A23B3B','#B5832E','#3A5680','#BC4B3C','#7A3B4A','#C05A3E','#C77A33',
    '#6B4A8B','#3E7A52','#B5762E','#3E6B7A','#8B5C3B'];
  function colorFor(id){
    var n=0, s=String(id||'');
    for(var i=0;i<s.length;i++){ n=(n*31 + s.charCodeAt(i))>>>0; }
    return PALETTE[n % PALETTE.length];
  }
  // MFL franchise ICON URLs are often imgur "gallery" links; rewrite to the direct CDN.
  function imgurDirect(u){
    var m = String(u||'').match(/^https?:\/\/(?:www\.)?imgur\.com\/([A-Za-z0-9]+)(?:\.[A-Za-z0-9]+)?$/i);
    return m ? 'https://i.imgur.com/'+m[1]+'.png' : (u||'');
  }

  /* ---- MFL context ---- */
  function resolveCtx(){
    var origin = location.origin;
    var yr = (String(location.pathname).match(/\/(20\d{2})\//)||[])[1]
          || (String(location.href).match(/\/(20\d{2})\//)||[])[1]
          || String(SEASON);
    var league = String(window.league_id || (String(location.href).match(/[?&]L=(\d+)/)||[])[1] || MFL_CTX.league);
    MFL_CTX = { origin:origin, host:origin, year:yr, league:league };
    SEASON = parseInt(yr,10) || SEASON;
  }
  // Best-effort current NFL week from the browser clock (Week 1 ~ first Tuesday of Sept).
  function guessNflWeek(y){
    try{
      var now=new Date(), sep1=new Date(y,8,1);
      var firstTue=new Date(y,8,1+(2-sep1.getDay()+7)%7);
      var wk=Math.floor((now-firstTue)/(7*864e5))+1;
      return Math.min(Math.max(wk,1),18);
    }catch(e){ return 18; }
  }
  function resolveWeek(){
    if(window.CFFB_BRACKET_WEEK && isFinite(parseInt(window.CFFB_BRACKET_WEEK,10))) return parseInt(window.CFFB_BRACKET_WEEK,10);
    var g = window.nfl_week || window.current_week || window.week;
    if(g && isFinite(parseInt(g,10))) return parseInt(g,10);
    return guessNflWeek(SEASON);
  }
  async function fetchJSON(type, extra){
    var url = MFL_CTX.origin+'/'+MFL_CTX.year+'/export?TYPE='+type+'&L='+MFL_CTX.league+'&JSON=1'+(extra||'');
    var res = await fetch(url, { cache:'no-store', credentials:'same-origin' });
    if(!res.ok) throw new Error('HTTP '+res.status+' for '+type);
    return res.json();
  }

  /* ---- Build TEAMS from the page's franchiseDatabase global ---- */
  function buildTeamsFromDb(){
    var db = window.franchiseDatabase;
    if(!db || typeof db!=='object') return false;
    var out={}, n=0;
    Object.keys(db).forEach(function(k){
      var f=db[k];
      if(!f || !f.id || f.id==='0000') return; // skip commissioner pseudo-franchise
      var abbr=(f.abbrev||f.id).toUpperCase();
      out[f.id]={
        id:f.id, name:f.name||abbr, abbr:abbr,
        color:colorFor(f.id),
        logo:imgurDirect(f.icon)||imgurDirect(f.logo)||'',
        seed:null, mgr:'', rec:'—', pf:'—', pa:'—', streak:'—'
      };
      n++;
    });
    if(!n) return false;
    TEAMS = out;
    return true;
  }

  /* ---- Round naming (generic; handles the 16-team bracket + others) ---- */
  function roundName(gamesInRound, isLast){
    if(isLast) return { name:'Championship', short:'FIN' };
    var teams = gamesInRound*2;
    var map = {32:['Round of 32','R32'],16:['Round of 16','R16'],8:['Quarterfinals','QF'],4:['Semifinals','SF'],2:['Championship','FIN']};
    if(map[teams]) return { name:map[teams][0], short:map[teams][1] };
    return { name:teams+'-Team Round', short:'R'+teams };
  }

  function slotData(side){
    side = side || {};
    var team = side.franchise_id ? side.franchise_id : null;
    var score = (side.points!=null && side.points!=='') ? side.points : null;
    var tbd = team ? null
      : (side.winner_of_game ? 'Winner of Game '+side.winner_of_game
        : (side.seed ? ('No. '+side.seed+' seed') : 'To be decided'));
    return { team:team, score:score, tbd:tbd, seed:(side.seed!=null&&side.seed!=='')?side.seed:null };
  }

  function makeMatch(g, week, winnerByGame, currentWeek){
    var home=g.home||{}, away=g.away||{};
    var a=slotData(home), b=slotData(away);
    var wk=parseInt(week,10);
    var win=winnerByGame[g.game_id]||null;                 // franchise that advanced (ground truth)
    var hasBoth = !!(home.franchise_id && away.franchise_id);
    var hp=parseFloat(home.points), ap=parseFloat(away.points);
    var havePts = isFinite(hp)&&isFinite(ap)&&(hp>0||ap>0);
    var status, winner=null;
    if(!hasBoth){ status='pending'; }
    else if(win){ status='final'; winner=win; }
    else if(isFinite(wk) && wk<currentWeek){
      status='final';
      winner = (isFinite(hp)&&isFinite(ap)) ? (hp>=ap ? home.franchise_id : away.franchise_id) : null;
    }
    else if(isFinite(wk) && wk===currentWeek && havePts){ status='live'; }
    else { status='pending'; }
    return { id:'g'+g.game_id, a:a, b:b, status:status, winner:winner };
  }

  /* ---- Vertical ordering of each round, from the real bracket tree ----
     MFL returns games in game_id order, which does NOT match how the bracket
     actually connects (a later game names its feeder games via winner_of_game).
     Rendering in game_id order puts games on the wrong side and forces
     connector lines to double back. We instead walk the tree from the final:
     games that feed the same matchup end up adjacent, halves stay grouped, and
     the top seed lands at the very top / the 2-seed at the very bottom — so the
     connectors never cross. Returns { game_id -> sortKey }. */
  function computeBracketOrder(rounds){
    var byId={};
    rounds.forEach(function(r){ r.games.forEach(function(g){ byId[g.game_id]={ g:g }; }); });
    function childIds(g){
      var ids=[];
      ['home','away'].forEach(function(k){
        var s=g[k]||{};
        if(s.winner_of_game && byId[s.winner_of_game]) ids.push(s.winner_of_game);
      });
      return ids;
    }
    var seedCache={};
    function minSeed(gid){
      if(seedCache[gid]!=null) return seedCache[gid];
      seedCache[gid]=999; // guard against cycles
      var node=byId[gid]; if(!node) return 999;
      var kids=childIds(node.g), res;
      if(!kids.length){
        var g=node.g, a=parseInt((g.home||{}).seed,10), b=parseInt((g.away||{}).seed,10);
        var arr=[a,b].filter(function(x){ return isFinite(x); });
        res=arr.length?Math.min.apply(null,arr):999;
      } else {
        res=Math.min.apply(null, kids.map(minSeed));
      }
      seedCache[gid]=res; return res;
    }
    var order={}, counter={ n:0 };
    // dir>=0 → better seed toward the top of this subtree; dir<0 → toward the bottom (mirror).
    function dfs(gid, dir){
      var node=byId[gid]; if(!node || order[gid]!=null) return;
      var kids=childIds(node.g);
      if(!kids.length){ order[gid]=counter.n++; return; }
      kids.sort(function(a,b){ return minSeed(a)-minSeed(b); }); // [better, worse]
      if(dir>=0){ dfs(kids[0],dir); if(kids[1]!=null) dfs(kids[1],dir); }
      else { if(kids[1]!=null) dfs(kids[1],dir); dfs(kids[0],dir); }
      var ks=kids.map(function(k){ return order[k]; }).filter(function(x){ return x!=null; });
      order[gid]=ks.length ? ks.reduce(function(a,b){ return a+b; },0)/ks.length : counter.n;
    }
    var last=rounds[rounds.length-1];
    var roots=last.games.map(function(g){ return g.game_id; });
    if(roots.length===1){
      var fg=byId[roots[0]].g, fkids=childIds(fg);
      if(fkids.length===2){
        fkids.sort(function(a,b){ return minSeed(a)-minSeed(b); });
        dfs(fkids[0], 1);   // half with the 1-seed on top
        dfs(fkids[1], -1);  // half with the 2-seed mirrored to the bottom
        order[roots[0]]=(order[fkids[0]]+order[fkids[1]])/2;
      } else { dfs(roots[0], 1); }
    } else {
      roots.forEach(function(r){ dfs(r, 1); });
    }
    return order;
  }

  /* ---- Turn the MFL playoffBracket feed into ROUNDS / PAIRS / F ---- */
  function buildModel(rawRounds){
    var rounds = asArray(rawRounds).map(function(r){ return { week:r.week, games:asArray(r.playoffGame) }; });
    if(!rounds.length) return false;
    var currentWeek = resolveWeek();

    // seeds + winner propagation (a later game's side lists winner_of_game + the franchise that advanced)
    var seedMap={}, winnerByGame={};
    rounds.forEach(function(r){
      r.games.forEach(function(g){
        ['home','away'].forEach(function(k){
          var s=g[k]||{};
          if(s.franchise_id){
            if(s.seed!=null && s.seed!=='' && seedMap[s.franchise_id]==null) seedMap[s.franchise_id]=s.seed;
            if(s.winner_of_game) winnerByGame[s.winner_of_game]=s.franchise_id;
          }
        });
      });
    });
    Object.keys(seedMap).forEach(function(fid){ if(TEAMS[fid]) TEAMS[fid].seed=parseInt(seedMap[fid],10); });

    var newRounds=[], newPairs=[];
    rounds.forEach(function(r, ri){
      var isLast = ri===rounds.length-1;
      var rn = roundName(r.games.length, isLast);
      var matches = r.games.map(function(g){ return makeMatch(g, r.week, winnerByGame, currentWeek); });
      newRounds.push({ key:rn.short, name:rn.name, short:rn.short, week:'Wk '+r.week, weekNum:parseInt(r.week,10), matches:matches });
      r.games.forEach(function(g){
        ['home','away'].forEach(function(k){
          var s=g[k]||{};
          if(s.winner_of_game) newPairs.push(['g'+s.winner_of_game, 'g'+g.game_id]);
        });
      });
    });

    // Reorder each round vertically to follow the real bracket tree (no crossing lines).
    try{
      var ord=computeBracketOrder(rounds);
      newRounds.forEach(function(rd){
        rd.matches.sort(function(m1,m2){
          var k1=ord[m1.id.slice(1)], k2=ord[m2.id.slice(1)];
          return (k1==null?1e9:k1)-(k2==null?1e9:k2);
        });
      });
    }catch(e){ console.warn('[CFFB Bracket] bracket ordering skipped', e); }

    ROUNDS = newRounds;
    PAIRS = newPairs;
    F = ROUNDS[ROUNDS.length-1].matches[0];
    return true;
  }

  /* ---- Enrich detail-panel stats from leagueStandings (best-effort) ---- */
  async function enrichStandings(){
    var s = await fetchJSON('leagueStandings');
    asArray(s.leagueStandings && s.leagueStandings.franchise).forEach(function(f){
      var t=TEAMS[f.id]; if(!t) return;
      var w=parseInt(f.h2hw,10)||0, l=parseInt(f.h2hl,10)||0, ti=parseInt(f.h2ht,10)||0;
      t.rec = w+'-'+l+(ti>0?'-'+ti:'');
      t.pf = fmtNum(f.pf);
      t.pa = fmtNum(f.pa);
    });
  }

  /* ---- Playoff win streak, derived from the bracket path ---- */
  function playoffStreak(id){
    var rows=buildPath(id), w=0, out=false;
    rows.forEach(function(r){ if(r[2]==='done') w++; else if(r[2]==='out') out=true; });
    return out ? 'OUT' : (w>0 ? ('W'+w) : '—');
  }

  function inBracket(id){
    return ROUNDS.some(function(r){ return r.matches.some(function(m){ return m.a.team===id || m.b.team===id; }); });
  }
  function pickFeatured(){
    var my=String(window.franchise_id||'');
    if(my && TEAMS[my] && inBracket(my)) return my;
    var one=Object.keys(TEAMS).filter(function(k){ return TEAMS[k].seed===1 && inBracket(k); })[0];
    if(one) return one;
    var any=Object.keys(TEAMS).filter(inBracket)[0];
    return any || Object.keys(TEAMS)[0];
  }

  /* ---- Final column + champion (dynamic) ---- */
  function finalCol(round){
    var fm=round.matches[0];
    var title=(MFL_CTX.year||SEASON)+' '+((BRACKET_META&&BRACKET_META.bracketWinnerTitle)||'League Champion');
    var champVal='&mdash; Awaiting Title Game &mdash;';
    if(fm && fm.winner && TEAMS[fm.winner]) champVal=TEAMS[fm.winner].name;
    var statusHtml = fm && fm.status==='live' ? '<span class="pb-match__status is-live">Live</span>'
                   : fm && fm.status==='final' ? '<span class="pb-match__status is-final">Final</span>'
                   : '<span class="pb-match__status">'+round.week+'</span>';
    return '<div class="pb-col pb-col--final">' +
      '<div class="pb-round-label">'+round.name+'<span>'+round.week+'</span></div>' +
      '<div class="pb-col__body">' +
        '<div class="pb-final-wrap">' +
          '<div class="pb-trophy">'+TROPHY+'</div>' +
          '<div class="pb-match pb-final" id="m-'+(fm?fm.id:'F')+'" data-match="'+(fm?fm.id:'F')+'">' +
            '<div class="pb-match__tag">' +
              '<span class="pb-match__tag-name">Title Game</span>' +
              statusHtml +
            '</div>' +
            slot('a',fm,{tbdLabel:'Semifinal 1 winner'}) +
            slot('b',fm,{tbdLabel:'Semifinal 2 winner'}) +
            '<div class="pb-champion-slot">' +
              '<div class="pb-champion-slot__label">'+title+'</div>' +
              '<div class="pb-champion-slot__val">'+champVal+'</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  /* ---- Header (live pill + week), driven by the current model ---- */
  function updateHeader(){
    var sub=document.querySelector('#cffb-pb-root .pb-sub');
    var teams=BRACKET_META?parseInt(BRACKET_META.teamsInvolved,10):0;
    if(sub && teams) sub.textContent = teams+' teams. '+ROUNDS.length+' rounds. One champion.';

    var liveRound=null, anyLive=false;
    ROUNDS.forEach(function(r){ r.matches.forEach(function(m){ if(m.status==='live'){ anyLive=true; if(!liveRound) liveRound=r; } }); });
    var champ = (F && F.status==='final' && F.winner && TEAMS[F.winner]) ? TEAMS[F.winner] : null;
    var active = liveRound
      || ROUNDS.filter(function(r){ return r.matches.some(function(m){ return m.status!=='final'; }); })[0]
      || ROUNDS[ROUNDS.length-1];

    var weekNum=document.getElementById('pbWeekNum');
    if(weekNum) weekNum.textContent = active && active.weekNum ? active.weekNum : '—';

    var tag=document.getElementById('pbLiveTag'), txt=document.getElementById('pbLiveTxt'), dot=document.getElementById('pbLiveDot');
    if(tag && txt){
      if(champ){ tag.style.display=''; txt.textContent='Champion Crowned'; if(dot) dot.style.display='none'; tag.style.color='var(--gold)'; }
      else if(anyLive){ tag.style.display=''; txt.textContent=(liveRound?liveRound.name:'Playoffs')+' Live'; if(dot) dot.style.display=''; tag.style.color=''; }
      else { tag.style.display='none'; }
    }
  }

  /* ============================================================
     DEMO fallback data (used only when not running on an MFL page).
     CFFB managers; "players" are the college athletes they drafted.
     ============================================================ */
  var TEAMS = {
    tht:{name:'Tar Heel Terrors',mgr:'Marcus Webb',abbr:'THT',color:'#4B9CD3',seed:1,rec:'12-1',pf:'1,888.4',pa:'1,502.7',streak:'W6',
      players:[{pos:'QB',name:'D. Maddox',team:'North Carolina',pts:'24.8'},{pos:'RB',name:'J. Caldwell',team:'Tennessee',pts:'21.2'},{pos:'WR',name:'T. Okafor',team:'Ole Miss',pts:'18.6'}]},
    bdd:{name:'Bulldawg Dynasty',mgr:'Sarah Chen',abbr:'BDD',color:'#B84545',seed:2,rec:'11-2',pf:'1,842.6',pa:'1,544.0',streak:'W3',
      players:[{pos:'QB',name:'C. Beck',team:'Georgia',pts:'23.1'},{pos:'RB',name:'M. Trujillo',team:'Texas',pts:'19.9'},{pos:'WR',name:'A. Pearson',team:'LSU',pts:'17.4'}]},
    bkr:{name:'Black Knights Rising',mgr:'Tom Russo',abbr:'BKR',color:'#C9A227',seed:3,rec:'11-2',pf:'1,820.9',pa:'1,560.1',streak:'W2',
      players:[{pos:'QB',name:'B. Hawkins',team:'Army',pts:'22.0'},{pos:'RB',name:'D. Sealy',team:'Navy',pts:'20.5'},{pos:'TE',name:'R. Lindsey',team:'Notre Dame',pts:'14.1'}]},
    bbr:{name:'Bulldog Brigade',mgr:'Alex Kim',abbr:'BBR',color:'#2C5F8A',seed:4,rec:'10-3',pf:'1,798.3',pa:'1,578.4',streak:'W1',
      players:[{pos:'QB',name:'M. Flores',team:'Fresno State',pts:'21.6'},{pos:'RB',name:'K. Adeyemi',team:'Boise State',pts:'18.2'},{pos:'WR',name:'J. Whitfield',team:'SMU',pts:'16.9'}]},
    gob:{name:'Gridiron Goblins',mgr:'Priya Patel',abbr:'GOB',color:'#5C7A6A',seed:5,rec:'10-3',pf:'1,781.5',pa:'1,590.2',streak:'W4',
      players:[{pos:'QB',name:'E. Vasquez',team:'Utah',pts:'20.3'},{pos:'RB',name:'L. Brooks',team:'Oregon',pts:'22.7'},{pos:'WR',name:'S. Donnelly',team:'Washington',pts:'15.8'}]},
    hmi:{name:'Hail Mary Inc.',mgr:'Derek Olsen',abbr:'HMI',color:'#6B5C8B',seed:6,rec:'10-3',pf:'1,769.8',pa:'1,601.0',streak:'L1',
      players:[{pos:'QB',name:'T. Albright',team:'Penn State',pts:'19.5'},{pos:'RB',name:'R. Mensah',team:'Ohio State',pts:'17.0'},{pos:'WR',name:'C. Iverson',team:'USC',pts:'16.2'}]},
    soo:{name:'Sooner Schooners',mgr:'Maria Lopez',abbr:'SOO',color:'#A23B3B',seed:7,rec:'9-4',pf:'1,752.1',pa:'1,610.5',streak:'W2',
      players:[{pos:'QB',name:'J. Rivera',team:'Oklahoma',pts:'21.0'},{pos:'RB',name:'D. Washington',team:'Texas Tech',pts:'18.8'},{pos:'WR',name:'M. Coleman',team:'Baylor',pts:'15.1'}]},
    tro:{name:'Trojan Horsepower',mgr:'Jamal Carter',abbr:'TRO',color:'#B5832E',seed:8,rec:'9-4',pf:'1,740.6',pa:'1,622.3',streak:'L1',
      players:[{pos:'QB',name:'K. Nguyen',team:'USC',pts:'20.9'},{pos:'RB',name:'B. Santos',team:'UCLA',pts:'17.7'},{pos:'WR',name:'A. Foster',team:'Arizona State',pts:'16.0'}]},
    wol:{name:'Wolverine Wreckers',mgr:'Ben Tanaka',abbr:'WOL',color:'#3A5680',seed:9,rec:'9-4',pf:'1,733.0',pa:'1,631.8',streak:'W3',
      players:[{pos:'QB',name:'T. Becker',team:'Michigan',pts:'19.8'},{pos:'RB',name:'J. Kowalski',team:'Michigan State',pts:'18.4'},{pos:'WR',name:'D. Reyes',team:'Wisconsin',pts:'15.6'}]},
    buc:{name:'Buckeye Bombers',mgr:'Nina Park',abbr:'BUC',color:'#BC4B3C',seed:10,rec:'8-5',pf:'1,718.4',pa:'1,640.9',streak:'W2',
      players:[{pos:'QB',name:'M. Underwood',team:'Ohio State',pts:'22.3'},{pos:'RB',name:'C. Hill',team:'Indiana',pts:'19.1'},{pos:'WR',name:'T. Banks',team:'Illinois',pts:'16.7'}]},
    agg:{name:'Aggie Avalanche',mgr:'Cole Barrett',abbr:'AGG',color:'#7A3B4A',seed:11,rec:'8-5',pf:'1,705.2',pa:'1,655.1',streak:'L2',
      players:[{pos:'QB',name:'R. Delgado',team:'Texas A&M',pts:'19.2'},{pos:'RB',name:'S. Mensah',team:'Missouri',pts:'17.9'},{pos:'WR',name:'L. Porter',team:'Arkansas',pts:'14.8'}]},
    raz:{name:'Razorback Rowdies',mgr:'Faith Nguyen',abbr:'RAZ',color:'#C05A3E',seed:12,rec:'8-5',pf:'1,699.7',pa:'1,660.4',streak:'W1',
      players:[{pos:'QB',name:'H. Bennett',team:'Arkansas',pts:'18.9'},{pos:'RB',name:'D. Cross',team:'Ole Miss',pts:'18.0'},{pos:'WR',name:'J. Tate',team:'Mississippi St.',pts:'15.3'}]},
    vol:{name:'Volunteer Vipers',mgr:'Greg Hale',abbr:'VOL',color:'#C77A33',seed:13,rec:'7-6',pf:'1,681.3',pa:'1,672.0',streak:'L1',
      players:[{pos:'QB',name:'N. Iamaleava',team:'Tennessee',pts:'20.1'},{pos:'RB',name:'C. Wright',team:'Kentucky',pts:'17.3'},{pos:'WR',name:'B. Hudson',team:'Vanderbilt',pts:'14.5'}]},
    tig:{name:'Tiger Takeover',mgr:'Yusuf Ali',abbr:'TIG',color:'#6B4A8B',seed:14,rec:'7-6',pf:'1,673.9',pa:'1,678.6',streak:'W1',
      players:[{pos:'QB',name:'G. Nussmeier',team:'LSU',pts:'21.4'},{pos:'RB',name:'K. Daniels',team:'Auburn',pts:'18.6'},{pos:'WR',name:'Z. Franklin',team:'Alabama',pts:'16.4'}]},
    duk:{name:'Duck Dynasty',mgr:'Hana Sato',abbr:'DUK',color:'#3E7A52',seed:15,rec:'7-6',pf:'1,662.5',pa:'1,689.2',streak:'L3',
      players:[{pos:'QB',name:'D. Gabriel',team:'Oregon',pts:'20.7'},{pos:'RB',name:'J. James',team:'Oregon',pts:'19.3'},{pos:'WR',name:'T. Ferguson',team:'Oregon State',pts:'15.9'}]},
    bvr:{name:'Beaver Believers',mgr:'Liam Frost',abbr:'BVR',color:'#B5762E',seed:16,rec:'6-7',pf:'1,648.0',pa:'1,701.5',streak:'L2',
      players:[{pos:'QB',name:'A. Gulbranson',team:'Oregon State',pts:'17.6'},{pos:'RB',name:'D. Martinez',team:'Washington St.',pts:'16.8'},{pos:'WR',name:'C. Velez',team:'California',pts:'14.0'}]}
  };
  Object.keys(TEAMS).forEach(function(k){ TEAMS[k].id=k; });

  /* Bracket state. Standard 16-team seeding: 1v16, 8v9, 5v12, 4v13, 6v11, 3v14, 7v10, 2v15. */
  function mk(id,a,as,b,bs,status,winner){
    return {id:id,a:{team:a,score:as},b:{team:b,score:bs},status:status,winner:winner};
  }

  var R1=mk('R1','tht','151.2','bvr','98.4','final','tht');
  var R2=mk('R2','tro','124.9','wol','128.6','final','wol');
  var R3=mk('R3','gob','140.0','raz','121.3','final','gob');
  var R4=mk('R4','bbr','133.5','vol','119.8','final','bbr');
  var R5=mk('R5','hmi','144.1','agg','130.2','final','hmi');
  var R6=mk('R6','bkr','138.7','tig','117.5','final','bkr');
  var R7=mk('R7','soo','139.2','buc','141.9','final','buc');
  var R8=mk('R8','bdd','149.6','duk','122.0','final','bdd');

  var Q1=mk('Q1','tht','145.3','wol','121.7','final','tht');
  var Q2=mk('Q2','gob','134.2','bbr','136.8','final','bbr');
  var Q3=mk('Q3','hmi','128.9','bkr','130.5','final','bkr');
  var Q4=mk('Q4','bdd','147.0','buc','125.6','final','bdd');

  var S1=mk('S1','tht','84.2','bbr','71.5','live',null);
  var S2=mk('S2','bkr','69.8','bdd','78.3','live',null);

  var F =mk('F', null,null,null,null,'pending',null);

  var ROUNDS=[
    {key:'RO16',name:'Round of 16',short:'R16',week:'Wk 14',matches:[R1,R2,R3,R4,R5,R6,R7,R8]},
    {key:'QF',  name:'Quarterfinals',short:'QF',week:'Wk 15',matches:[Q1,Q2,Q3,Q4]},
    {key:'SF',  name:'Semifinals',short:'SF',week:'Wk 16',matches:[S1,S2]},
    {key:'FIN', name:'Championship',short:'FIN',week:'Wk 17',matches:[F]}
  ];
  function ROUND_OF(id){ return ROUNDS.find(function(r){ return r.matches.some(function(m){ return m.id===id; }); }); }

  /* connector tree (left -> right) */
  var PAIRS=[
    ['R1','Q1'],['R2','Q1'],['R3','Q2'],['R4','Q2'],
    ['R5','Q3'],['R6','Q3'],['R7','Q4'],['R8','Q4'],
    ['Q1','S1'],['Q2','S1'],['Q3','S2'],['Q4','S2'],
    ['S1','F'],['S2','F']
  ];

  /* ---------------- Render ---------------- */
  /* Names off by default — the team pill carries identity. */
  var SHOW_NAMES = false;

  function pillIcon(t){
    if(t.logo) return '<img class="pb-pill-img" src="'+t.logo+'" alt="'+t.name+'" title="'+t.name+'"/>';
    return '<span class="pb-pill" style="background:'+t.color+'" title="'+t.name+'"><span class="pb-pill__dot"></span>'+t.abbr+'</span>';
  }

  function slot(side,match,opts){
    opts = opts || {};
    var data=(match && match[side]) || {};
    if(!data.team){
      return '<div class="pb-slot is-tbd">' +
        '<span class="pb-seed"></span>' +
        '<span class="pb-pill pb-pill--tbd"><span class="pb-pill__dot"></span>TBD</span>' +
        '<span class="pb-slot__name pb-slot__name--tbd">'+(data.tbd||opts.tbdLabel||'To be decided')+'</span>' +
        '<span class="pb-slot__score pb-slot__score--tbd">&mdash;</span>' +
      '</div>';
    }
    var t=TEAMS[data.team] || { id:data.team, name:data.team, abbr:String(data.team), color:colorFor(data.team), seed:data.seed };
    if(t.seed==null && data.seed!=null) t.seed=data.seed;
    var isWinner=match.winner===data.team;
    var isLoser=match.winner&&match.winner!==data.team;
    var scoreCls=match.status==='pending'?'pb-slot__score pb-slot__score--tbd':'pb-slot__score';
    var scoreVal=data.score!=null?fmtScore(data.score):'&mdash;';
    var nameHtml=SHOW_NAMES?'<span class="pb-slot__name">'+t.name+'</span>':'';
    return '<button class="pb-slot '+(isWinner?'is-winner':'')+' '+(isLoser?'is-loser':'')+'" data-team="'+t.id+'" type="button">' +
      '<span class="pb-seed">'+(t.seed!=null?t.seed:'')+'</span>' +
      pillIcon(t) +
      nameHtml +
      '<span class="'+scoreCls+'">'+scoreVal+'</span>' +
    '</button>';
  }

  function matchCard(match,opts){
    opts = opts || {};
    var r=ROUND_OF(match.id);
    var statusHtml='';
    if(match.status==='live') statusHtml='<span class="pb-match__status is-live">Live</span>';
    else if(match.status==='final') statusHtml='<span class="pb-match__status is-final">Final</span>';
    else statusHtml='<span class="pb-match__status">'+(r?r.week:'')+'</span>';
    return '<div class="pb-match '+(opts.cls||'')+'" id="m-'+match.id+'" data-match="'+match.id+'">' +
      '<div class="pb-match__tag">' +
        '<span class="pb-match__tag-name">'+(opts.label||(r?r.short:''))+'</span>' +
        statusHtml +
      '</div>' +
      slot('a',match,opts) +
      slot('b',match,opts) +
    '</div>';
  }

  var TROPHY = '<svg viewBox="0 0 24 24" fill="none">' +
    '<defs><linearGradient id="cffbPbTrg" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#E8C547"/><stop offset=".5" stop-color="#C9A227"/><stop offset="1" stop-color="#8B6F1F"/>' +
    '</linearGradient></defs>' +
    '<path d="M7 4h10v3.2a5 5 0 0 1-10 0V4Z" fill="url(#cffbPbTrg)"/>' +
    '<path d="M7 5H4.2v1.2A2.8 2.8 0 0 0 7 9M17 5h2.8v1.2A2.8 2.8 0 0 1 17 9" stroke="url(#cffbPbTrg)" stroke-width="1.4" fill="none"/>' +
    '<path d="M11 11.8h2V16h2.4a1 1 0 0 1 1 1v1.2H7.6V17a1 1 0 0 1 1-1H11v-4.2Z" fill="url(#cffbPbTrg)"/>' +
  '</svg>';

  function col(round){
    var body=round.matches.map(function(m){ return matchCard(m); }).join('');
    return '<div class="pb-col">' +
      '<div class="pb-round-label">'+round.name+'<span>'+round.week+'</span></div>' +
      '<div class="pb-col__body">'+body+'</div>' +
    '</div>';
  }

  function render(){
    var grid=document.getElementById('pbGrid');
    if(!grid) return;
    if(!ROUNDS.length){ grid.innerHTML=''; return; }
    var html='';
    for(var i=0;i<ROUNDS.length-1;i++){ html+=col(ROUNDS[i]); }
    html+=finalCol(ROUNDS[ROUNDS.length-1]);
    grid.innerHTML=html;
    bindSlots();
    drawConnectors();
    updateHeader();
  }

  /* ---------------- Connectors ---------------- */
  function rectIn(el,container){
    var r=el.getBoundingClientRect(),c=container.getBoundingClientRect();
    return {left:r.left-c.left, right:r.right-c.left, midY:(r.top+r.bottom)/2-c.top};
  }
  function elbow(svg,x1,y1,x2,y2){
    var midX=(x1+x2)/2;
    var p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d','M '+x1+' '+y1+' H '+midX+' V '+y2+' H '+x2);
    p.setAttribute('fill','none'); p.setAttribute('stroke','#3A3A3A'); p.setAttribute('stroke-width','1.5');
    svg.appendChild(p);
  }
  function drawConnectors(){
    var svg=document.getElementById('pbSvg');
    var bracket=document.querySelector('#cffb-pb-root .pb-bracket');
    if(!svg||!bracket) return;
    svg.innerHTML='';
    function get(id){ return document.getElementById('m-'+id); }
    PAIRS.forEach(function(pair){
      var ef=get(pair[0]), et=get(pair[1]);
      if(!ef||!et) return;
      var a=rectIn(ef,bracket), b=rectIn(et,bracket);
      elbow(svg,a.right,a.midY,b.left,b.midY);
    });
  }
  window.addEventListener('resize',drawConnectors);

  /* ---------------- Path + status (derived) ---------------- */
  function oppOf(m,id){ return m.a.team===id?m.b.team:m.a.team; }
  function myScore(m,id){ return m.a.team===id?m.a.score:m.b.score; }
  function theirScore(m,id){ return m.a.team===id?m.b.score:m.a.score; }
  function findMatch(round,id){ return round.matches.find(function(m){ return m.a.team===id||m.b.team===id; }); }

  function buildPath(id){
    var rows=[];
    for(var i=0;i<ROUNDS.length;i++){
      var r=ROUNDS[i];
      var m=findMatch(r,id); if(!m) continue;
      var opp=oppOf(m,id), oppT=opp?TEAMS[opp]:null;
      var my=myScore(m,id), th=theirScore(m,id);
      if(m.status==='final'){
        if(m.winner===id){ rows.push([r.short,'def. <b>'+oppT.name+'</b> '+fmtScore(my)+'&ndash;'+fmtScore(th),'done']); }
        else { rows.push([r.short,'Lost to <b>'+oppT.name+'</b> '+fmtScore(th)+'&ndash;'+fmtScore(my),'out']); break; }
      } else if(m.status==='live'){
        var lead=parseFloat(my)>=parseFloat(th);
        rows.push([r.short,(lead?'Leading':'Trailing')+' <b>'+oppT.name+'</b> '+fmtScore(my)+'&ndash;'+fmtScore(th),'live']);
      } else {
        rows.push([r.short,'Awaiting opponent','next']);
      }
    }
    return rows;
  }
  function teamStatus(id){
    for(var i=0;i<ROUNDS.length;i++){ var m=findMatch(ROUNDS[i],id); if(m&&m.status==='live') return {k:'live',t:'In '+ROUNDS[i].name.replace(/s$/,'')}; }
    for(var j=0;j<ROUNDS.length;j++){ var mm=findMatch(ROUNDS[j],id); if(mm&&mm.status==='final'&&mm.winner&&mm.winner!==id) return {k:'out',t:'Eliminated'}; }
    if(F.status==='final'&&F.winner===id) return {k:'adv',t:'Champion'};
    return {k:'adv',t:'Advanced'};
  }
  function netOf(t){
    var pf=parseFloat(String(t.pf).replace(/,/g,'')), pa=parseFloat(String(t.pa).replace(/,/g,''));
    if(!isFinite(pf)||!isFinite(pa)) return null;
    return Math.round(pf-pa);
  }

  /* ---------------- Detail panel ---------------- */
  function bindSlots(){
    document.querySelectorAll('#cffb-pb-root .pb-slot[data-team]').forEach(function(b){
      b.addEventListener('click',function(){ openDetail(b.dataset.team); });
    });
  }
  function statRow(label,val,cls){
    cls = cls || '';
    return '<div class="pb-stat"><span class="pb-stat__l">'+label+'</span><span class="pb-stat__v '+cls+'">'+val+'</span></div>';
  }
  function openDetail(id){
    var t=TEAMS[id]; if(!t) return;
    document.querySelectorAll('#cffb-pb-root .pb-slot[data-team]').forEach(function(s){
      s.classList.toggle('is-selected',s.dataset.team===id);
    });
    var st=teamStatus(id);
    var pillCls=st.k==='live'?'pb-statuspill--live':st.k==='out'?'pb-statuspill--out':'pb-statuspill--adv';
    var pathHtml=buildPath(id).map(function(row){
      return '<div class="pb-path__row is-'+row[2]+'"><span class="pb-path__node">'+row[0]+'</span><span class="pb-path__txt">'+row[1]+'</span></div>';
    }).join('') || '<div class="pb-path__row is-next"><span class="pb-path__node">&mdash;</span><span class="pb-path__txt">Not in this bracket.</span></div>';
    var streak=playoffStreak(id);
    var streakPos=streak.charAt(0)==='W';
    var streakCls=streak==='—'?'':(streakPos?'is-pos':'is-neg');
    var net=netOf(t);
    var seedTxt=t.seed!=null?('No. '+t.seed+' Seed'):'Playoff Team';
    // Sheet-driven CFFB power rank (same rank Power Rankings shows). null → no chip.
    var powerRank=(window.__cffbRankFeed?window.__cffbRankFeed.rankOf(t.id):null);
    var rankHtml=powerRank!=null?'<span class="pb-detail__rankbadge" title="CFFB Power Ranking">#'+powerRank+' Power</span>':'';
    var mgrHtml=t.mgr?'<span class="pb-detail__mgr">Managed by <b>'+t.mgr+'</b></span>':'';
    var chip = t.logo
      ? '<span class="pb-detail__chip" style="background:'+(t.color||'#1C1C1C')+';padding:0;overflow:hidden"><img src="'+t.logo+'" alt="'+t.abbr+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/></span>'
      : '<span class="pb-detail__chip" style="background:'+(t.color||'#1C1C1C')+'">'+t.abbr+'</span>';
    var d=document.getElementById('pbDetail');
    d.innerHTML =
      '<div class="pb-detail__bar"></div>' +
      '<div class="pb-detail__top">' +
        chip +
        '<span class="pb-detail__id">' +
          '<span class="pb-detail__seedline">' +
            '<span class="pb-detail__seedbadge">'+seedTxt+'</span>' +
            rankHtml +
            mgrHtml +
          '</span>' +
          '<span class="pb-detail__name">'+t.name+'</span>' +
        '</span>' +
        '<span class="pb-statuspill '+pillCls+'">'+st.t+'</span>' +
        '<button class="pb-detail__close" id="pbClose" aria-label="Close" type="button">&times;</button>' +
      '</div>' +
      '<div class="pb-detail__body">' +
        '<div class="pb-detail__col">' +
          '<div class="pb-detail__h">Season R&eacute;sum&eacute;</div>' +
          '<div class="pb-stats">' +
            statRow('Record',t.rec) +
            statRow('Playoffs',streak,streakCls) +
            statRow('Seed',t.seed!=null?('#'+t.seed):'&mdash;') +
            statRow('Points For',t.pf) +
            statRow('Points Against',t.pa) +
            statRow('Net',net==null?'&mdash;':((net>=0?'+':'')+net.toLocaleString()),net==null?'':(net>=0?'is-pos':'is-neg')) +
          '</div>' +
        '</div>' +
        '<div class="pb-detail__col">' +
          '<div class="pb-detail__h">Path to the Title</div>' +
          '<div class="pb-path">'+pathHtml+'</div>' +
        '</div>' +
      '</div>';
    d.classList.add('is-open');
    document.getElementById('pbClose').addEventListener('click',closeDetail);
    drawConnectors();
  }
  function closeDetail(){
    document.getElementById('pbDetail').classList.remove('is-open');
    document.querySelectorAll('#cffb-pb-root .pb-slot.is-selected').forEach(function(s){
      s.classList.remove('is-selected');
    });
  }

  /* ---------------- Render + boot ---------------- */
  function finishRender(){
    render();
    var feat=pickFeatured();
    if(feat) openDetail(feat);
    function redraw(){ drawConnectors(); }
    window.addEventListener('load',redraw);
    if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(redraw); }
    setTimeout(redraw,150);
    setTimeout(redraw,600);
  }

  // Pull the league's real playoff bracket from MFL (same-origin).
  async function loadLive(){
    var bl=await fetchJSON('playoffBrackets');
    var list=asArray(bl.playoffBrackets && bl.playoffBrackets.playoffBracket);
    var meta=list.filter(function(b){ return BRACKET_NAME_RE.test(b.name||''); })[0] || list[0];
    if(!meta) throw new Error('no playoff bracket defined for this league');
    BRACKET_META=meta;
    var bd=await fetchJSON('playoffBracket','&BRACKET_ID='+meta.id);
    var rr=asArray(bd.playoffBracket && bd.playoffBracket.playoffRound);
    if(!rr.length) throw new Error('bracket "'+meta.name+'" has no games yet');
    try{ await enrichStandings(); }catch(e){ console.warn('[CFFB Bracket] standings enrich skipped', e); }
    if(!buildModel(rr)) throw new Error('could not build bracket model');
    console.log('[CFFB Bracket] "'+meta.name+'" — '+ROUNDS.length+' rounds loaded from MFL '+MFL_CTX.year);
  }

  function boot(){
    // Snapshot the demo data so we can fall back if the live load fails.
    var DEMO={ TEAMS:TEAMS, ROUNDS:ROUNDS, PAIRS:PAIRS, F:F };
    var haveDb=false;
    try{ haveDb=!!(window.franchiseDatabase); }catch(e){ haveDb=false; }
    if(haveDb){
      resolveCtx();
      if(!buildTeamsFromDb()){ finishRender(); return; }   // no usable franchises → demo
      loadLive().then(finishRender).catch(function(e){
        console.warn('[CFFB Bracket] live load failed; showing demo bracket.', e);
        TEAMS=DEMO.TEAMS; ROUNDS=DEMO.ROUNDS; PAIRS=DEMO.PAIRS; F=DEMO.F;
        finishRender();
      });
    } else {
      console.log('[CFFB Bracket] no MFL context detected — showing demo bracket.');
      finishRender();
    }
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',boot);
  } else {
    boot();
  }
})();
</script>
