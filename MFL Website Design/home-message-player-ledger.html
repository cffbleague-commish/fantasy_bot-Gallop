<style>
/* ============================================================
   CFFB.css — College Fantasy Football League stylesheet
   Drop-in stylesheet for MyFantasyLeague custom CSS.

   Built on: CFFB Design System (dark mode, championship gold)
   Inspiration: ESPN GameDay, CFP broadcast graphics, 247sports.

   Sections
   --------
   01  Foundations  — tokens, fonts, reset
   02  Typography   — display + body helpers
   03  Page chrome  — top bar, sidebar, page shell, ticker
   04  Surfaces     — cards, KPI tiles, panels
   05  Tables       — MFL legacy tables + custom data tables
   06  Buttons + forms
   07  Player atoms — name plate, position chip, team chip
   08  NEW · Redshirt chips (traditional + medical bandage)
   09  NEW · Eligibility dots (class + years used)
   10  NEW · Award badges (Heisman, Davey O'Brien, Doak Walker,
            Biletnikoff, Conference All-American)
   11  Misc · stars, conference badges, grade pills, value delta
   12  Utilities
   ============================================================ */


/* ============================================================
   01 · FOUNDATIONS
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root {
  /* Surfaces */
  --bg-canvas:        #0A0A0A;
  --bg-surface:       #141414;
  --bg-surface-elev:  #1C1C1C;
  --bg-surface-hover: #1F1F1F;
  --border:           #2A2A2A;
  --border-strong:    #3A3A3A;

  /* Text */
  --fg-primary:   #F5F5F5;
  --fg-secondary: #9A9A9A;
  --fg-tertiary:  #5A5A5A;

  /* Championship gold */
  --gold:          #C9A227;
  --gold-light:    #E8C547;
  --gold-dark:     #8B6F1F;
  --gold-gradient: linear-gradient(135deg, #E8C547 0%, #C9A227 50%, #8B6F1F 100%);

  /* Star tiers */
  --star-5: #C9A227;
  --star-4: #3B82C4;
  --star-3: #7BA4C9;
  --star-2: #6A6A6A;
  --star-1: #4A4A4A;

  /* Grades */
  --grade-a: #2D7A4E;
  --grade-b: #4A9968;
  --grade-c: #C9A227;
  --grade-d: #B84545;
  --grade-f: #B84545;

  /* Deltas */
  --delta-pos:  #2D7A4E;
  --delta-neg:  #B84545;
  --delta-flat: #5A5A5A;

  /* Live */
  --live: #2D7A4E;

  /* Conferences */
  --conf-sec: #C9A227; --conf-b1g: #4A6FA5; --conf-acc: #8B4A5C;
  --conf-big12: #B84545; --conf-pac: #5C7A6A; --conf-aac: #6B5C8B;
  --conf-mw: #8B6F1F; --conf-ind: #5A5A5A;

  /* Eligibility / Redshirt */
  --rs-trad:    #C9A227;   /* gold shield */
  --rs-medical: #D17575;   /* dusty red bandage */

  /* Type */
  --font-display: 'Saira Condensed', 'Oswald', 'Bebas Neue', system-ui, sans-serif;
  --font-body:    'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono:    ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;

  /* Type scale */
  --ds-hero: 64px; --ds-1: 48px; --ds-2: 32px; --ds-3: 24px; --ds-4: 18px;
  --tx-lg: 16px; --tx-md: 14px; --tx-sm: 13px; --tx-xs: 12px; --tx-2xs: 11px;

  /* Weights */
  --w-400: 400; --w-500: 500; --w-600: 600; --w-700: 700;

  /* Spacing — 8px base */
  --s-half: 4px;
  --s-1:  8px; --s-2: 16px; --s-3: 24px; --s-4: 32px;
  --s-5: 40px; --s-6: 48px; --s-7: 64px; --s-8: 80px;

  /* Radii */
  --r-1: 2px; --r-2: 4px; --r-3: 8px; --r-4: 12px; --r-pill: 999px;

  /* Shadows */
  --shadow-sm:        0 1px 2px rgba(0,0,0,0.5);
  --shadow-md:        0 8px 24px rgba(0,0,0,0.6);
  --shadow-lg:        0 20px 60px rgba(0,0,0,0.7);
  --shadow-glow-gold: 0 0 24px rgba(201,162,39,0.28);
  --shadow-glow-live: 0 0 12px rgba(45,122,78,0.55);
  --inset-metallic:   inset 0 1px 0 rgba(255,255,255,0.06);

  /* Motion */
  --ease-out:   cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-in:    cubic-bezier(0.4, 0, 1, 1);
  --ease-inout: cubic-bezier(0.4, 0, 0.2, 1);
  --dur-fast: 120ms; --dur-base: 180ms; --dur-slow: 240ms;

  /* Layout */
  --container-max: 1280px;
  --topbar-h: 64px;
  --ticker-h: 44px;
}

/* Reset (light, MFL-friendly) */
*, *::before, *::after { box-sizing: border-box; }


/* Tabular numerics on anything that holds a number */
.cffb-num, .cffb-num *, td.cffb-num, th.cffb-num {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}


/* ============================================================
   02 · TYPOGRAPHY
   ============================================================ */

.cffb-display-hero,
.cffb-display-1,
.cffb-display-2,
.cffb-display-3,
.cffb-display-4 {
  font-family: var(--font-display);
  text-transform: uppercase;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  margin: 0;
}
.cffb-display-hero { font-weight: 700; font-size: var(--ds-hero); line-height: 1; }
.cffb-display-1    { font-weight: 700; font-size: var(--ds-1); line-height: 1.05; }
.cffb-display-2    { font-weight: 700; font-size: var(--ds-2); line-height: 1.1; }
.cffb-display-3    { font-weight: 600; font-size: var(--ds-3); line-height: 1.15; }
.cffb-display-4    { font-weight: 600; font-size: var(--ds-4); line-height: 1.2; }

.cffb-h1 { font: 700 28px/1.2 var(--font-body); letter-spacing: -0.01em; margin: 0; }
.cffb-h2 { font: 600 20px/1.25 var(--font-body); margin: 0; }
.cffb-h3 { font: 600 16px/1.3 var(--font-body); margin: 0; }
.cffb-body    { font-size: var(--tx-md); color: var(--fg-primary); }
.cffb-body-sm { font-size: var(--tx-sm); color: var(--fg-secondary); }

.cffb-label {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--tx-2xs);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--fg-secondary);
}
.cffb-eyebrow {
  font-family: var(--font-body);
  font-weight: 700;
  font-size: var(--tx-2xs);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--gold);
}

/* Gold-gradient text — RESERVE for the page's hero value only. */
.cffb-gold-text {
  background: var(--gold-gradient);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}


/* ============================================================
   03 · PAGE CHROME
   ============================================================ */

.cffb-shell {
  min-height: 100vh;
  display: flex; flex-direction: column;
}

/* Top bar — sticky, 64px, holds wordmark + nav + manager chip */
.cffb-topbar {
  position: sticky; top: 0; z-index: 50;
  height: var(--topbar-h);
  background: rgba(10,10,10,0.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 var(--s-3);
  gap: var(--s-3);
}
.cffb-topbar__brand {
  display: flex; align-items: center; gap: var(--s-1);
  font-family: var(--font-display); font-weight: 700;
  text-transform: uppercase; font-size: var(--ds-4);
  letter-spacing: 0.02em;
  color: var(--fg-primary);
  border-right: 1px solid var(--border);
  padding-right: var(--s-3);
  height: 100%;
}
.cffb-topbar__brand-mark {
  width: 28px; height: 28px;
  background: var(--gold-gradient);
  -webkit-mask: url('assets/cffb-mark.svg') center/contain no-repeat;
          mask: url('assets/cffb-mark.svg') center/contain no-repeat;
}
.cffb-topbar__nav {
  display: flex; align-items: center; gap: var(--s-half);
  height: 100%;
}
.cffb-topbar__nav a {
  font-family: var(--font-body); font-weight: 600;
  font-size: var(--tx-sm); letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--fg-secondary);
  padding: 0 var(--s-2); height: 100%;
  display: inline-flex; align-items: center;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  text-decoration: none;
  transition: color var(--dur-fast) var(--ease-out);
}
.cffb-topbar__nav a:hover { color: var(--fg-primary); text-decoration: none; }
.cffb-topbar__nav a.is-active {
  color: var(--fg-primary);
  border-bottom-color: var(--gold);
}
.cffb-topbar__spacer { flex: 1; }
.cffb-topbar__manager {
  display: inline-flex; align-items: center; gap: var(--s-1);
  padding: var(--s-half) var(--s-2);
  background: var(--bg-surface-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-2);
  font-size: var(--tx-sm); font-weight: 600;
}
.cffb-topbar__manager-cap {
  font-variant-numeric: tabular-nums;
  color: var(--gold);
  font-family: var(--font-display);
  font-size: 16px;
}

/* Ticker — sticky under topbar, 44px, scrolls left */
.cffb-ticker {
  position: sticky; top: var(--topbar-h); z-index: 49;
  height: var(--ticker-h);
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  display: flex; align-items: center;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
          mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
}
.cffb-ticker__label {
  position: absolute; left: 0; top: 0; bottom: 0;
  display: inline-flex; align-items: center; gap: var(--s-1);
  padding: 0 var(--s-2);
  background: var(--bg-surface-elev);
  border-right: 1px solid var(--border);
  font-family: var(--font-display); font-weight: 700;
  font-size: var(--tx-sm); letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--gold);
  z-index: 2;
}
.cffb-ticker__track {
  display: inline-flex; align-items: center; gap: var(--s-4);
  white-space: nowrap;
  padding-left: 140px;
  animation: cffb-ticker-scroll 60s linear infinite;
}
.cffb-ticker__item {
  display: inline-flex; align-items: baseline; gap: var(--s-1);
  font-size: var(--tx-sm); color: var(--fg-secondary);
  font-variant-numeric: tabular-nums;
}
.cffb-ticker__item strong {
  font-family: var(--font-display); font-weight: 700;
  color: var(--fg-primary); font-size: var(--tx-md);
  text-transform: uppercase;
}
.cffb-ticker__item em { font-style: normal; color: var(--gold); font-weight: 600; }
.cffb-ticker__sep { color: var(--border-strong); }
@keyframes cffb-ticker-scroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* Page shell */
.cffb-page {
  flex: 1;
  max-width: var(--container-max);
  width: 100%;
  margin: 0 auto;
  padding: var(--s-3) var(--s-3) var(--s-7);
}
.cffb-page__head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: var(--s-3);
  margin-bottom: var(--s-3);
  padding-bottom: var(--s-2);
  border-bottom: 1px solid var(--border);
}
.cffb-page__title {
  font-family: var(--font-display); font-weight: 700;
  font-size: 40px; line-height: 1; text-transform: uppercase;
  letter-spacing: -0.005em;
}

/* Footer */
.cffb-footer {
  border-top: 1px solid var(--border);
  padding: var(--s-3);
  font-size: var(--tx-xs);
  color: var(--fg-tertiary);
  text-align: center;
}


/* ============================================================
   04 · SURFACES — cards, KPI tiles, panels
   ============================================================ */

.cffb-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--r-3);
  padding: var(--s-2) var(--s-3);
}
.cffb-card--featured { box-shadow: var(--inset-metallic); }
.cffb-card--featured::before {
  content: ""; display: block; height: 3px;
  background: var(--gold-gradient);
  margin: calc(var(--s-2) * -1) calc(var(--s-3) * -1) var(--s-2);
  border-radius: var(--r-3) var(--r-3) 0 0;
}
.cffb-card__head {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--s-2);
  margin-bottom: var(--s-2);
}
.cffb-card__title {
  font-family: var(--font-display);
  font-weight: 700; font-size: 20px;
  text-transform: uppercase; letter-spacing: 0.02em;
}
.cffb-card__action {
  font-size: var(--tx-xs); color: var(--fg-secondary);
  text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600;
}

/* KPI tile */
.cffb-kpi {
  background: var(--bg-surface-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-3);
  padding: var(--s-2) var(--s-3) 18px;
  display: flex; flex-direction: column; gap: var(--s-1);
  min-width: 0;
}
.cffb-kpi__label { /* alias for .cffb-label */
  font-family: var(--font-body);
  font-weight: 600; font-size: var(--tx-2xs);
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--fg-secondary);
}
.cffb-kpi__value {
  font-family: var(--font-display); font-weight: 700;
  font-size: var(--ds-1); line-height: 1;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
  text-transform: uppercase;
}
.cffb-kpi__value--hero {
  background: var(--gold-gradient);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
}
.cffb-kpi__sub {
  font-size: var(--tx-xs); color: var(--fg-secondary);
  font-variant-numeric: tabular-nums;
}
.cffb-kpi__sub--pos { color: var(--delta-pos); }
.cffb-kpi__sub--neg { color: var(--delta-neg); }
.cffb-kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-2); }

/* Live indicator */
.cffb-live {
  display: inline-flex; align-items: center; gap: var(--s-1);
  font-family: var(--font-body); font-weight: 700;
  font-size: var(--tx-2xs); letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--live);
}
.cffb-live__dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--live);
  box-shadow: var(--shadow-glow-live);
  animation: cffb-live-pulse 1.4s ease-in-out infinite;
}
@keyframes cffb-live-pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50%      { transform: scale(0.7); opacity: 0.55; }
}


/* ============================================================
   05 · TABLES (MFL legacy + custom)
   ============================================================ */

.cffb-table-wrap {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--r-3);
  overflow: hidden;
}
.cffb-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--tx-sm);
  font-variant-numeric: tabular-nums;
}
.cffb-table thead th {
  text-align: left;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--tx-2xs);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg-secondary);
  padding: 12px var(--s-2);
  background: var(--bg-surface-elev);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.cffb-table tbody td {
  padding: 12px var(--s-2);
  border-bottom: 1px solid var(--border);
  color: var(--fg-primary);
  vertical-align: middle;
}
.cffb-table tbody tr:last-child td { border-bottom: none; }
.cffb-table tbody tr {
  position: relative;
  transition: background var(--dur-fast);
}
.cffb-table tbody tr:hover { background: var(--bg-surface-hover); }
.cffb-table tbody tr:hover td:first-child { box-shadow: inset 2px 0 0 var(--gold); }
.cffb-table tbody tr.is-active td:first-child { box-shadow: inset 2px 0 0 var(--gold); }
.cffb-table__num { text-align: right; }
.cffb-table__rank {
  font-family: var(--font-display); font-weight: 700;
  color: var(--fg-secondary);
  width: 40px; text-align: center;
}


/* ============================================================
   06 · BUTTONS + FORMS
   ============================================================ */

.cffb-btn {
  display: inline-flex; align-items: center; gap: var(--s-1);
  font-family: var(--font-body); font-weight: 600;
  font-size: var(--tx-xs); letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: var(--r-2);
  background: var(--bg-surface-elev);
  color: var(--fg-primary);
  cursor: pointer;
  box-shadow: var(--inset-metallic);
  transition: filter var(--dur-fast) var(--ease-out), background var(--dur-fast);
}
.cffb-btn:hover { filter: brightness(1.08); }
.cffb-btn:active { filter: brightness(0.9); }
.cffb-btn--primary {
  background: var(--gold-gradient);
  color: #0A0A0A;
  border-color: transparent;
}
.cffb-btn--ghost {
  background: transparent;
  color: var(--fg-secondary);
  border-color: transparent;
  box-shadow: none;
}
.cffb-btn--sm { padding: 6px 10px; font-size: 10px; }

.cffb-input {
  font-family: var(--font-body); font-size: var(--tx-md);
  padding: 10px 12px;
  background: var(--bg-surface-elev);
  border: 1px solid var(--border);
  border-radius: var(--r-2);
  color: var(--fg-primary);
  width: 100%;
}
.cffb-input::placeholder { color: var(--fg-tertiary); }
.cffb-input:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201,162,39,0.18);
}


/* ============================================================
   07 · PLAYER ATOMS — name plate, position chip, team chip
   ============================================================ */

.cffb-player {
  display: inline-flex; align-items: center; gap: var(--s-1);
  min-width: 0;
}
.cffb-player__name {
  font-family: var(--font-display);
  font-weight: 700; font-size: 18px;
  text-transform: uppercase; letter-spacing: -0.005em;
  color: var(--fg-primary);
  white-space: nowrap;
}
.cffb-player__meta {
  font-size: var(--tx-xs); color: var(--fg-secondary);
  font-variant-numeric: tabular-nums;
}

.cffb-pos {
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; font-size: 12px;
  min-width: 28px; padding: 3px 6px;
  border-radius: var(--r-1);
  color: #0A0A0A;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.cffb-pos--qb { background: #C9A227; }
.cffb-pos--rb { background: #3B82C4; color: #F5F5F5; }
.cffb-pos--wr { background: #7BA4C9; }
.cffb-pos--te { background: #8B6F1F; color: #F5F5F5; }
.cffb-pos--ol { background: #6A6A6A; color: #F5F5F5; }
.cffb-pos--def, .cffb-pos--lb, .cffb-pos--db { background: #B84545; color: #F5F5F5; }
.cffb-pos--k  { background: #5C7A6A; color: #F5F5F5; }

/* Team logo — canonical "ripped pill" PNGs in assets/teams/<slug>.png.
   Conference badge on left, torn-paper edge, team art on right (250×60).
   Sizes match the design system: sm 30px, md 48px, lg 60px tall. */
.cffb-team {
  display: inline-block;
  height: 48px; width: auto;
  vertical-align: middle;
  flex-shrink: 0;
}
.cffb-team--sm { height: 30px; }
.cffb-team--md { height: 48px; }
.cffb-team--lg { height: 60px; }

/* Team chip — circular fallback for teams without ripped art yet */
.cffb-team-chip {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px;
  border-radius: 50%;
  font-family: var(--font-display); font-weight: 700;
  font-size: 11px; letter-spacing: 0;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
  flex-shrink: 0;
}
.cffb-team-chip--sm { width: 24px; height: 24px; font-size: 9px; }
.cffb-team-chip--lg { width: 48px; height: 48px; font-size: 14px; }


/* ============================================================
   08 · REDSHIRT CHIPS — Traditional + Medical (NEW)
   ------------------------------------------------------------
   Sits inline next to a player's name. Shield silhouette,
   gold for traditional, dusty-red bandage for medical.

   Markup:
     <span class="cffb-rs cffb-rs--trad" title="Traditional Redshirt">
       <svg class="cffb-rs__icon" viewBox="0 0 20 22">…shield…</svg>
       <span class="cffb-rs__txt">RS</span>
     </span>
     <span class="cffb-rs cffb-rs--med" title="Medical Redshirt">
       <svg class="cffb-rs__icon" viewBox="0 0 20 22">…shield+bandage…</svg>
       <span class="cffb-rs__txt">MRS</span>
     </span>

   Sizes: --xs (12px), --sm (14px default), --md (18px)
   ------------------------------------------------------------ */

.cffb-rs {
  display: inline-flex; align-items: center;
  gap: 4px;
  vertical-align: middle;
  cursor: help;
}
.cffb-rs__icon {
  display: block;
  width: 14px; height: auto;
  flex-shrink: 0;
}
.cffb-rs__txt {
  font-family: var(--font-display); font-weight: 700;
  font-size: 10px; letter-spacing: 0.06em;
  text-transform: uppercase;
  line-height: 1;
}

/* Sizes */
.cffb-rs--xs .cffb-rs__icon { width: 10px; }
.cffb-rs--xs .cffb-rs__txt  { font-size: 8.5px; }
.cffb-rs--sm .cffb-rs__icon { width: 14px; }
.cffb-rs--sm .cffb-rs__txt  { font-size: 10px; }
.cffb-rs--md .cffb-rs__icon { width: 18px; }
.cffb-rs--md .cffb-rs__txt  { font-size: 12px; }

/* Traditional */
.cffb-rs--trad           { color: var(--rs-trad); }
.cffb-rs--trad .cffb-rs__icon { stroke: var(--rs-trad); fill: rgba(201,162,39,0.08); }

/* Medical */
.cffb-rs--med            { color: var(--rs-medical); }
.cffb-rs--med .cffb-rs__icon { stroke: var(--rs-medical); fill: rgba(209,117,117,0.08); }

/* Icon-only variant (no text), used in tight rows/tables */
.cffb-rs--solo .cffb-rs__txt { display: none; }
.cffb-rs--solo { gap: 0; }


/* ============================================================
   09 · ELIGIBILITY DOTS — class + years used (NEW)
   ------------------------------------------------------------
   Class label (FR / SO / JR / SR / GR) + 5 dots showing years
   used / remaining. Redshirt years marked with a ring (◎) instead
   of a fill — communicates "burned a year but no eligibility used".

   Markup:
     <span class="cffb-elig">
       <span class="cffb-elig__class">JR</span>
       <span class="cffb-elig__dots" aria-label="2 of 5 eligibility used">
         <span class="cffb-elig__dot is-used"></span>
         <span class="cffb-elig__dot is-rs"></span>   ← redshirt
         <span class="cffb-elig__dot is-used"></span>
         <span class="cffb-elig__dot"></span>
         <span class="cffb-elig__dot"></span>
       </span>
       <span class="cffb-elig__remain">2 left</span>
     </span>
   ------------------------------------------------------------ */

.cffb-elig {
  display: inline-flex; align-items: center; gap: var(--s-1);
  font-family: var(--font-body);
  font-variant-numeric: tabular-nums;
  vertical-align: middle;
}
.cffb-elig__class {
  font-family: var(--font-display); font-weight: 700;
  font-size: 13px; letter-spacing: 0.04em;
  text-transform: uppercase;
  min-width: 26px; padding: 3px 6px;
  border: 1px solid var(--border-strong);
  border-radius: var(--r-1);
  color: var(--fg-primary);
  text-align: center;
  background: var(--bg-surface-elev);
}
.cffb-elig__class--fr { border-color: var(--gold-dark); color: var(--gold-light); }
.cffb-elig__class--so { border-color: var(--gold-dark); color: var(--gold-light); }
.cffb-elig__class--jr { border-color: var(--gold); color: var(--gold); }
.cffb-elig__class--sr { border-color: var(--gold); color: var(--gold); }
.cffb-elig__class--gr { border-color: var(--gold-light); color: var(--gold-light); background: rgba(201,162,39,0.12); }

.cffb-elig__dots {
  display: inline-flex; gap: 3px; align-items: center;
}
.cffb-elig__dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  border: 1.5px solid var(--border-strong);
  background: transparent;
  transition: background var(--dur-fast);
}
.cffb-elig__dot.is-used {
  background: var(--gold);
  border-color: var(--gold);
}
.cffb-elig__dot.is-rs {
  /* Redshirt: filled ring with hollow center — "year burned, no game time" */
  background:
    radial-gradient(circle, transparent 0 2.5px, var(--rs-trad) 2.5px 100%);
  border-color: var(--rs-trad);
}
.cffb-elig__dot.is-rs-med {
  background:
    radial-gradient(circle, transparent 0 2.5px, var(--rs-medical) 2.5px 100%);
  border-color: var(--rs-medical);
}
.cffb-elig__remain {
  font-size: var(--tx-xs); color: var(--fg-secondary);
  font-weight: 600;
  margin-left: 2px;
}

/* Compact variant — no remaining label, no class chip */
.cffb-elig--compact { gap: var(--s-half); }
.cffb-elig--compact .cffb-elig__class { display: none; }
.cffb-elig--compact .cffb-elig__remain { display: none; }


/* ============================================================
   10 · AWARD BADGES — Heisman, Davey O'Brien, Doak Walker,
        Biletnikoff, Conference All-American (NEW)
   ------------------------------------------------------------
   Stacked horizontal badges with a stroke-icon glyph, award
   name, and year. The Heisman is the hero — metallic gold
   gradient fill; the four position awards share a uniform
   gold-outline treatment. Conference All-American picks up the
   player's conference accent color.

   Markup:
     <div class="cffb-awards">
       <span class="cffb-award cffb-award--heisman">
         <svg class="cffb-award__glyph" viewBox="0 0 24 24">…</svg>
         <span class="cffb-award__name">Heisman</span>
         <span class="cffb-award__year">2024</span>
       </span>
       <span class="cffb-award cffb-award--obrien">…</span>
       …
     </div>
   ------------------------------------------------------------ */

.cffb-awards {
  display: flex; flex-wrap: wrap;
  gap: var(--s-1);
  align-items: center;
}

.cffb-award {
  display: inline-flex; align-items: center; gap: var(--s-1);
  padding: 5px 10px 5px 8px;
  border-radius: var(--r-2);
  border: 1px solid var(--border-strong);
  background: var(--bg-surface-elev);
  font-family: var(--font-body);
  font-size: var(--tx-xs); font-weight: 600;
  color: var(--fg-primary);
  white-space: nowrap;
  transition: filter var(--dur-fast);
  cursor: default;
}
.cffb-award:hover { filter: brightness(1.08); }

.cffb-award__glyph {
  width: 16px; height: 16px;
  flex-shrink: 0;
  stroke: currentColor; fill: none; stroke-width: 1.75;
  color: var(--gold);
}
.cffb-award__name {
  letter-spacing: 0.04em;
}
.cffb-award__year {
  color: var(--fg-secondary);
  font-variant-numeric: tabular-nums;
  font-weight: 500;
  font-size: 11px;
}

/* Heisman — hero treatment, metallic gold fill */
.cffb-award--heisman {
  background: var(--gold-gradient);
  border-color: transparent;
  color: #0A0A0A;
  box-shadow: var(--shadow-glow-gold), var(--inset-metallic);
  font-weight: 700;
}
.cffb-award--heisman .cffb-award__glyph { color: #0A0A0A; stroke-width: 2; }
.cffb-award--heisman .cffb-award__year  { color: rgba(10,10,10,0.65); }

/* Position awards — gold outline */
.cffb-award--obrien,
.cffb-award--walker,
.cffb-award--biletnikoff {
  border-color: rgba(201,162,39,0.45);
  background: rgba(201,162,39,0.06);
}

/* Conference All-American — picks up conference color */
.cffb-award--allamerican {
  border-color: rgba(154,154,154,0.35);
}
.cffb-award--allamerican.is-sec   { border-color: rgba(201,162,39,0.45); color: var(--fg-primary); }
.cffb-award--allamerican.is-sec .cffb-award__glyph { color: var(--gold); }
.cffb-award--allamerican.is-b1g   { border-color: rgba(74,111,165,0.55); }
.cffb-award--allamerican.is-b1g .cffb-award__glyph { color: #7DA0CC; }
.cffb-award--allamerican.is-acc   { border-color: rgba(139,74,92,0.55); }
.cffb-award--allamerican.is-acc .cffb-award__glyph { color: #C58DA0; }
.cffb-award--allamerican.is-big12 { border-color: rgba(184,69,69,0.55); }
.cffb-award--allamerican.is-big12 .cffb-award__glyph { color: #D88787; }
.cffb-award--allamerican.is-pac   { border-color: rgba(92,122,106,0.55); }
.cffb-award--allamerican.is-pac .cffb-award__glyph { color: #9CB8A8; }

/* Size variants */
.cffb-awards--sm .cffb-award { padding: 3px 8px 3px 6px; font-size: 11px; gap: 5px; }
.cffb-awards--sm .cffb-award__glyph { width: 13px; height: 13px; }
.cffb-awards--sm .cffb-award__year { font-size: 10px; }


/* ============================================================
   11 · MISC — stars, conference badges, grade pills, value delta
   ============================================================ */

/* Stars */
.cffb-stars { display: inline-flex; align-items: center; gap: 2px; }
.cffb-star { font-size: 14px; line-height: 1; color: var(--star-5); }
.cffb-star--off { color: var(--border); }
.cffb-stars--t5 .cffb-star { color: var(--star-5); }
.cffb-stars--t4 .cffb-star { color: var(--star-4); }
.cffb-stars--t3 .cffb-star { color: var(--star-3); }
.cffb-stars--t2 .cffb-star { color: var(--star-2); }

/* Conference badges */
.cffb-conf {
  display: inline-flex; align-items: center;
  font-family: var(--font-body); font-weight: 600;
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  padding: 4px 8px; border-radius: var(--r-1);
  border: 1px solid transparent; color: var(--fg-primary);
}
.cffb-conf--sec   { background: rgba(201,162,39,0.15); color: var(--gold); border-color: rgba(201,162,39,0.4); }
.cffb-conf--b1g   { background: rgba(74,111,165,0.15); color: #7DA0CC; border-color: rgba(74,111,165,0.4); }
.cffb-conf--acc   { background: rgba(139,74,92,0.18); color: #C58DA0; border-color: rgba(139,74,92,0.45); }
.cffb-conf--big12 { background: rgba(184,69,69,0.15); color: #D88787; border-color: rgba(184,69,69,0.4); }
.cffb-conf--pac   { background: rgba(92,122,106,0.18); color: #9CB8A8; border-color: rgba(92,122,106,0.45); }
.cffb-conf--aac   { background: rgba(107,92,139,0.18); color: #A799C0; border-color: rgba(107,92,139,0.45); }
.cffb-conf--mw    { background: rgba(139,111,31,0.18); color: #BFA058; border-color: rgba(139,111,31,0.45); }
.cffb-conf--ind   { background: var(--bg-surface-elev); color: var(--fg-secondary); border-color: var(--border); }

/* Grade pill */
.cffb-grade {
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700;
  letter-spacing: -0.02em; text-transform: uppercase;
  border-radius: var(--r-2);
  padding: 4px 10px 5px; color: var(--fg-primary);
  font-size: 20px;
}
.cffb-grade--sm { font-size: 14px; padding: 2px 6px 3px; }
.cffb-grade--lg { font-size: 36px; padding: 6px 16px 8px; line-height: 1; }
.cffb-grade--a  { background: var(--gold-gradient); color: #0A0A0A; box-shadow: 0 0 12px rgba(201,162,39,0.25); }
.cffb-grade--b  { background: var(--grade-a); color: var(--fg-primary); }
.cffb-grade--bp { background: var(--grade-b); color: var(--fg-primary); }
.cffb-grade--c  { background: var(--gold); color: #0A0A0A; }
.cffb-grade--d  { background: var(--grade-d); color: var(--fg-primary); }
.cffb-grade--f  { background: var(--grade-f); color: var(--fg-primary); }

/* Value delta */
.cffb-delta {
  display: inline-flex; align-items: center; gap: 3px;
  font-family: var(--font-body); font-weight: 600;
  font-variant-numeric: tabular-nums;
  font-size: var(--tx-sm);
}
.cffb-delta--pos  { color: var(--delta-pos); }
.cffb-delta--neg  { color: var(--delta-neg); }
.cffb-delta--flat { color: var(--delta-flat); }
.cffb-delta__arrow { font-size: 0.85em; line-height: 1; }


/* ============================================================
   12 · UTILITIES
   ============================================================ */

.cffb-row     { display: flex; gap: var(--s-2); align-items: center; }
.cffb-row--sb { justify-content: space-between; }
.cffb-row--end{ justify-content: flex-end; }
.cffb-stack   { display: flex; flex-direction: column; gap: var(--s-1); }
.cffb-stack--2 { gap: var(--s-2); }
.cffb-stack--3 { gap: var(--s-3); }

.cffb-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2); }
.cffb-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-2); }
.cffb-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s-2); }

.cffb-divider { height: 1px; background: var(--border); margin: var(--s-2) 0; }
.cffb-spacer  { flex: 1; }

.cffb-muted     { color: var(--fg-secondary); }
.cffb-tertiary  { color: var(--fg-tertiary); }
.cffb-gold      { color: var(--gold); }
.cffb-mono      { font-family: var(--font-mono); }

.cffb-mt-1 { margin-top: var(--s-1); }
.cffb-mt-2 { margin-top: var(--s-2); }
.cffb-mt-3 { margin-top: var(--s-3); }
.cffb-mb-2 { margin-bottom: var(--s-2); }

/* ============================================================
   CFFB · Player Ledger — layout styles.
   Tokens + atoms (cffb-rs / cffb-elig / cffb-award / cffb-pos /
   cffb-team / cffb-conf / cffb-stars) come from cffb.css.
   This file owns the ledger panel chrome only. Namespace: pl-.
   ============================================================ */


/* Redshirt shield: cffb.css sets height:auto, which resolves to the SVG's
   default 150px replaced-element height here. Pin explicit heights (viewBox
   20×22 → height = width × 1.1) so the chip sizes correctly inline. */
.cffb-rs__icon { height: 15px; }
.cffb-rs--xs .cffb-rs__icon { height: 11px; }
.cffb-rs--sm .cffb-rs__icon { height: 15px; }
.cffb-rs--md .cffb-rs__icon { height: 20px; }

/* ---------- STAGE / FRAME (auto-responsive via container queries) ---------- */
/* The frame is a CSS container; the @container pl (...) rules below adapt the
   layout to its own rendered width — no desktop/mobile toggle needed. */
.pl-stage { width: 100%; }
.pl-frame { width: 100%; container-type: inline-size; container-name: pl; background: var(--bg-canvas); }
.pl-stage--desktop .pl-frame { width: 100%; min-height: 100vh; }

.pl-stage--mobile {
  display: flex; justify-content: center;
  padding: 28px 16px 96px;
  min-height: 100vh; box-sizing: border-box;
  background-image: radial-gradient(circle at 50% 0%, #1b1b1b 0%, #0C0C0C 72%);
}
.pl-stage--mobile .pl-frame {
  width: 402px; height: 824px; flex-shrink: 0;
  overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
  border-radius: 28px; border: 8px solid #1A1A1A;
  box-shadow: 0 30px 90px rgba(0,0,0,0.7), inset 0 0 0 1px rgba(255,255,255,0.04);
}
.pl-stage--mobile .pl-frame::-webkit-scrollbar { width: 0; }

.pl-viewtoggle {
  position: fixed; left: 16px; bottom: 16px; z-index: 40;
  display: flex; gap: 2px; padding: 3px;
  background: rgba(20,20,20,0.92); border: 1px solid var(--border);
  border-radius: 8px; backdrop-filter: blur(8px);
}
.pl-viewtoggle__btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 11px; border: 0; border-radius: 6px;
  background: transparent; color: var(--fg-secondary);
  font: 600 11px/1 var(--font-body); letter-spacing: 0.04em; cursor: pointer;
}
.pl-viewtoggle__btn svg { width: 15px; height: 15px; }
.pl-viewtoggle__btn.is-on { background: var(--bg-surface-elev); color: var(--fg-primary); }

/* ---------- ROOT / PANEL ---------- */
.pl-root {
  max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px;
  color: var(--fg-primary); font-family: var(--font-body);
}
.pl-context {
  display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
  font: 600 11px/1 var(--font-body); letter-spacing: 0.12em; text-transform: uppercase;
}
.pl-context__crumb { color: var(--fg-tertiary); }
.pl-context__sep { color: var(--fg-tertiary); }
.pl-context__here { color: var(--gold); }

.pl-panel {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden;
}
.pl-panel__head {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
  padding: 24px 24px 20px; border-bottom: 1px solid var(--border);
  background: radial-gradient(120% 130% at 100% 0%, rgba(201,162,39,0.06), transparent 55%);
}
.pl-panel__h1 { font: 700 30px/1 var(--font-display); text-transform: uppercase; letter-spacing: -0.005em; margin: 0; }
.pl-panel__desc { color: var(--fg-secondary); font-size: 13px; margin: 8px 0 0; max-width: 46ch; }

/* ---------- SEARCH ---------- */
.pl-search { position: relative; width: 320px; flex-shrink: 0; }
.pl-search__field {
  display: flex; align-items: center; gap: 8px;
  height: 42px; padding: 0 10px 0 12px;
  background: var(--bg-surface-elev); border: 1px solid var(--border-strong);
  border-radius: 8px; transition: border-color var(--dur-fast);
}
.pl-search__field.is-open, .pl-search__field:focus-within { border-color: var(--gold); }
.pl-search__ic { color: var(--fg-secondary); font-size: 18px; line-height: 1; }
.pl-search__field input {
  flex: 1; min-width: 0; background: transparent; border: 0; outline: none;
  color: var(--fg-primary); font: 500 14px/1 var(--font-body);
}
.pl-search__field input::placeholder { color: var(--fg-tertiary); }
.pl-search__clear {
  border: 0; background: transparent; color: var(--fg-secondary);
  font-size: 18px; cursor: pointer; padding: 0 4px;
}
.pl-search__menu {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 30;
  background: var(--bg-surface-elev); border: 1px solid var(--border-strong);
  border-radius: 8px; box-shadow: var(--shadow-md); overflow: hidden; padding: 4px;
}
.pl-opt {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 9px 10px; border: 0; border-radius: 6px;
  background: transparent; cursor: pointer; text-align: left;
}
.pl-opt.is-hi { background: var(--bg-surface-hover); }
.pl-opt.is-cur { box-shadow: inset 2px 0 0 var(--gold); }
.pl-opt__shot {
  width: 34px; height: 34px; border-radius: 6px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-surface); border: 1px solid var(--border);
  border-left: 3px solid var(--accent, #5A5A5A);
  font: 700 12px/1 var(--font-display); color: var(--fg-primary);
}
.pl-opt__id { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.pl-opt__name { font: 600 14px/1 var(--font-body); color: var(--fg-primary); }
.pl-opt__meta { display: flex; align-items: center; gap: 8px; }
.pl-opt__sub { font-size: 11px; color: var(--fg-secondary); }
.pl-opt__roll { display: flex; gap: 14px; flex-shrink: 0; }
.pl-opt__roll-n { display: flex; flex-direction: column; align-items: center; }
.pl-opt__roll-n b { font: 700 15px/1 var(--font-display); color: var(--fg-primary); font-variant-numeric: tabular-nums; }
.pl-opt__roll-n span { font: 600 9px/1 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-tertiary); margin-top: 3px; }
.pl-opt-empty { padding: 16px; text-align: center; color: var(--fg-tertiary); font-size: 13px; }

/* ---------- PORTRAIT ---------- */
.pl-portrait {
  position: relative; flex-shrink: 0; overflow: hidden;
  background: var(--bg-surface-elev); border: 1px solid var(--border); border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}
/* Sized near MFL's native 80×107 thumbnail (≈1.25× vs 1.65×) so it stays sharp. */
.pl-portrait--lg { width: 100px; height: 134px; }
.pl-portrait--sm { width: 52px; height: 52px; border-radius: 7px; }
.pl-portrait__bar { position: absolute; top: 0; left: 0; right: 0; height: 4px; }
.pl-portrait__sil { width: 46px; height: 46px; color: #3A3A3A; }
.pl-portrait--sm .pl-portrait__sil { width: 26px; height: 26px; }
.pl-portrait__initials {
  position: absolute; bottom: 8px; right: 10px;
  font: 700 26px/1 var(--font-display); color: rgba(245,245,245,0.92);
  text-shadow: 0 2px 8px rgba(0,0,0,0.6);
}
.pl-portrait--sm .pl-portrait__initials { font-size: 15px; bottom: 4px; right: 6px; }
/* MFL headshot overlay — sits above the initials/silhouette placeholder; hidden
   by its own onError handler when MFL has no photo, so the placeholder shows. */
.pl-portrait__photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; background: var(--bg-surface-elev); }

/* ---------- HERO PROFILE ---------- */
.pl-hero {
  display: grid; grid-template-columns: auto 1fr 280px; gap: 28px;
  padding: 24px; position: relative; overflow: hidden;
  border-bottom: 1px solid var(--border);
}
.pl-hero::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(70% 120% at 0% 0%, color-mix(in oklab, var(--accent) 16%, transparent), transparent 52%);
}
.pl-hero > * { position: relative; z-index: 1; }
.pl-hero__id { min-width: 0; display: flex; flex-direction: column; gap: 9px; align-self: center; }
.pl-hero__tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pl-hero__college { font-size: 12px; color: var(--fg-secondary); }
.pl-hero__offered { font: 600 10px/1 var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-tertiary); padding: 4px 8px; border: 1px solid var(--border); border-radius: 2px; }
.pl-hero__namerow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pl-hero__name { font-family: var(--font-display); font-weight: 700; font-size: 46px; line-height: 1.04; text-transform: uppercase; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.pl-hero__meta { color: var(--fg-secondary); font-size: 13px; }
.pl-hero__stars { display: flex; align-items: center; gap: 12px; }
.pl-hero__composite { font-size: 12px; color: var(--fg-secondary); font-variant-numeric: tabular-nums; }

.pl-hero__rail {
  display: flex; flex-direction: column; gap: 16px; justify-content: center;
  padding-left: 24px; border-left: 1px solid var(--border);
}
.pl-hero__stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }

/* ---------- STATS ---------- */
.pl-stat { display: flex; flex-direction: column; gap: 3px; }
.pl-stat__label { font: 600 10px/1 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-tertiary); }
.pl-stat__val { font: 600 18px/1 var(--font-display); color: var(--fg-primary); font-variant-numeric: tabular-nums; }
.pl-stat__val.is-hero { font-size: 30px; color: var(--gold-light); }

/* ---------- COPIES METER ---------- */
.pl-meter { display: flex; flex-direction: column; gap: 8px; }
.pl-meter__head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.pl-meter__title { font: 600 11px/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-secondary); }
.pl-meter__count { font-size: 11px; color: var(--fg-tertiary); }
.pl-meter__count b { color: var(--fg-primary); font-variant-numeric: tabular-nums; }
.pl-meter__bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--bg-surface); border: 1px solid var(--border); }
.pl-meter__seg { display: block; height: 100%; }
.pl-meter__seg.is-rostered { background: #2D7A4E; }
.pl-meter__seg.is-redshirting { background: var(--gold); }
.pl-meter__seg.is-graduated { background: #8B6F1F; }
.pl-meter__seg.is-declared { background: #B8902F; }
.pl-meter__seg.is-fa { background: #3A3A3A; }
.pl-meter__legend { display: flex; gap: 14px; }
.pl-meter__legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; color: var(--fg-tertiary); }
.pl-meter__legend i { width: 8px; height: 8px; border-radius: 2px; }
.pl-meter__legend i.is-rostered { background: #2D7A4E; }
.pl-meter__legend i.is-redshirting { background: var(--gold); }
.pl-meter__legend i.is-graduated { background: #8B6F1F; }
.pl-meter__legend i.is-declared { background: #B8902F; }
.pl-meter__legend i.is-fa { background: #3A3A3A; }

/* ---------- ELIGIBILITY STRIP (hero) ---------- */
.pl-elig { padding: 18px 24px 22px; border-bottom: 1px solid var(--border); }
.pl-elig__head { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
.pl-elig__title { font: 600 11px/1 var(--font-body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-secondary); }
.pl-eligstrip { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.pl-eligyr {
  position: relative; padding: 0 8px; text-align: center;
}
.pl-eligyr__season { font: 700 12px/1 var(--font-display); color: var(--fg-tertiary); font-variant-numeric: tabular-nums; }
.pl-eligyr__rail { position: relative; height: 22px; display: flex; align-items: center; justify-content: center; }
.pl-eligyr__rail::before {
  content: ""; position: absolute; top: 50%; left: -50%; right: 50%; height: 2px;
  background: var(--border); transform: translateY(-50%);
}
.pl-eligyr:first-child .pl-eligyr__rail::before { display: none; }
.pl-eligyr__dot {
  position: relative; z-index: 1; width: 13px; height: 13px; border-radius: 50%;
  background: var(--bg-surface-elev); border: 2px solid var(--border-strong);
}
.pl-eligyr__dot.is-used { background: var(--gold); border-color: var(--gold); }
.pl-eligyr__dot.is-rs { background: radial-gradient(circle, transparent 0 3px, var(--gold) 3px 100%); border-color: var(--gold); }
.pl-eligyr__dot.is-rs-med { background: radial-gradient(circle, transparent 0 3px, var(--rs-medical) 3px 100%); border-color: var(--rs-medical); }
.pl-eligyr__dot.is-current { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent) 24%, transparent); }
.pl-eligyr__dot.is-pre { background: var(--bg-surface-elev); border-style: dashed; }
.pl-eligyr__lbl { font: 600 12px/1.2 var(--font-body); color: var(--fg-primary); margin-top: 8px; }
.pl-eligyr__sub { font-size: 11px; color: var(--fg-tertiary); margin-top: 3px; }
.pl-eligyr--current .pl-eligyr__lbl { color: var(--gold-light); }

/* ---------- COMPACT PROFILE ---------- */
.pl-compact {
  display: flex; align-items: center; gap: 16px; padding: 18px 24px;
  border-bottom: 1px solid var(--border); position: relative; overflow: hidden;
}
.pl-compact::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent);
}
.pl-compact__id { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.pl-compact__namerow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pl-compact__name { font: 700 22px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.005em; }
.pl-compact__college { font-size: 12px; color: var(--fg-secondary); }
.pl-compact__sub { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.pl-compact__roll { display: flex; gap: 22px; flex-shrink: 0; padding-left: 20px; border-left: 1px solid var(--border); }

/* ---------- OWNER / STATUS / MONEY / TAGS ---------- */
.pl-owner { display: inline-flex; align-items: center; gap: 9px; min-width: 0; }
.pl-owner--stacked { flex-direction: column; align-items: flex-start; gap: 7px; }
.pl-owner__id { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.pl-owner__team { font: 600 13px/1.1 var(--font-body); color: var(--fg-primary); white-space: nowrap; }
.pl-owner__handle { font: 500 11px/1 var(--font-mono); color: var(--fg-secondary); }
.pl-owner--fa .pl-owner__fa {
  font: 600 12px/1 var(--font-body); letter-spacing: 0.04em; color: var(--fg-tertiary);
  padding: 5px 10px; border: 1px dashed var(--border-strong); border-radius: 4px;
}
.pl-tlitem__retired { font: 600 12px/1 var(--font-body); color: var(--fg-tertiary); letter-spacing: 0.02em; }

.pl-status { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.pl-status__dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.pl-status__label { font: 600 11px/1 var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-secondary); }
.pl-status--sm .pl-status__label { font-size: 10px; }
.pl-status--rostered .pl-status__label { color: #5FB07E; }
.pl-status--redshirting .pl-status__label { color: var(--gold); }
.pl-status--graduated .pl-status__label { color: #C9A227; }
.pl-status--graduated .pl-status__dot { box-shadow: 0 0 0 2px rgba(139,111,31,0.35); }
.pl-status--declared .pl-status__label { color: #D8B25A; }
.pl-status--declared .pl-status__dot { box-shadow: 0 0 0 2px rgba(184,144,47,0.35); }

.pl-money { font: 700 16px/1 var(--font-display); color: var(--fg-primary); }
.pl-money--hero { font-size: 22px; color: var(--gold-light); }

.pl-tag {
  font: 700 9.5px/1 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase;
  padding: 4px 7px; border-radius: 3px; white-space: nowrap;
}
.pl-tag--won { color: #0A0A0A; background: var(--gold); }
.pl-tag--rs { color: var(--gold); background: rgba(201,162,39,0.12); border: 1px solid rgba(201,162,39,0.4); }
.pl-tag--rs-med { color: var(--rs-medical); background: rgba(209,117,117,0.1); border: 1px solid rgba(209,117,117,0.4); }
.pl-tag--award { color: #0A0A0A; background: var(--gold-gradient); }
.pl-tag--graduate { color: var(--gold-light); background: rgba(139,111,31,0.18); border: 1px solid rgba(139,111,31,0.55); }
.pl-tag--drop { color: #D88787; background: rgba(184,69,69,0.12); border: 1px solid rgba(184,69,69,0.4); }
.pl-tag--retain { color: #5FB07E; background: rgba(45,122,78,0.12); border: 1px solid rgba(45,122,78,0.45); }
.pl-tag--release { color: #D88787; background: rgba(184,69,69,0.1); border: 1px solid rgba(184,69,69,0.4); }
.pl-tag--declare { color: var(--gold-light); background: rgba(184,144,47,0.16); border: 1px solid rgba(184,144,47,0.5); }

/* Honors star — copy earned a player award while held */
.pl-honors {
  display: inline-flex; align-items: center; gap: 1px; margin-left: 6px;
  font: 700 11px/1 var(--font-body); color: var(--gold-light); vertical-align: middle;
  font-variant-numeric: tabular-nums;
  filter: drop-shadow(0 0 5px rgba(201,162,39,0.35));
}

/* ---------- LEDGER SECTION ---------- */
.pl-ledger { padding: 20px 24px 24px; }
.pl-ledger__head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
.pl-ledger__title { font: 600 13px/1 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-primary); }
.pl-ledger__hint { font-size: 11px; color: var(--fg-tertiary); }

/* ---------- CONFERENCE GROUPING ---------- */
.pl-conf { display: inline-flex; align-items: center; gap: 8px; }
.pl-conf__logo { object-fit: contain; flex-shrink: 0; }
.pl-conf__name { font: 700 14px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.03em; color: var(--fg-primary); }

.pl-rows, .pl-cards-wrap { display: flex; flex-direction: column; gap: 20px; }
.pl-confgroup { display: flex; flex-direction: column; gap: 8px; }
.pl-confgroup__head {
  display: flex; align-items: center; gap: 12px; position: relative;
  padding: 4px 0 8px 12px; border-bottom: 1px solid var(--border);
}
.pl-confgroup__edge {
  position: absolute; left: 0; top: 4px; bottom: 9px; width: 3px; border-radius: 2px;
  background: var(--accent);
}
.pl-confgroup__count {
  font: 600 10px/1 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-tertiary);
}
.pl-confroll { display: inline-flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.pl-confroll__chip {
  font: 600 10px/1 var(--font-body); letter-spacing: 0.04em; text-transform: uppercase;
  padding: 4px 8px; border-radius: 2px; border: 1px solid var(--border-strong); color: var(--fg-secondary);
  white-space: nowrap;
}
.pl-confroll__chip.is-active { color: #5FB07E; border-color: rgba(45,122,78,0.4); }
.pl-confroll__chip.is-retired { color: var(--gold); border-color: rgba(201,162,39,0.4); }
.pl-confroll__chip.is-fa { color: var(--fg-tertiary); }
.pl-confgroup__body { display: flex; flex-direction: column; gap: 8px; }
.pl-confgroup .pl-cards { margin-top: 4px; }

.pl-lanegroup { margin-top: 14px; }
.pl-lanegroup:first-of-type { margin-top: 2px; }
.pl-lanegroup__head { display: flex; align-items: center; gap: 12px; padding: 6px 0 4px 4px; }
.pl-lanegroup__head .pl-confroll { margin-left: auto; }

/* ---------- ROWS LAYOUT ---------- */
.pl-rows { display: flex; flex-direction: column; gap: 8px; }
.pl-row { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--bg-surface); }
.pl-row.is-open { border-color: var(--border-strong); }
.pl-row__head {
  display: grid; grid-template-columns: 78px 104px minmax(0,1fr) auto 116px 18px;
  align-items: center; gap: 16px; width: 100%;
  padding: 14px 16px; border: 0; background: transparent; cursor: pointer; text-align: left;
  position: relative;
}
.pl-row__head::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
  background: var(--accent); transform: scaleY(0); transform-origin: center;
  transition: transform var(--dur-fast);
}
.pl-row__head:hover { background: var(--bg-surface-hover); }
.pl-row__head:hover::before, .pl-row.is-open .pl-row__head::before { transform: scaleY(1); }
.pl-row__n { font: 700 14px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.04em; color: var(--fg-primary); }
.pl-row__acq { display: flex; align-items: baseline; gap: 8px; }
.pl-row__since { font-size: 11px; color: var(--fg-tertiary); font-variant-numeric: tabular-nums; }
.pl-row__dash { color: var(--fg-tertiary); font-size: 12px; }
.pl-row__moves { font-size: 11px; color: var(--fg-secondary); text-align: right; font-variant-numeric: tabular-nums; }
.pl-row__chev { color: var(--fg-tertiary); font-size: 12px; text-align: center; }

/* ---------- PER-COPY ELIGIBILITY (inline) ---------- */
.pl-celig { display: inline-flex; align-items: center; gap: 7px; vertical-align: middle; }
.pl-celig .cffb-elig__class { font-size: 11px; padding: 1px 5px; }
.pl-row__elig { justify-self: start; }
.pl-card__elig { display: inline-flex; }
.pl-lane__elig { display: inline-flex; }
.pl-detail__elig { display: inline-flex; }

/* ---------- CARDS LAYOUT ---------- */
.pl-cards-wrap { display: flex; flex-direction: column; gap: 12px; }
.pl-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(208px, 1fr)); gap: 10px; }
.pl-card {
  display: flex; flex-direction: column; gap: 14px; text-align: left;
  padding: 14px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg-surface); cursor: pointer; position: relative;
  transition: border-color var(--dur-fast), background var(--dur-fast);
}
.pl-card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 3px 0 0 3px;
  background: var(--accent); opacity: 0; transition: opacity var(--dur-fast);
}
.pl-card:hover { background: var(--bg-surface-hover); }
.pl-card.is-active { border-color: var(--accent); }
.pl-card.is-active::before { opacity: 1; }
.pl-card--fa { background: repeating-linear-gradient(135deg, var(--bg-surface) 0 7px, #121212 7px 14px); }
.pl-card--graduated { background: repeating-linear-gradient(135deg, var(--bg-surface) 0 7px, #19150c 7px 14px); }
.pl-card--declared { background: repeating-linear-gradient(135deg, var(--bg-surface) 0 7px, #1c1709 7px 14px); }
.pl-card__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pl-card__n { font: 700 13px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.04em; color: var(--fg-secondary); }
.pl-card__owner { min-height: 48px; display: flex; align-items: center; }
.pl-card__foot { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pl-card__since { font-size: 11px; color: var(--fg-tertiary); font-variant-numeric: tabular-nums; }
.pl-card__dash { color: var(--fg-tertiary); font-size: 12px; }
.pl-card__moves { margin-left: auto; font-size: 10px; color: var(--fg-tertiary); font-variant-numeric: tabular-nums; }

/* ---------- TIMELINE / SWIMLANE LAYOUT ---------- */
.pl-timeline { --lane-label: 220px; display: flex; flex-direction: column; gap: 0; }
.pl-axis { display: grid; align-items: end; margin-bottom: 6px; }
.pl-axis__years { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.pl-axis__yr { text-align: center; font: 700 11px/1 var(--font-display); color: var(--fg-tertiary); font-variant-numeric: tabular-nums; }
.pl-axis__yr.is-now { color: var(--gold); }
.pl-lanes { display: flex; flex-direction: column; }
.pl-lane {
  display: grid; grid-template-columns: var(--lane-label) 1fr; align-items: center; gap: 0;
  border-top: 1px solid var(--border); position: relative;
}
.pl-lane:last-child { border-bottom: 1px solid var(--border); }
.pl-lane.is-active { background: var(--bg-surface-hover); }
.pl-lane__head {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 14px 16px 14px 8px; border: 0; background: transparent; cursor: pointer; text-align: left;
}
.pl-lane__head:hover { color: var(--fg-primary); }
.pl-lane__n { font: 700 13px/1 var(--font-display); text-transform: uppercase; color: var(--fg-primary); flex-shrink: 0; }
.pl-lane__owner { margin-left: auto; }
.pl-lane__track { position: relative; height: 56px; }
.pl-lane__grid { position: absolute; inset: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.pl-lane__col { border-left: 1px dashed var(--border); }
.pl-lane__col:first-child { border-left: 0; }
.pl-lane__bar {
  position: absolute; top: 50%; transform: translateY(-50%); height: 12px;
  border-radius: 3px; opacity: 0.82; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
}
.pl-lane__bar.is-held { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16), 0 0 12px rgba(0,0,0,0.3); opacity: 1; }
.pl-node {
  position: absolute; top: 50%; transform: translate(-50%, -50%); z-index: 2;
  width: 18px; height: 18px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-canvas); border: 2px solid var(--c);
}
.pl-node__dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.pl-node--won .pl-node__dot { width: 8px; height: 8px; }
.pl-node--drop { background: var(--bg-canvas); }
.pl-node--drop .pl-node__dot { width: 8px; height: 2px; border-radius: 1px; }
.pl-node--award { width: 20px; height: 20px; border-color: var(--gold-light); background: var(--bg-canvas); box-shadow: 0 0 8px rgba(201,162,39,0.4); }
.pl-node__star { font: 10px/1 var(--font-body); color: var(--gold-light); }
.pl-node--graduate { border-color: #8B6F1F; background: var(--bg-canvas); }
.pl-node__cap { width: 9px; height: 9px; background: #8B6F1F; transform: rotate(45deg); border-radius: 1px; }

/* ---------- DETAIL PANEL (cards + timeline) ---------- */
.pl-detail { border: 1px solid var(--accent); border-radius: 8px; overflow: hidden; margin-top: 12px; }
.pl-detail__head {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  background: var(--bg-surface-elev);
}
.pl-detail__copy { font: 700 14px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.04em; }
.pl-detail__owner { margin-left: auto; }
.pl-detail__close { border: 0; background: transparent; color: var(--fg-secondary); font-size: 20px; cursor: pointer; line-height: 1; }

/* ---------- TRANSACTION TIMELINE (vertical) ---------- */
.pl-tl { padding: 16px 18px 18px; background: var(--bg-surface-elev); border-top: 1px solid var(--border); }
.pl-detail .pl-tl { border-top: 0; }
.pl-tl__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.pl-tl__title { font: 600 11px/1 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-secondary); }
.pl-tl__sub { font-size: 11px; color: var(--fg-tertiary); }
.pl-tl__list { list-style: none; margin: 0; padding: 0; }
.pl-tlitem { display: grid; grid-template-columns: 18px 1fr; gap: 12px; }
.pl-tlitem__rail { position: relative; display: flex; justify-content: center; }
.pl-tlitem__rail::before {
  content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--border);
}
.pl-tlitem:first-child .pl-tlitem__rail::before { top: 9px; }
.pl-tlitem.is-last .pl-tlitem__rail::before { bottom: calc(100% - 9px); }
.pl-tlitem__dot {
  position: relative; z-index: 1; margin-top: 3px;
  width: 11px; height: 11px; border-radius: 50%; border: 2px solid; background: var(--bg-surface-elev);
}
.pl-tlitem__body { padding-bottom: 16px; }
.pl-tlitem:last-child .pl-tlitem__body { padding-bottom: 0; }
.pl-tlitem__main { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.pl-tlitem__season { font: 700 14px/1 var(--font-display); color: var(--fg-secondary); font-variant-numeric: tabular-nums; min-width: 34px; }
.pl-tlitem__owner { flex: 1; min-width: 140px; }
.pl-tlitem__detail { display: flex; align-items: center; gap: 8px; }
.pl-tlitem__note { margin-top: 6px; font-size: 12px; line-height: 1.5; color: var(--fg-secondary); max-width: 72ch; }

/* ============================================================ DENSITY ============ */
.pl--compact .pl-tlitem__body { padding-bottom: 11px; }
.pl--compact .pl-row__head { padding: 11px 16px; }
.pl--compact .pl-ledger, .pl--compact .pl-tl { padding-top: 14px; }
.pl--compact .pl-tlitem__note { display: none; }

/* ============================================================ CONTAINER QUERIES === */
/* Tighten when the frame (not the window) gets narrow — works for mobile device too. */
@container pl (max-width: 880px) {
  .pl-hero { grid-template-columns: auto 1fr; }
  .pl-hero__rail { grid-column: 1 / -1; padding-left: 0; border-left: 0; border-top: 1px solid var(--border); padding-top: 16px; }
  .pl-hero__stats { grid-template-columns: repeat(4, 1fr); }
}
@container pl (max-width: 640px) {
  .pl-root { padding: 20px 14px 72px; }
  .pl-panel__head { flex-direction: column; align-items: stretch; gap: 16px; }
  .pl-search { width: 100%; }
  .pl-hero { grid-template-columns: auto 1fr; gap: 14px 16px; padding: 18px; align-items: center; }
  .pl-portrait--lg { width: 78px; height: 98px; }
  .pl-hero__id { align-self: center; gap: 7px; }
  .pl-hero__name { font-size: 30px; line-height: 1.02; }
  .pl-hero__stats { grid-template-columns: repeat(4, 1fr); }
  .pl-eligstrip { grid-auto-flow: row; grid-auto-columns: auto; gap: 0; }
  .pl-eligyr {
    display: grid; grid-template-columns: 44px 22px 1fr; align-items: center;
    text-align: left; gap: 12px; padding: 7px 0; column-gap: 12px;
  }
  .pl-eligyr__rail { height: 100%; }
  .pl-eligyr__rail::before { left: 50%; right: auto; top: -50%; bottom: 50%; width: 2px; height: auto; transform: none; }
  .pl-eligyr__lbl { grid-row: 1; grid-column: 3; margin: 0; }
  .pl-eligyr__sub { grid-row: 2; grid-column: 3; margin: 0; }
  .pl-eligyr__season { grid-row: 1 / span 2; grid-column: 1; align-self: center; }
