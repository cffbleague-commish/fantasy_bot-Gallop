<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Scenario Builder · Mobile Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700&amp;family=Inter:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#050505;color:#F5F5F5;font-family:Inter,sans-serif;padding:32px 24px}
a{color:#E8C547}a:hover{color:#F4D66A}
.wrap{display:flex;flex-wrap:wrap;gap:40px;justify-content:center;align-items:flex-start}
.dev{display:flex;flex-direction:column;align-items:center;gap:12px}
.lab{font-size:11px;font-weight:700;letter-spacing:.14em;color:#9A9A9A;text-transform:uppercase}
.lab b{color:#F5F5F5}
.phone{background:#1A1A1A;border:1px solid #2A2A2A;border-radius:44px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.screen{border-radius:32px;overflow:hidden;background:#0A0A0A;position:relative}
.notch{position:absolute;top:10px;left:50%;width:110px;height:30px;margin-left:-55px;background:#000;border-radius:20px;z-index:2}
iframe{display:block;border:0;background:#0A0A0A}
.bar{display:flex;gap:8px;justify-content:center;margin-bottom:28px}
button{background:#1C1C1C;border:1px solid #2A2A2A;border-radius:4px;color:#F5F5F5;padding:8px 14px;font:600 12px Inter,sans-serif;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
button:hover{filter:brightness(1.12)}
h1{margin:0 0 6px;font:700 32px 'Saira Condensed',sans-serif;text-transform:uppercase;text-align:center}
p{margin:0 0 20px;text-align:center;color:#9A9A9A;font-size:13px}
</style></head><body>
<h1>Scenario Builder Message · Device Preview</h1>
<p>Live copies of the message at a 393px phone width, each in a different state. Everything is tappable; scroll inside each screen.</p>
<div class="bar"><button onclick="reset()">Reset states</button></div>
<div class="wrap">
<div class="dev"><div class="lab"><b>Collapsed</b> · home page</div><div class="phone"><div class="screen"><div class="notch"></div><iframe data-state="closed" src="Scenario Builder MFL Message.html" width="393" height="760"></iframe></div></div></div>
<div class="dev"><div class="lab"><b>Bowls</b></div><div class="phone"><div class="screen"><div class="notch"></div><iframe data-state="bowls" src="Scenario Builder MFL Message.html" width="393" height="760"></iframe></div></div></div>
<div class="dev"><div class="lab"><b>Races</b> · pathways</div><div class="phone"><div class="screen"><div class="notch"></div><iframe data-state="races" src="Scenario Builder MFL Message.html" width="393" height="760"></iframe></div></div></div>
<div class="dev"><div class="lab"><b>Playoff</b> · bracket</div><div class="phone"><div class="screen"><div class="notch"></div><iframe data-state="playoff" src="Scenario Builder MFL Message.html" width="393" height="760"></iframe></div></div></div>
<div class="dev"><div class="lab"><b>Team sheet</b></div><div class="phone"><div class="screen"><div class="notch"></div><iframe data-state="team" src="Scenario Builder MFL Message.html" width="393" height="760"></iframe></div></div></div>
</div>
<script>
function apply(f){
  try{
    var d=f.contentDocument, r=d.getElementById('cffb-sb'); if(!r) return;
    d.body.style.padding='56px 12px 24px';
    var s=f.getAttribute('data-state');
    if(s==='closed') return;
    r.querySelector('.sb-bar').click();
    var tab=function(v){ var b=r.querySelector('.sb-tab[data-v="'+v+'"]'); if(b) b.click(); };
    if(s==='bowls'){ tab('bowls'); return; }
    if(s==='races'){ tab('races'); return; }
    if(s==='playoff'){ tab('playoff'); return; }
    if(s==='team'){ tab('races'); var t=r.querySelector('tr[data-act="team"]:nth-child(3)'); if(t) t.click(); }
  }catch(e){}
}
function frames(){ return Array.from(document.querySelectorAll('iframe')); }
frames().forEach(function(f){ f.addEventListener('load',function(){ setTimeout(function(){ apply(f); },400); }); });
function reset(){ frames().forEach(function(f){ f.src=f.src; }); }
</script>
</body></html>
