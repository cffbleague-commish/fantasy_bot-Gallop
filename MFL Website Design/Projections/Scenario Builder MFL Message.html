<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CFFB Scenario Builder</title><style>body{margin:0;background:#0A0A0A;padding:24px 16px;font-family:Inter,system-ui,sans-serif}</style></head><body>
<!-- ===== START MFL MESSAGE ===== (paste START→END into MFL Home Page Message; swap image paths for hosted https URLs) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800;900&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
#cffb-sb{--gold:#C9A227;--gold-l:#E8C547;--gold-d:#8B6F1F;--bg:#0A0A0A;--s1:#141414;--s2:#1C1C1C;--sh:#1F1F1F;--bd:#2A2A2A;--bd2:#3A3A3A;--fg:#F5F5F5;--fg2:#9A9A9A;--fg3:#5A5A5A;--up:#4FA572;--dn:#D06060;--ap:#7BA4C9;max-width:1080px;margin:16px auto 0;container-type:inline-size;container-name:sb;font-family:Inter,system-ui,sans-serif;color:var(--fg);box-sizing:border-box;position:relative;font-variant-numeric:tabular-nums}
#cffb-sb *{box-sizing:border-box}
#cffb-sb a{color:var(--gold-l)}#cffb-sb a:hover{color:#F4D66A}
#cffb-sb button{font-family:inherit;color:inherit}
#cffb-sb .D{font-family:'Saira Condensed',sans-serif;text-transform:uppercase}
/* bar */
#cffb-sb .sb-bar{position:relative;display:flex;align-items:stretch;min-height:88px;background:var(--s1);border:1px solid var(--bd);border-radius:8px;cursor:pointer;user-select:none;overflow:hidden}
#cffb-sb .sb-chev{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(201,162,39,.07) 22px 30px);-webkit-mask:linear-gradient(90deg,transparent 10%,#000 60%,transparent 100%);mask:linear-gradient(90deg,transparent 10%,#000 60%,transparent 100%)}
#cffb-sb .sb-wk{position:relative;flex:none;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 28px 0 22px;background:var(--gold);color:#0A0A0A;clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%)}
#cffb-sb .sb-wk small{font:800 10px/1 Inter,sans-serif;letter-spacing:.2em}
#cffb-sb .sb-wk b{font:900 40px/.85 'Saira Condensed',sans-serif;margin-top:4px;white-space:nowrap}
#cffb-sb .sb-ic{position:relative;flex:none;width:46px;height:46px;margin:4px 0 1px}
#cffb-sb .sb-ic svg{display:block;width:100%;height:100%;overflow:visible}
#cffb-sb .sb-ic .br{fill:none;stroke:rgba(10,10,10,.28);stroke-width:2;stroke-linecap:round}
#cffb-sb .sb-ic .hl{fill:none;stroke:#0A0A0A;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:40;stroke-dashoffset:40;animation:sbDraw 4.5s cubic-bezier(.2,.8,.2,1) infinite}
#cffb-sb .sb-ic .nd{fill:rgba(10,10,10,.2);stroke:rgba(10,10,10,.45);stroke-width:1.5}
#cffb-sb .sb-ic .nd.on{fill:#0A0A0A;stroke:#0A0A0A;opacity:0;animation:sbNode 4.5s ease-out infinite}
#cffb-sb .sb-ic .rt{fill:#0A0A0A}
#cffb-sb .sb-ic .rp{fill:none;stroke:#0A0A0A;stroke-width:1.2;transform-origin:8px 24px;animation:sbRing 1.5s ease-out infinite}
#cffb-sb .sb-ic .d2{animation-delay:1.5s}#cffb-sb .sb-ic .d3{animation-delay:3s}
@keyframes sbDraw{0%{stroke-dashoffset:40;opacity:1}22%{stroke-dashoffset:0;opacity:1}30%{opacity:1}33%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes sbNode{0%,18%{opacity:0;transform:scale(.4)}24%{opacity:1;transform:scale(1.25)}28%{transform:scale(1)}31%{opacity:1}34%,100%{opacity:0}}
@keyframes sbRing{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
#cffb-sb .sb-wk em{font:800 8.5px/1 Inter,sans-serif;font-style:normal;letter-spacing:.14em;margin-top:5px;opacity:.75;white-space:nowrap}
#cffb-sb .sb-hd .sb-wkn{font-size:11px;font-weight:600;color:var(--fg2);margin-top:4px;letter-spacing:0}
#cffb-sb .sb-tease{position:relative;flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:12px 16px}
#cffb-sb .sb-eb{font:800 15px/1 'Saira Condensed',sans-serif;letter-spacing:.12em;color:var(--gold-l)}
#cffb-sb .sb-mus{display:flex;flex-wrap:wrap;gap:6px 16px}
#cffb-sb .sb-mu{display:flex;align-items:center;gap:5px}
#cffb-sb .sb-mu i{font:700 9px/1 Inter,sans-serif;font-style:normal;letter-spacing:.1em;color:var(--fg3);width:30px}
#cffb-sb .sb-mu em{font:700 10px/1 'Saira Condensed',sans-serif;font-style:normal;color:var(--fg3)}
#cffb-sb .sb-tease-s{font-size:12px;color:var(--fg2)}
#cffb-sb .sb-tog{position:relative;flex:none;align-self:center;margin-right:16px;display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--bd);border-radius:4px;padding:10px 14px;font:700 12px Inter,sans-serif;letter-spacing:.12em;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
#cffb-sb .sb-bar:hover .sb-tog{filter:brightness(1.12)}
#cffb-sb .sb-tog svg{transition:transform .24s cubic-bezier(.2,.8,.2,1)}
#cffb-sb.is-open .sb-tog svg{transform:rotate(180deg)}
#cffb-sb.is-open .sb-bar{border-radius:8px 8px 0 0}
/* panel */
#cffb-sb .sb-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .42s cubic-bezier(.2,.8,.2,1)}
#cffb-sb.is-open .sb-panel{grid-template-rows:1fr}
#cffb-sb .sb-panel>div{overflow:hidden;min-height:0}
#cffb-sb .sb-body{background:var(--bg);border:1px solid var(--bd);border-top:0;border-radius:0 0 8px 8px}
#cffb-sb .sb-tabs{display:flex;border-bottom:1px solid var(--bd);padding:0 8px;overflow-x:auto;scrollbar-width:none}
#cffb-sb .sb-tab{position:relative;background:none;border:0;color:var(--fg2);padding:14px 11px 12px;font:800 15px/1 'Saira Condensed',sans-serif;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
#cffb-sb .sb-tab:hover,#cffb-sb .sb-tab.on{color:var(--fg)}
#cffb-sb .sb-tab.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:2px;background:var(--gold)}
#cffb-sb .sb-tab i{font:700 9px/1 Inter,sans-serif;font-style:normal;padding:3px 5px;border-radius:2px;background:var(--s2);color:var(--fg2)}
#cffb-sb .sb-tab.on i{background:var(--gold);color:#0A0A0A}
#cffb-sb .sb-view{padding:14px}
#cffb-sb .sb-sub{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#cffb-sb .sb-chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
#cffb-sb .sb-chip{display:flex;align-items:center;gap:5px;flex:none;padding:7px 10px;border-radius:4px;background:transparent;border:1px solid var(--bd);color:var(--fg2);cursor:pointer;font:700 13px/1 'Saira Condensed',sans-serif;text-transform:uppercase;letter-spacing:.04em;min-height:34px}
#cffb-sb .sb-chip img{width:15px;height:15px;object-fit:contain;filter:grayscale(1) opacity(.6)}
#cffb-sb .sb-chip.on{background:var(--s2);border-color:var(--bd2);color:var(--fg)}
#cffb-sb .sb-chip.on img{filter:none}
#cffb-sb .sb-chip small{font:700 9px Inter,sans-serif;color:var(--fg3)}
#cffb-sb .sb-chip.on small{color:var(--gold)}
#cffb-sb .sb-seg{display:flex;background:var(--s1);border:1px solid var(--bd);border-radius:4px;padding:2px;gap:2px}
#cffb-sb .sb-seg button{background:none;border:1px solid transparent;border-radius:3px;padding:5px 8px;font:700 11px/1 'Saira Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2);cursor:pointer}
#cffb-sb .sb-seg button.on{background:var(--s2);border-color:var(--bd2);color:var(--fg)}
#cffb-sb .sb-lbl{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3)}
#cffb-sb .sb-note{font-size:11px;color:var(--fg3);line-height:1.4;margin:10px 0 0;text-wrap:pretty}
/* pill */
#cffb-sb .sb-p{display:inline-flex;flex:none;border-radius:4px;overflow:hidden;vertical-align:middle;line-height:0;transition:opacity .12s,filter .12s}
#cffb-sb .sb-p>img{height:100%;width:100%;display:block}
#cffb-sb .sb-p--fb{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
#cffb-sb .sb-p--fb i{display:flex;align-items:center;justify-content:center;flex:none;height:100%}
#cffb-sb .sb-p--fb i img{width:68%;height:68%;object-fit:contain;filter:brightness(0) invert(1);opacity:.92}
#cffb-sb .sb-p--fb b{flex:1;display:flex;align-items:center;justify-content:center;font-family:'Saira Condensed',sans-serif;font-weight:700;letter-spacing:.02em;line-height:1}
#cffb-sb .sb-p.dim{opacity:.28;filter:grayscale(.85)}
#cffb-sb .sb-pk{position:relative;background:none;border:0;padding:4px;margin:-4px;cursor:pointer;line-height:0;border-radius:6px;min-height:44px;display:flex;align-items:center}
#cffb-sb .sb-pk:hover .sb-p{filter:brightness(1.12)}
#cffb-sb .sb-pk:hover .sb-p.dim{opacity:.6}
#cffb-sb .sb-pk.on .sb-p{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--gold)}
#cffb-sb .sb-pk.on::after{content:"W";position:absolute;top:2px;right:0;width:15px;height:15px;border-radius:50%;background:var(--gold);color:#0A0A0A;font:700 9px/15px Inter,sans-serif;text-align:center;box-shadow:0 0 0 2px var(--bg)}
#cffb-sb .sb-tm{background:none;border:0;padding:0;cursor:pointer;line-height:0}
/* game */
#cffb-sb .sb-games{display:grid;gap:8px}
#cffb-sb .sb-g{background:var(--s1);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
#cffb-sb .sb-g.pk{border-color:rgba(201,162,39,.35)}
#cffb-sb .sb-g.hot{box-shadow:inset 3px 0 0 var(--gold)}
#cffb-sb .sb-g__row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 12px}
#cffb-sb .sb-g__mid{display:flex;flex-direction:column;gap:4px;min-width:0}
#cffb-sb .sb-g__nums{display:flex;justify-content:space-between;font:700 12px/1 'Saira Condensed',sans-serif;color:var(--fg3)}
#cffb-sb .sb-g__nums .f{color:var(--fg)}
#cffb-sb .sb-pb{display:flex;height:4px;gap:2px;border-radius:999px;overflow:hidden;background:#0d0d0d}
#cffb-sb .sb-pb span{display:block;height:100%}
#cffb-sb .sb-g__meta{display:flex;justify-content:center;gap:6px;font-size:8.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);white-space:nowrap}
#cffb-sb .sb-g__meta .hot{color:var(--gold)}
#cffb-sb .sb-st{display:inline-flex;gap:2px;align-items:center;margin-left:3px}
#cffb-sb .sb-st i{width:4px;height:7px;border-radius:1px;background:#2a2a2a}
#cffb-sb .sb-st i.on{background:var(--gold)}
#cffb-sb .sb-g__ft{display:flex;border-top:1px solid #1d1d1d}
#cffb-sb .sb-g__ft button{flex:1;background:none;border:0;padding:9px 12px;font:700 10px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--fg2);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:36px}
#cffb-sb .sb-g__ft button:hover,#cffb-sb .sb-g__ft button.on{color:var(--gold-l)}
#cffb-sb .sb-g__ft button+button{border-left:1px solid #1d1d1d}
#cffb-sb .sb-imp{padding:4px 12px 10px;background:#101010;border-top:1px solid #1d1d1d}
#cffb-sb .sb-imp__r{display:grid;grid-template-columns:minmax(0,1fr) 34px 66px 66px;gap:6px;align-items:center;padding:4px 0;border-bottom:1px solid #1a1a1a}
#cffb-sb .sb-imp__r:last-child{border-bottom:0}
#cffb-sb .sb-imp__r--h{font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);padding-top:6px}
#cffb-sb .sb-imp__r--h span:not(:first-child){display:flex;justify-content:flex-end;align-items:center;gap:3px}
#cffb-sb .sb-imp__now{text-align:right;font:600 12px 'Saira Condensed',sans-serif;color:var(--fg3)}
#cffb-sb .sb-v{display:flex;justify-content:flex-end;align-items:baseline;gap:4px}
#cffb-sb .sb-v b{font:700 14px 'Saira Condensed',sans-serif}
#cffb-sb .sb-v i{font:700 10px 'Saira Condensed',sans-serif;font-style:normal;color:var(--fg3);min-width:22px;text-align:right}
#cffb-sb .up{color:var(--up)!important}#cffb-sb .dn{color:var(--dn)!important}
#cffb-sb .o-z{color:var(--fg3)}#cffb-sb .o-lo{color:var(--fg2)}#cffb-sb .o-mid{color:#C8C8C8}#cffb-sb .o-hi{color:var(--fg)}#cffb-sb .o-lock{color:var(--gold)}
/* table */
#cffb-sb .sb-card{background:var(--s1);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
#cffb-sb .sb-tbl{width:100%;border-collapse:collapse}
#cffb-sb .sb-tbl th{font-size:8.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);text-align:right;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
#cffb-sb .sb-tbl th.l{text-align:left}
#cffb-sb .sb-tbl td{padding:6px;border-bottom:1px solid #1c1c1c;text-align:right;white-space:nowrap;font:600 14px 'Saira Condensed',sans-serif}
#cffb-sb .sb-tbl tr:last-child td{border-bottom:0}
#cffb-sb .sb-tbl tbody tr{cursor:pointer}
#cffb-sb .sb-tbl tbody tr:hover td{background:var(--sh)}
#cffb-sb .sb-tbl tr.ccg td{background:rgba(201,162,39,.045)}
#cffb-sb .sb-tbl tr.ccg td:first-child{box-shadow:inset 3px 0 0 var(--gold-d)}
#cffb-sb .sb-tbl tr.cut td{border-bottom:1px dashed var(--bd2)}
#cffb-sb .sb-tbl td.rk{text-align:left;font-weight:700;font-size:16px;width:34px}
#cffb-sb .sb-tbl td.rk small{font:700 9px Inter,sans-serif;margin-left:3px}
#cffb-sb .sb-tbl td.tm{text-align:left}
#cffb-sb .sb-tbl td.tm span{display:inline-flex;align-items:center;gap:5px}
#cffb-sb .sb-tbl td.o{font-weight:700;font-size:15px}
#cffb-sb .sb-tbl td.s{color:var(--fg2);font-size:13px}
#cffb-sb .w-only{display:none}
#cffb-sb .mx{color:var(--up)}#cffb-sb .me{color:var(--dn)}
#cffb-sb .sb-tbt{font:700 8px Inter,sans-serif;letter-spacing:.1em;color:var(--gold);border:1px solid rgba(201,162,39,.45);border-radius:2px;padding:1px 3px;line-height:1.2}
#cffb-sb .sb-tie{padding:10px 12px;border-top:1px solid var(--bd);background:#111}
#cffb-sb .sb-tie__h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
#cffb-sb .sb-tie__h span+span{color:var(--fg3);letter-spacing:.04em}
#cffb-sb .sb-tie__r{display:grid;grid-template-columns:minmax(0,1fr) 40px 44px 44px 38px 30px;gap:4px;align-items:center;padding:3px 0;font:600 13px 'Saira Condensed',sans-serif;color:var(--fg2);text-align:right}
#cffb-sb .sb-tie__r>span{border-radius:2px;padding:1px 3px}
#cffb-sb .sb-tie__r--h{font:700 8px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3)}
#cffb-sb .sb-tie__r .t{display:flex;align-items:center;gap:5px;text-align:left}
#cffb-sb .sb-tie__r .t b{font-size:12px;color:var(--fg3);width:9px}
#cffb-sb .sb-tie__r .dec{background:var(--gold);color:#0A0A0A}
#cffb-sb .sb-tie__r .res{font:700 8px Inter,sans-serif;letter-spacing:.08em;color:var(--gold)}
#cffb-sb .sb-tbl2{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--bd);font-size:11px;color:var(--fg3)}
#cffb-sb .sb-tbl2 b{color:var(--fg);font:700 13px 'Saira Condensed',sans-serif}
#cffb-sb .sb-tbl2 span span{margin-left:8px}
#cffb-sb .sb-ccg{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--bd);background:linear-gradient(90deg,rgba(201,162,39,.07),transparent 70%)}
#cffb-sb .sb-ccg__l{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);line-height:1.3}
#cffb-sb .sb-ccg__l span{display:block;color:var(--fg3)}
#cffb-sb .sb-vs{font:700 11px 'Saira Condensed',sans-serif;color:var(--fg3);text-transform:uppercase}
#cffb-sb .sb-ccg__p{margin-left:auto;font-size:11px;color:var(--fg2)}
/* paths */
#cffb-sb .sb-pa__hd{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--bd)}
#cffb-sb .sb-pa__t{font:700 14px 'Saira Condensed',sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--fg)}
#cffb-sb .sb-pa__t small{display:block;font:500 10px Inter,sans-serif;letter-spacing:0;text-transform:none;color:var(--fg3)}
#cffb-sb .sb-pa{padding:10px 12px;border-top:1px solid var(--bd);display:grid;gap:6px}
#cffb-sb .sb-pa:first-of-type{border-top:0}
#cffb-sb .sb-pa__h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#cffb-sb .sb-pa__s{margin-left:auto;font:700 12px Inter,sans-serif;display:flex;gap:6px;align-items:center}
#cffb-sb .sb-pa__s small{font-weight:500;color:var(--fg3);font-size:10px}
#cffb-sb .sb-pa__l{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
#cffb-sb .sb-pa__k{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);min-width:42px}
#cffb-sb .sb-pc{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border:1px solid var(--bd);border-radius:3px;font-size:11px;color:var(--fg2);background:var(--s2)}
#cffb-sb .sb-pc.must{border-color:var(--gold-d);color:var(--fg)}
#cffb-sb .sb-pc small{color:var(--fg3);font-size:10px}
#cffb-sb .sb-pa__n{font-size:11px;color:var(--fg3);line-height:1.4}
#cffb-sb .sb-pa__tag{font:700 9px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:4px 6px;border-radius:2px;background:var(--s2);color:var(--fg2)}
#cffb-sb .sb-pa__tag.x{background:var(--gold);color:#0A0A0A}
#cffb-sb .sb-or2{font:700 9px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);flex:none}
#cffb-sb .sb-sc__c>i{font-size:9px;letter-spacing:.1em;text-transform:uppercase}
#cffb-sb .sb-sc .sb-btn{flex:none;margin-left:auto}
#cffb-sb .sb-sc{flex-wrap:wrap}
#cffb-sb .sb-sc__c{flex:1 1 220px;min-width:0}
#cffb-sb .sb-pc{flex-wrap:wrap;max-width:100%}
#cffb-sb .sb-tblw{overflow-x:auto;scrollbar-width:none}
#cffb-sb .sb-tbl th,#cffb-sb .sb-tbl td{padding-left:4px;padding-right:4px}
#cffb-sb .sb-pa{padding:10px}
#cffb-sb .sb-pa__k{min-width:0;flex-basis:100%}
#cffb-sb .sb-pa__h{flex-wrap:nowrap}
#cffb-sb .sb-pa__s{flex-direction:row-reverse;align-items:baseline;gap:8px;text-align:right;flex:none}
#cffb-sb .sb-pa__s b{font-size:17px;line-height:1}
#cffb-sb .sb-pa__s small{font-size:9px}
#cffb-sb .sb-scb{padding:8px}
#cffb-sb .sb-scb.al .sb-scb__h{color:var(--fg2)}
#cffb-sb .sb-scb.el .sb-scb__h{color:#C9645A}
#cffb-sb .sb-scb.el{border-color:rgba(201,100,90,.3)}
#cffb-sb .sb-locked{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
#cffb-sb .sb-locked .sb-pc{cursor:pointer}
#cffb-sb .sb-seeds{display:grid;gap:6px}

  const apProj = Array.from(APW, (w, i) => { const a = w + FW[i] * rem, b = APL[i] + FL[i] * rem; return a + b ? a / (a + b) : 0; });

  // Projected opponent all-play: authoritative value from the live feed, held
  // constant across the remaining (cross-league, unknown-opponent) weeks. Neutral
  // 0.5 when absent (sample data) so the ranking formula still orders sanely.
  const oppAp = SB_ALL.map((i) => { const v = SB_TEAMS[i].oppAp; return v == null ? 0.5 : v; });
  // National-rank baseline: the authoritative current league rank when the feed
  // provides it (the bylaws' "National Ranking" tiebreaker). Falls back to a
  // projected all-play/points blend for sample data that carries no published rank.
  const natPos = new Int16Array(NT);
  const haveRank = SB_NT > 0 && SB_TEAMS.every((t) => t.rank != null && t.rank > 0);
  if (haveRank) { SB_TEAMS.forEach((t) => { natPos[t.idx] = t.rank; }); }
  else {
    const maxPF = Math.max.apply(null, Array.from(ptsProj)) || 1;
    const nat = apProj.map((a, i) => 0.55 * a + 0.45 * ptsProj[i] / maxPF);
    SB_ALL.slice().sort((a, b) => nat[b] - nat[a]).forEach((t, i) => { natPos[t] = i + 1; });
  }
  // Non-H2H tiebreak priority (bylaws): all-play % → total points → national rank.
  const priPos = new Int16Array(NT); SB_ALL.slice().sort((a, b) => apProj[b] - apProj[a] || ptsProj[b] - ptsProj[a] || natPos[a] - natPos[b]).forEach((t, i) => { priPos[t] = i; });
  return { asOf, W, L, CW, CL, H, ppg, prob, open, kOf, apNow, apProj, ptsProj, oppAp, natPos, priPos };
}

// Seed a group tied on conference record, per the bylaws:
//   head-to-head "sweep" (a team must beat every other tied team) \u2014 the sweeper
//   takes the next spot and the rest restart the sweep test; if no team sweeps,
//   the whole remaining group drops to all-play % \u2192 total points \u2192 national rank.
// Returns { ordered, steps } where steps[k] names the metric separating
// ordered[k] from ordered[k+1] ('h2h' | 'ap' | 'pts' | 'nat').
function sbSeedTied(group, H, stride, ap, pts, nat) {
  const ordered = [], steps = [];
  let remaining = group.slice();
  const sweeps = (t) => remaining.every((o) => o === t || H[t * stride + o] > H[o * stride + t]);
  const sep = (a, b) => (Math.abs(ap[a] - ap[b]) > 1e-9 ? 'ap' : Math.abs(pts[a] - pts[b]) > 1e-9 ? 'pts' : 'nat');
  while (remaining.length > 1) {
    const sweeper = remaining.find(sweeps);   // team idx; note idx 0 is falsy, so test against undefined
    if (sweeper !== undefined) { ordered.push(sweeper); remaining = remaining.filter((t) => t !== sweeper); steps.push('h2h'); continue; }
    remaining.sort((a, b) => ap[b] - ap[a] || pts[b] - pts[a] || nat[a] - nat[b]);
    for (let k = 0; k < remaining.length - 1; k++) steps.push(sep(remaining[k], remaining[k + 1]));
    ordered.push.apply(ordered, remaining); remaining = [];
  }
  if (remaining.length === 1) ordered.push(remaining[0]);
  while (steps.length < ordered.length - 1) steps.push('h2h');
  return { ordered: ordered, steps: steps.slice(0, Math.max(0, ordered.length - 1)) };
}

// Full conference order + tiebreak trace (for display).
function sbConfOrder(c, CW, CL, H, B) {
  const NT = SB_NT, ap = B.apProj, pts = B.ptsProj, natPos = B.natPos, m = SB_MEM[c].slice();
  const pct = (t) => { const g = CW[t] + CL[t]; return g ? CW[t] / g : 0; };
  m.sort((a, b) => pct(b) - pct(a));
  const order = [], ties = [];
  let i = 0;
  while (i < m.length) {
    let j = i + 1;
    while (j < m.length && Math.abs(pct(m[j]) - pct(m[i])) < 1e-9) j++;
    const grp = m.slice(i, j);
    if (grp.length > 1) {
      const hr = {};
      grp.forEach((t) => { let w = 0, l = 0; grp.forEach((o) => { if (o !== t) { w += H[t * NT + o]; l += H[o * NT + t]; } }); hr[t] = [w, l]; });
      const seeded = sbSeedTied(grp, H, NT, ap, pts, natPos);
      ties.push({ teams: seeded.ordered.slice(), start: i, rec: CW[seeded.ordered[0]] + '\u2013' + CL[seeded.ordered[0]], h2h: hr, steps: seeded.steps });
      order.push.apply(order, seeded.ordered);
    } else { order.push(grp[0]); }
    i = j;
  }
  return { order, ties };
}

function sbRecords(B, winners) {
  const NT = SB_NT, W = B.W.slice(), L = B.L.slice(), CW = B.CW.slice(), CL = B.CL.slice(), H = B.H.slice();
  B.open.forEach((g, k) => { const w = winners[k], l = w === g.a ? g.b : g.a; W[w]++; L[l]++; if (g.conf) { CW[w]++; CL[l]++; } H[w * NT + l]++; });
  return { W, L, CW, CL, H };
}

// Final ranking, 16-team field, bowls — given regular-season records and title-game winners.
// National ranking follows the league formula ((W+1) × (allPlay + oppAllPlay)),
// projected to the end of championship week; the field is seeded by that ranking.
function sbNational(B, W0, L0, champs, losers) {
  const NT = SB_NT, W = W0.slice(), L = L0.slice();
  champs.forEach((w, c) => { W[w]++; L[losers[c]]++; });
  const score = new Float64Array(NT);
  for (let i = 0; i < NT; i++) score[i] = (W[i] + 1) * (B.apProj[i] + B.oppAp[i]);
  const rank = SB_ALL.slice().sort((i, j) => (score[j] - score[i]) || B.natPos[i] - B.natPos[j]);
  const rankPos = new Int16Array(NT); rank.forEach((t, i) => { rankPos[t] = i; });
  const byRank = (a, b) => rankPos[a] - rankPos[b];
  // Auto-bids: champions of the power conferences (SB_CONF_AUTO) always qualify;
  // a non-power champion (the AAC) must earn an at-large bid on national ranking.
  const auto = champs.filter((t, c) => SB_CONF_AUTO[c]).sort(byRank), isAuto = new Uint8Array(NT); auto.forEach((t) => { isAuto[t] = 1; });
  const field = [...auto, ...rank.filter((t) => !isAuto[t]).slice(0, SB_FIELD - auto.length)].sort(byRank);
  const used = new Uint8Array(NT); field.forEach((t) => { used[t] = 1; });
  const firstOut = rank.filter((t) => !used[t]).slice(0, 4);
  const elig = (t) => !used[t] && W[t] >= SB_MIN_WINS;
  const pool = rank.filter(elig);
  const bowls = SB_BOWLS.map((bw, bi) => ({ bowl: bw, a: pool[bi * 2] ?? null, b: pool[bi * 2 + 1] ?? null }));
  return { W, L, rank, rankPos, auto, isAuto, field, firstOut, bowls };
}

function sbPlayBracket(field, poPicks, prob) {
  const res = {}, games = [];
  SB_BRACKET.forEach((sp) => {
    const side = (x) => (x.s ? field[x.s - 1] : res[x.g]);
    const a = side(sp.a), b = side(sp.b), p = prob(a, b), pk = poPicks[sp.id];
    const picked = pk != null && (pk === a || pk === b), w = picked ? pk : (p >= 0.5 ? a : b);
    res[sp.id] = w;
    games.push({ ...sp, a, b, w, p, picked, seedA: field.indexOf(a) + 1, seedB: field.indexOf(b) + 1 });
  });
  return { games, champ: res.F };
}

// Projected scenario: picks, favorites elsewhere.
function sbProject(B, picks, ccgPick, poPicks) {
  const winners = B.open.map((g) => (picks[g.id] != null ? picks[g.id] : (g.p >= 0.5 ? g.a : g.b)));
  const R = sbRecords(B, winners);
  const confs = SB_CONFS.map((_, c) => sbConfOrder(c, R.CW, R.CL, R.H, B));
  const orders = confs.map((x) => x.order);
  const ccg = orders.map((o, c) => {
    const a = o[0], b = o[1], p = B.prob(a, b), pk = ccgPick[c], picked = pk === a || pk === b;
    return { c, a, b, p, picked, w: picked ? pk : (p >= 0.5 ? a : b) };
  });
  const N = sbNational(B, R.W, R.L, ccg.map((x) => x.w), ccg.map((x) => (x.w === x.a ? x.b : x.a)));
  return { winners, regW: R.W, regL: R.L, CW: R.CW, CL: R.CL, H: R.H, W: N.W, L: N.L, ap: B.apProj, ptsProj: B.ptsProj, natPos: B.natPos, confs, orders, ccg,
    field: N.field, auto: N.auto, isAuto: N.isAuto, firstOut: N.firstOut, bowls: N.bowls, rank: N.rank, bracket: sbPlayBracket(N.field, poPicks, B.prob) };
}

// Count every Week 13 title-game outcome (unpicked CCGs) on top of a regular-season result.
function sbTitleWeek(B, W, L, orders, ccgPick) {
  const NT = SB_NT, games = orders.map((o, c) => { const a = o[0], b = o[1], pk = ccgPick[c]; return { a, b, fix: pk === a || pk === b ? pk : null }; });
  const u = []; games.forEach((g, c) => { if (g.fix == null) u.push(c); });
  const Cn = 1 << u.length, po = new Float64Array(NT), auto = new Float64Array(NT), conf = new Float64Array(NT);
  const seeds = {}, bowls = {}, rankSum = new Float64Array(NT);
  for (let mask = 0; mask < Cn; mask++) {
    const champs = games.map((g) => (g.fix != null ? g.fix : g.a));
    u.forEach((c, i) => { if ((mask >> i) & 1) champs[c] = games[c].b; });
    const N = sbNational(B, W, L, champs, champs.map((w, c) => (w === games[c].a ? games[c].b : games[c].a)));
    N.field.forEach((t, i) => { po[t]++; if (N.isAuto[t]) auto[t]++; (seeds[t] = seeds[t] || new Float64Array(SB_FIELD + 1))[i + 1]++; });
    champs.forEach((t) => { conf[t]++; });
    N.bowls.forEach((b, bi) => { [b.a, b.b].forEach((t, sd) => { if (t != null) (bowls[t] = bowls[t] || new Float64Array(SB_BOWLS.length * 2))[bi * 2 + sd]++; }); });
    for (let t = 0; t < NT; t++) rankSum[t] += N.rankPos[t] + 1;
  }
  return { C: Cn, po, auto, conf, seeds, bowls, rank: Array.from(rankSum, (v) => v / Cn) };
}
function sbPoIf(B, winners, k, w, ccgPick) {
  const wn = winners.slice(); wn[k] = w;
  const R = sbRecords(B, wn);
  const orders = SB_CONFS.map((_, c) => sbConfOrder(c, R.CW, R.CL, R.H, B).order);
  return sbTitleWeek(B, R.W, R.L, orders, ccgPick);
}

// Exhaustive count of one conference's open games (Gray-code walk: one game flips per step).
function sbCount(B, picks, c) {
  const NT = SB_NT, mem = SB_MEM[c], n = mem.length, loc = {};
  mem.forEach((t, i) => { loc[t] = i; });
  const CW = new Int16Array(n), G = new Int16Array(n), H = new Int8Array(n * n);
  mem.forEach((t, i) => { CW[i] = B.CW[t]; G[i] = B.CW[t] + B.CL[t]; mem.forEach((o, j) => { H[i * n + j] = B.H[t * NT + o]; }); });
  const free = [], jOf = {};
  B.open.forEach((g) => {
    if (!g.conf || SB_TEAMS[g.a].conf !== c) return;
    const a = loc[g.a], b = loc[g.b]; G[a]++; G[b]++;
    const pk = picks[g.id];
    if (pk != null) { const w = loc[pk], l = w === a ? b : a; CW[w]++; H[w * n + l]++; }
    else { jOf[g.id] = free.length; free.push({ g, a, b, fav: g.p >= 0.5 ? 0 : 1 }); }
  });
  const F = free.length;
  if (F > SB_CAP_BITS) return { c, over: true, F, free, mem, loc, n };
  const M = 2 ** F, pri = mem.map((t) => B.priPos[t]), apL = mem.map((t) => B.apProj[t]), ptsL = mem.map((t) => B.ptsProj[t]);
  const top1 = new Float64Array(n), top2 = new Float64Array(n), c1 = new Float64Array(F * 2 * n), c2 = new Float64Array(F * 2 * n);
  const ownN = new Int8Array(n), ow = new Int8Array(n);
  free.forEach((f) => { CW[f.a]++; H[f.a * n + f.b]++; ow[f.a]++; ownN[f.a]++; ownN[f.b]++; });
  const bC1 = mem.map((_, i) => new Float64Array(ownN[i] + 1)), bC2 = mem.map((_, i) => new Float64Array(ownN[i] + 1));
  const floor1 = new Int16Array(n).fill(999), floor2 = new Int16Array(n).fill(999), tbIn = new Float64Array(n), tbOut = new Float64Array(n);
  const T1 = new Uint8Array(M), T2 = new Uint8Array(M);
  const bestS = new Int16Array(n * 2).fill(-1), bestM = new Int32Array(n * 2);
  const TB = { n: 0, by: { h2h: 0, ap: 0, pts: 0, nat: 0 }, groups: new Map() };
  const pct = new Float64Array(n), hv = new Float64Array(n);
  let fs = 0; free.forEach((f) => { if (f.fav === 0) fs++; });
  const resolve = (grp) => {
    for (const t of grp) { let w = 0, l = 0; for (const o of grp) if (o !== t) { w += H[t * n + o]; l += H[o * n + t]; } hv[t] = w + l ? w / (w + l) : 0.5; }
    grp.sort((a, b) => hv[b] - hv[a] || pri[a] - pri[b]);
  };
  const crit = (a, b) => (Math.abs(hv[a] - hv[b]) > 1e-9 ? 'h2h' : Math.abs(apL[a] - apL[b]) > 1e-9 ? 'ap' : Math.abs(ptsL[a] - ptsL[b]) > 1e-9 ? 'pts' : 'nat');
  let mask = 0;
  for (let step = 0; step < M; step++) {
    if (step > 0) {
      const j = 31 - Math.clz32(step & -step), f = free[j];
      if (!((mask >> j) & 1)) { CW[f.a]--; H[f.a * n + f.b]--; CW[f.b]++; H[f.b * n + f.a]++; ow[f.a]--; ow[f.b]++; fs += f.fav === 1 ? 1 : -1; }
      else { CW[f.b]--; H[f.b * n + f.a]--; CW[f.a]++; H[f.a * n + f.b]++; ow[f.b]--; ow[f.a]++; fs += f.fav === 0 ? 1 : -1; }
      mask ^= 1 << j;
    }
    let v1 = -1;
    for (let i = 0; i < n; i++) { pct[i] = CW[i] / G[i]; if (pct[i] > v1) v1 = pct[i]; }
    const S1 = []; for (let i = 0; i < n; i++) if (pct[i] > v1 - 1e-9) S1.push(i);
    let t1, t2, cut1 = null, cut2 = null, grp = null;
    if (S1.length > 1) { resolve(S1); t1 = S1[0]; t2 = S1[1]; cut1 = crit(t1, t2); if (S1.length > 2) { cut2 = crit(S1[1], S1[2]); grp = S1; } }
    else {
      t1 = S1[0]; let v2 = -1;
      for (let i = 0; i < n; i++) if (i !== t1 && pct[i] > v2) v2 = pct[i];
      const S2 = []; for (let i = 0; i < n; i++) if (i !== t1 && pct[i] > v2 - 1e-9) S2.push(i);
      if (S2.length > 1) { resolve(S2); cut2 = crit(S2[0], S2[1]); grp = S2; }
      t2 = S2[0];
    }
    top1[t1]++; top2[t1]++; top2[t2]++;
    for (let j = 0; j < F; j++) { const o = (j * 2 + ((mask >> j) & 1)) * n; c2[o + t1]++; c2[o + t2]++; c1[o + t1]++; }
    bC2[t1][ow[t1]]++; bC2[t2][ow[t2]]++; bC1[t1][ow[t1]]++;
    if (CW[t1] < floor2[t1]) floor2[t1] = CW[t1]; if (CW[t2] < floor2[t2]) floor2[t2] = CW[t2]; if (CW[t1] < floor1[t1]) floor1[t1] = CW[t1];
    if (fs > bestS[t1 * 2]) { bestS[t1 * 2] = fs; bestM[t1 * 2] = mask; }
    if (fs > bestS[t2 * 2]) { bestS[t2 * 2] = fs; bestM[t2 * 2] = mask; }
    if (fs > bestS[t1 * 2 + 1]) { bestS[t1 * 2 + 1] = fs; bestM[t1 * 2 + 1] = mask; }
    T1[mask] = t1; T2[mask] = t2;
    if (cut2) {
      TB.n++; TB.by[cut2]++;
      let bits = 0; for (const t of grp) { bits |= 1 << t; if (t === t1 || t === t2) tbIn[t]++; else tbOut[t]++; }
      const key = bits * 32 + CW[grp[0]];
      let G0 = TB.groups.get(key);
      if (!G0) { G0 = { n: 0, by: { h2h: 0, ap: 0, pts: 0, nat: 0 }, adv: new Float64Array(n), ex: mask, grp: grp.slice(), cw: CW[grp[0]] }; TB.groups.set(key, G0); }
      G0.n++; G0.by[cut2]++;
      if (grp.indexOf(t1) >= 0) G0.adv[t1]++; G0.adv[t2]++;
    }
  }
  return { c, over: false, F, M, free, jOf, mem, loc, n, G, top1, top2, c1, c2, ownN, bC1, bC2, floor1, floor2, tbIn, tbOut, TB, T1, T2, bestS, bestM };
}

// Pathways: condition a team's result on its K most decisive open games (own games first).
// Each of the 2^K cells = share of the remaining outcomes (all other open games) that put the team in.
// Minimal cubes where every cell = 100% → "gets in if"; every cell = 0% → "out if"; every cell > 0% → "alive if".
function sbPathways(r, i, js, cut) {
  const K = js.length, S = 1 << K, q = new Float64Array(S), M = r.M, T1 = r.T1, T2 = r.T2;
  for (let m = 0; m < M; m++) {
    if (T1[m] === i || (cut === 2 && T2[m] === i)) { let s = 0; for (let b = 0; b < K; b++) s |= ((m >> js[b]) & 1) << b; q[s]++; }
  }
  const per = M / S; for (let s = 0; s < S; s++) q[s] /= per;
  const cubes = [];
  for (let c = 0; c < Math.pow(3, K); c++) {
    let sel = 0, val = 0, x = c, k = 0;
    for (let b = 0; b < K; b++) { const d = x % 3; x = (x - d) / 3; if (d < 2) { sel |= 1 << b; if (d) val |= 1 << b; k++; } }
    cubes.push({ sel, val, k });
  }
  cubes.sort((a, b) => a.k - b.k);
  const sub = (A, cu) => A.some((s) => (s.sel & cu.sel) === s.sel && (cu.val & s.sel) === s.val);
  const cl = [], al = [], el = [];
  let allAlive = true; for (let s = 0; s < S; s++) if (q[s] <= 1e-9) allAlive = false;
  cubes.forEach((cu) => {
    let mn = 1, mx = 0, sum = 0, cnt = 0;
    for (let s = 0; s < S; s++) if ((s & cu.sel) === cu.val) { if (q[s] < mn) mn = q[s]; if (q[s] > mx) mx = q[s]; sum += q[s]; cnt++; }
    cu.avg = sum / cnt;
    if (mn >= 1 - 1e-9) { if (!sub(cl, cu)) cl.push(cu); }
    else if (mx <= 1e-9) { if (!sub(el, cu)) el.push(cu); }
    else if (!allAlive && mn > 1e-9 && cu.k > 0 && !sub(al, cu) && !sub(cl, cu)) al.push(cu);
  });
  const lits = (cu) => js.map((j, b) => ((cu.sel >> b) & 1 ? { j, side: (cu.val >> b) & 1 } : null)).filter(Boolean);
  const fin = (A) => A.map((cu) => ({ k: cu.k, avg: cu.avg, lits: lits(cu) }));
  return { cl: fin(cl), al: fin(al).sort((a, b) => a.k - b.k || b.avg - a.avg), el: fin(el) };
}

function pk(act, attrs, t, h, picked, isW){ return '<button type="button" class="sb-pk' + (picked && isW ? ' on' : '') + '" data-act="' + act + '" ' + attrs + ' data-t="' + t + '" aria-label="Pick ' + T[t].name + '">' + pill(t, h, picked && !isW ? 'dim' : '') + '</button>'; }

function chips(act, cur, list){ return '<div class="sb-chips">' + list.map(function(x){ return '<button type="button" class="sb-chip' + (cur === x.v ? ' on' : '') + '" data-act="' + act + '" data-v="' + x.v + '">' + (x.img ? '<img src="' + x.img + '" alt="">' : '') + x.l + (x.n != null ? '<small>' + x.n + '</small>' : '') + '</button>'; }).join('') + '</div>'; }
function confChips(nf){ return chips('conf', ui.conf, C.map(function(c, i){ return { v: i, l: c.name, img: c.logo, n: nf ? nf(i) : null }; })); }

/* ---- count accessors ---- */
function R(t){ return CNT[T[t].conf]; }
function ccgV(t){ var r = R(t); return r.over ? null : r.top2[r.loc[t]] / r.M; }
function n1V(t){ var r = R(t); return r.over ? null : r.top1[r.loc[t]] / r.M; }
function mark(t){ var r = R(t); if (r.over) return null; var v = r.top2[r.loc[t]]; return v === r.M ? 'x' : v === 0 ? 'e' : null; }
function condC(t, g, side, cut){ var r = CNT[T[g.a].conf]; if (r.over || r.jOf[g.id] == null || r.loc[t] == null) return null; var cc = cut === 1 ? r.c1 : r.c2; return cc[(r.jOf[g.id] * 2 + side) * r.n + r.loc[t]] / (r.M / 2); }
function levC(g){ var r = CNT[T[g.a].conf]; if (r.over || r.jOf[g.id] == null) return 0; var j = r.jOf[g.id], s = 0; for (var i = 0; i < r.n; i++) s += Math.abs(r.c2[(j * 2) * r.n + i] - r.c2[(j * 2 + 1) * r.n + i]); return s / (r.M / 2) / 2; }
function poIf(g){ if (!poCache[g.id]) { var k = B.kOf[g.id]; poCache[g.id] = { a: sbPoIf(B, proj.winners, k, g.a, ccgPick), b: sbPoIf(B, proj.winners, k, g.b, ccgPick) }; } return poCache[g.id]; }
function levP(g){ var x = poIf(g), s = 0; for (var t = 0; t < SB_NT; t++) s += Math.abs(x.a.po[t] / x.a.C - x.b.po[t] / x.b.C); return s / 2; }
function poV(t){ return tw.po[t] / tw.C; }
function nextWk(c){ for (var w = SB_ACTUAL_PLAYED + 1; w <= SB_WEEKS; w++) if (B.open.some(function(g){ return g.week === w && g.conf && T[g.a].conf === c && picks[g.id] == null; })) return w; return null; }
function lockCard(c){
  var r = CNT[c], need = r.F - SB_CAP_BITS, w = nextWk(c);
  return '<div class="sb-lock"><b>' + C[c].name + ': ' + r.F + ' open games = ' + outs(r.F) + ' outcomes</b><p>Exact counting tops out at ' + SB_CAP_BITS + ' open games per conference (' + num(SB_CAP) + ' outcomes). Pick at least <strong>' + need + '</strong> more ' + C[c].name + ' result' + (need > 1 ? 's' : '') + ' to unlock outcome counts, paths and tiebreakers.</p><div class="sb-lock__a">' +
    (w ? '<button type="button" class="sb-btn xs" data-act="lockwk" data-c="' + c + '" data-v="' + w + '">Lock Wk ' + w + ' favorites</button>' : '') + '' + '</div></div>';
}

/* ---- bar ---- */
function bar(){

  // the bracket of six title games is all that's left to project.
  var champWeek = SB_ACTUAL_PLAYED >= SB_WEEKS;
  var nx = champWeek ? SB_CCG_WEEK : SB_ACTUAL_PLAYED + 1;
  $('wkb').textContent = nx;
  $('wke').textContent = champWeek ? 'TITLES' : 'UP NEXT';
  $('wkn').textContent = champWeek ? 'Conf Championships \u00b7 Wk ' + SB_CCG_WEEK : 'Wks ' + nx + '\u2013' + SB_WEEKS + ' + CCG';
  $('mus').innerHTML = proj.ccg.map(function(x, c){ return '<span class="sb-mu"><i>' + C[c].name.replace('Big Ten', 'B1G') + '</i>' + pill(x.a, 18) + '<em>v</em>' + pill(x.b, 18) + '</span>'; }).join('');
  var left = B.open.filter(function(g){ return picks[g.id] == null; }).length;
  $('tsub').textContent = champWeek
    ? 'Regular season final \u00b7 projecting ' + SB_NC + ' title games (Wk ' + SB_CCG_WEEK + ')'
    : left + ' games left through Wk ' + SB_WEEKS + ' \u00b7 title games Wk ' + SB_CCG_WEEK;
  $('foot').innerHTML = champWeek
    ? '<b>' + SB_NC + '</b> championship games \u00b7 every outcome counted'
    : '<b>' + B.open.length + '</b> open games \u00b7 every outcome counted';
}

/* ---- tabs ---- */
function tabs(){
  var n = B.open.filter(function(g){ return picks[g.id] != null; }).length, tieN = 0;
  CNT.forEach(function(r){ if (!r.over && r.TB.n / r.M >= 0.05) tieN++; });
  var tb = [['races', 'Races'], ['playoff', 'Playoff'], ['bowls', 'Bowls']];
  $('tabs').innerHTML = tb.map(function(t){ return '<button type="button" class="sb-tab' + (ui.tab === t[0] ? ' on' : '') + '" data-act="tab" data-v="' + t[0] + '">' + t[1] + (t[2] != null ? '<i>' + t[2] + '</i>' : '') + '</button>'; }).join('');
}

/* ---- races ---- */
function tieTable(tie){
  var hi = tie.teams.map(function(){ return {}; });
  tie.steps.forEach(function(s, i){ hi[i][s] = 1; hi[i + 1][s] = 1; });
  var used = tie.steps.filter(function(s, i, a){ return a.indexOf(s) === i; }), o = proj.orders[T[tie.teams[0]].conf];
  return '<div class="sb-tie"><div class="sb-tie__h"><span>Tied at ' + tie.rec + '</span><span>Decided by ' + used.map(function(u){ return SB_TB[u]; }).join(' \u2192 ') + '</span></div>' +
    '<div class="sb-tie__r sb-tie__r--h"><span></span><span>H2H</span><span>AP%</span><span>PF</span><span>Rank</span><span></span></div>' +
    tie.teams.map(function(t, i){ return '<div class="sb-tie__r"><span class="t"><b>' + (tie.start + i + 1) + '</b>' + tm(t, 16) + '</span><span class="' + (hi[i].h2h ? 'dec' : '') + '">' + rec(tie.h2h[t][0], tie.h2h[t][1]) + '</span><span class="' + (hi[i].ap ? 'dec' : '') + '">' + (proj.ap[t] * 100).toFixed(1) + '</span><span class="' + (hi[i].pts ? 'dec' : '') + '">' + Math.round(proj.ptsProj[t]) + '</span><span class="' + (hi[i].nat ? 'dec' : '') + '">#' + proj.natPos[t] + '</span><span class="res">' + (o.indexOf(t) < 2 ? 'CCG' : '') + '</span></div>'; }).join('') + '</div>';
}
function vRaces(){
  var c = ui.conf, o = proj.orders[c], x = proj.ccg[c], ties = proj.confs[c].ties, r = CNT[c], tieOf = {};
  ties.forEach(function(tie){ tie.teams.forEach(function(t){ tieOf[t] = 1; }); });
  var h = '<div class="sb-sub">' + confChips() + '</div>' + (r.over ? lockCard(c) : '');
  h += '<div class="sb-card"><div class="sb-tblw"><table class="sb-tbl"><thead><tr><th class="l">#</th><th class="l">Team</th><th>Conf</th><th class="w-only">Ovr</th><th class="w-only">AP%</th><th class="w-only">Rk</th><th>CCG</th><th>CFP</th><th>Bowl</th></tr></thead><tbody>';
  o.forEach(function(t, i){
    var mk = mark(t), v = ccgV(t), bw = 0;
    if (tw.bowls[t]) tw.bowls[t].forEach(function(q){ bw += q; });
    h += '<tr class="' + (i < 2 ? 'ccg' : '') + (i === 1 ? ' cut' : '') + '" data-act="team" data-t="' + t + '"><td class="rk">' + (i + 1) + (mk ? '<small class="m' + mk + '">' + mk + '</small>' : '') + '</td>' +
      '<td class="tm"><span>' + pill(t, 20) + (tieOf[t] ? '<span class="sb-tbt">TB</span>' : '') + '</span></td>' +
      '<td>' + rec(proj.CW[t], proj.CL[t]) + '</td><td class="s w-only">' + rec(proj.regW[t], proj.regL[t]) + '</td>' +
      '<td class="s w-only">' + (proj.ap[t] * 100).toFixed(1) + '</td><td class="s w-only">' + proj.natPos[t] + '</td>' +
      '<td class="o ' + (v == null ? 'o-z' : oc(v)) + '"' + (v == null ? '' : ' title="' + num(r.top2[r.loc[t]]) + ' of ' + num(r.M) + ' outcomes"') + '>' + pct(v) + '</td>' +
      '<td class="o ' + oc(poV(t)) + '">' + pct(poV(t)) + '</td><td class="o ' + oc(bw / tw.C) + '">' + pct(bw / tw.C) + '</td></tr>';
  });
  h += '</tbody></table></div>' + ties.map(tieTable).join('');
  if (!r.over) h += '<div class="sb-tbl2"><span>2nd CCG spot needs a tiebreaker in <b>' + pct(r.TB.n / r.M) + '</b> of ' + num(r.M) + ' outcomes</span>' + (r.TB.n ? '<span>' + ['h2h', 'ap', 'pts', 'nat'].map(function(k){ return '<span>' + SB_TB_SHORT[k] + ' <b>' + pct(r.TB.by[k] / r.TB.n) + '</b></span>'; }).join('') + '</span>' : '') + '</div>';
  h += '<div class="sb-ccg"><span class="sb-ccg__l">Championship<span>Wk 13 \u00b7 Projected</span></span>' + tm(x.a, 24) + '<span class="sb-vs">vs</span>' + tm(x.b, 24) + '<span class="sb-ccg__p">Fav ' + T[x.w].abbr + '</span></div></div>';
  if (!r.over) h = h.replace('<div class="sb-card"><div class="sb-tblw"><table', pathsCard(c) + '<div class="sb-card" style="margin-top:16px"><div class="sb-tblw"><table');
  h += '<p class="sb-note">Standings shown with favorites winning. CCG = share of all ' + (r.over ? outs(r.F) : num(r.M)) + ' win/loss outcomes of the open ' + C[c].name + ' games that put the team in the top two (hover for the count). CFP/Bowl = share of the ' + tw.C + ' Week 13 outcomes. <span class="mx">x</span> clinched \u00b7 <span class="me">e</span> eliminated. Tiebreakers: H2H sweep \u2192 all-play % \u2192 total points \u2192 national rank.</p>';
  return h;
}

/* ---- pathways ---- */
function pathData(t, cut){
  var r = R(t); if (r.over) return null;
  var i = r.loc[t], n = r.n, half = r.M / 2, cc = cut === 1 ? r.c1 : r.c2, tot = (cut === 1 ? r.top1 : r.top2)[i], helps = [], imp = [];
  r.free.forEach(function(f, j){
    var g = f.g, ca = cc[(j * 2) * n + i] / half, cb = cc[(j * 2 + 1) * n + i] / half, d = ca - cb, own = g.a === t || g.b === t;
    imp.push({ j: j, own: own, d: Math.abs(d) });
    if (!own && tot > 0 && Math.abs(d) >= 0.01) helps.push({ g: g, w: d > 0 ? g.a : g.b, l: d > 0 ? g.b : g.a, pw: Math.max(ca, cb), pl: Math.min(ca, cb), d: Math.abs(d) });
  });
  helps.sort(function(a, b){ return b.d - a.d; });
  var js = imp.filter(function(x){ return x.own || x.d >= 0.02; }).sort(function(a, b){ return (b.own - a.own) || b.d - a.d; }).slice(0, 6).map(function(x){ return x.j; });
  var pw = tot > 0 && tot < r.M ? sbPathways(r, i, js, cut) : null;
  var lit = function(x){ var g = r.free[x.j].g; return { g: g, w: x.side ? g.b : g.a, l: x.side ? g.a : g.b }; };
  if (pw) ['cl', 'al', 'el'].forEach(function(k){ pw[k] = pw[k].map(function(c){ return { k: c.k, avg: c.avg, lits: c.lits.map(lit) }; }); });
  var bi = i * 2 + (cut === 1 ? 1 : 0), path = null;
  if (r.bestS[bi] >= 0) { path = {}; var bm = r.bestM[bi]; r.free.forEach(function(f, j){ path[f.g.id] = (bm >> j) & 1 ? f.g.b : f.g.a; }); }
  var top = cut === 1 ? r.top1 : r.top2, rivals = r.mem.filter(function(o){ return o !== t && top[r.loc[o]] > 0; });
  return { t: t, cut: cut, tot: tot, M: r.M, F: r.F, helps: helps, pw: pw, path: path, rivals: rivals, floor: (cut === 1 ? r.floor1 : r.floor2)[i], games: r.G[i] };
}
function litChip(x, d){
  var t = d.t, body;
  var W = '<b class="sb-wl w">W</b>', L = '<b class="sb-wl l">L</b>', v = '<i class="sb-v2">v</i>';
  if (x.w === t) body = W + v + pill(x.l, 16);
  else if (x.l === t) body = L + v + pill(x.w, 16);
  else if (d.rivals.indexOf(x.l) >= 0) body = pill(x.l, 16) + L + v + pill(x.w, 16);
  else body = pill(x.w, 16) + W + v + pill(x.l, 16);
  return '<div class="sb-cr"><span class="sb-cr__w">WK ' + x.g.week + '</span><span class="sb-cr__t">' + body + '</span></div>';
}
function pwShort(list){ var s = list.filter(function(c){ return c.k <= 3; }); return s.length ? s : list.slice(0, 2); }
function pwRows(list, d, kind, max){
  return pwShort(list).slice(0, max).map(function(c, ci){
    var idx = list.indexOf(c);
    return (ci ? '<div class="sb-or3">or</div>' : '') + '<div class="sb-path"><div class="sb-path__l">' + c.lits.slice().sort(function(a, b){ return a.g.week - b.g.week || ((b.w === d.t || b.l === d.t) - (a.w === d.t || a.l === d.t)); }).map(function(x){ return litChip(x, d); }).join('') + '</div>' +
      (kind === 'al' ? '<div class="sb-path__f"><span class="sb-path__s">Gets in ' + pct(c.avg) + ' of the time</span></div>' : '') + '</div>';
  }).join('');
}
function pathStatus(d){
  if (d.tot === d.M) return '<span class="sb-pa__tag x">Clinched</span>';
  if (d.tot === 0) return '<span class="sb-pa__tag">Eliminated</span>';
  return '<b class="' + oc(d.tot / d.M) + '">' + pct(d.tot / d.M) + '</b><small>' + num(d.tot) + ' of ' + num(d.M) + '</small>';
}
function pathBody(d){
  var t = d.t, spot = d.cut === 1 ? 'the No. 1 seed' : 'the title game';
  if (d.tot === d.M) {
    var msg = '<div class="sb-pa__n">In ' + spot + ' in all ' + num(d.M) + ' outcomes.</div>';
    if (d.cut === 2) { var d1 = pathData(t, 1); lastPaths[t + ':1'] = d1; msg += '<div class="sb-pa__sub"><span class="sb-pa__subl">Race for the No. 1 seed</span><span class="sb-pa__s">' + pathStatus(d1) + '</span></div>' + (d1.pw ? pathBody(d1) : ''); }
    return msg;
  }
  if (d.tot === 0) return '<div class="sb-pa__n">Out of ' + spot + ' in all ' + num(d.M) + ' outcomes.</div>';
  var pw = d.pw, h = '';
  var own = pw.cl.some(function(c){ return c.lits.every(function(x){ return x.w === t; }); });
  if (own) h += '<div><span class="sb-pa__tag x">Controls own destiny</span></div>';
  if (pw.cl.length) h += '<div class="sb-scb"><div class="sb-scb__h">' + (d.cut === 1 ? 'Takes No. 1 if' : 'Gets in if') + '</div>' + pwRows(pw.cl, d, 'cl', 3) + '</div>';
  else h += '<div class="sb-pa__n">No set of results guarantees it \u2014 needs help from other games too.</div>';
  if (pw.al.length && (!pw.cl.length || d.tot / d.M < 0.5)) h += '<div class="sb-scb al"><div class="sb-scb__h">' + (d.cut === 1 ? 'Still in the No. 1 race if' : 'Still alive if') + '</div>' + pwRows(pw.al, d, 'al', 2) + '</div>';
  if (pw.el.length) h += '<div class="sb-scb el"><div class="sb-scb__h">' + (d.cut === 1 ? 'Out of the No. 1 race if' : 'Eliminated if') + '</div>' + pwRows(pw.el, d, 'el', 2) + '</div>';
  return h + tieLine(d);
}
function tieLine(d){
  var t = d.t, beats = d.rivals.filter(function(o){ return B.priPos[o] > B.priPos[t]; }), loses = d.rivals.filter(function(o){ return B.priPos[o] < B.priPos[t]; });
  var tie = d.rivals.length ? 'If tied after H2H: wins vs ' + beats.length + ' of ' + d.rivals.length + ' contenders' + (loses.length ? ', loses to' : '') : '';
  return '<div class="sb-pa__ft"><span>' + tie + '</span>' + loses.map(function(o){ return pill(o, 14); }).join('') + '<span>' + (tie ? '\u00b7 ' : '') + 'Proj AP ' + (B.apProj[t] * 100).toFixed(1) + '% \u00b7 Floor ' + rec(d.floor, d.games - d.floor) + '</span></div>';
}
function lockedStrip(c){
  var l = B.open.filter(function(g){ return T[g.a].conf === c && picks[g.id] != null; });
  if (!l.length) return '';
  return '<div class="sb-locked"><span class="sb-pa__k">Locked</span>' + l.map(function(g){ var w = picks[g.id], lo = w === g.a ? g.b : g.a; return '<button type="button" class="sb-pc" data-act="pick" data-g="' + g.id + '" data-t="" title="Clear">' + pill(w, 14) + '<small>over</small>' + pill(lo, 14) + '<small>Wk ' + g.week + ' ×</small></button>'; }).join('') + '<button type="button" class="sb-btn xs gh" data-act="clearconf" data-c="' + c + '">Clear all</button></div>';
}
function recLikely(t){
  var own = B.open.filter(function(g){ return g.conf && (g.a === t || g.b === t); }), dp = [1];
  own.forEach(function(g){ var p = g.a === t ? g.p : 1 - g.p, nx = new Array(dp.length + 1).fill(0); dp.forEach(function(v, k){ nx[k] += v * (1 - p); nx[k + 1] += v * p; }); dp = nx; });
  var best = 0; dp.forEach(function(v, k){ if (v > dp[best]) best = k; });
  var bw = B.CW[t] + best, bl = B.CL[t] + own.length - best;
  return '<span class="sb-pa__n sb-rl">' + rec(bw, bl) + '<em>' + pct(dp[best]) + ' most likely</em></span>';
}
function pathsCard(c){
  var cut = ui.pcut, r = CNT[c], o = proj.orders[c], top = cut === 1 ? r.top1 : r.top2;
  var live = o.filter(function(t){ var v = top[r.loc[t]]; return v > 0 && v < r.M; }), locked = o.filter(function(t){ return top[r.loc[t]] === r.M; }), out = o.filter(function(t){ return top[r.loc[t]] === 0; });
  var h = '<div class="sb-card"><div class="sb-pa__hd"><div class="sb-pa__t">Pathways to ' + (cut === 2 ? 'the title game' : 'the No. 1 seed') + '<small>' + r.F + ' open games · all ' + num(r.M) + ' outcomes counted · tap a team for its pathways</small></div><div class="sb-seg"><button type="button" class="' + (cut === 2 ? 'on' : '') + '" data-act="pcut" data-v="2">Top 2</button><button type="button" class="' + (cut === 1 ? 'on' : '') + '" data-act="pcut" data-v="1">No. 1</button></div></div>';
  lastPaths = {};
  h += locked.concat(live).map(function(t){ var d = pathData(t, cut); lastPaths[t + ':' + cut] = d; var op = !!ui.pex[t]; return '<div class="sb-pa' + (op ? ' open' : '') + '"><button type="button" class="sb-pa__h sb-pa__btn" data-act="pex" data-t="' + t + '" aria-expanded="' + op + '">' + pill(t, 20) + recLikely(t) + '<span class="sb-pa__s">' + pathStatus(d) + '</span><span class="sb-pa__chev" aria-hidden="true"></span></button>' + (op ? pathBody(d) : '') + '</div>'; }).join('');
  if (out.length) h += '<div class="sb-pa"><div class="sb-pa__l"><span class="sb-pa__k">Out</span>' + out.map(function(t){ return tm(t, 16, 'dim'); }).join('') + '</div></div>';
  return h + '</div>';
}

/* ---- ties ---- */
function vTies(){
  var c = ui.conf, r = CNT[c];
  var h = '<div class="sb-sub">' + confChips(function(i){ var q = CNT[i]; return q.over ? '\u2014' : pct(q.TB.n / q.M); }) + '</div>';
  if (r.over) return h + lockCard(c);
  h += '<div class="sb-legend"><span><i class="tb-h2h"></i>Head-to-head</span><span><i class="tb-ap"></i>All-play %</span><span><i class="tb-pts"></i>Total points</span><span><i class="tb-nat"></i>National rank</span></div>';
  var groups = Array.from(r.TB.groups.values()).sort(function(a, b){ return b.n - a.n; }).slice(0, 8);
  if (!groups.length) return h + '<div class="sb-empty">No ties for the 2nd CCG spot in any of the ' + num(r.M) + ' outcomes.</div>';
  lastTies = groups.map(function(g){ var ex = {}; r.free.forEach(function(f, j){ ex[f.g.id] = (g.ex >> j) & 1 ? f.g.b : f.g.a; }); return ex; });
  h += '<div class="sb-tsc">' + groups.map(function(g, gi){
    var teams = g.grp.map(function(i){ return { t: r.mem[i], p: g.adv[i] / g.n }; }).sort(function(a, b){ return b.p - a.p; });
    return '<div class="sb-tc"><div class="sb-tc__top"><span class="sb-tc__rec">' + teams.length + '-way tie at ' + rec(g.cw, r.G[g.grp[0]] - g.cw) + '</span><span class="sb-tc__f" title="' + num(g.n) + ' of ' + num(r.M) + ' outcomes">' + pct(g.n / r.M) + '</span></div>' +
      '<div class="sb-tc__by">' + ['h2h', 'ap', 'pts', 'nat'].map(function(k){ var v = g.by[k] / g.n; return v > 0 ? '<span class="tb-' + k + '" style="flex-grow:' + v + '" title="' + SB_TB[k] + '">' + (v >= 0.2 ? SB_TB_SHORT[k] + ' ' + Math.round(v * 100) + '%' : '') + '</span>' : ''; }).join('') + '</div>' +
      '<div class="sb-tc__adv">' + teams.map(function(a){ return '<button type="button" data-act="team" data-t="' + a.t + '">' + pill(a.t, 20, a.p < 0.05 ? 'dim' : '') + '<span class="' + oc(a.p) + '">' + pct(a.p) + '</span></button>'; }).join('') + '</div>' +
      '<div class="sb-tc__ft"><span>' + num(g.n) + ' outcomes \u00b7 % = reaches CCG in them</span><button type="button" class="sb-btn xs" data-act="setup" data-i="' + gi + '">Set up</button></div></div>';
  }).join('') + '</div><p class="sb-note">Most common ties for the 2nd title-game spot across all ' + num(r.M) + ' outcomes. The bar shows which tiebreaker settles it. Set up loads one outcome that creates the tie.</p>';
  return h;
}

/* ---- playoff ---- */
var TROPHY = '<svg viewBox="0 0 24 24" fill="none"><defs><linearGradient id="sbtr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8C547"></stop><stop offset=".5" stop-color="#C9A227"></stop><stop offset="1" stop-color="#8B6F1F"></stop></linearGradient></defs><path d="M7 4h10v3.2a5 5 0 0 1-10 0V4Z" fill="url(#sbtr)"></path><path d="M7 5H4.2v1.2A2.8 2.8 0 0 0 7 9M17 5h2.8v1.2A2.8 2.8 0 0 1 17 9" stroke="url(#sbtr)" stroke-width="1.4" fill="none"></path><path d="M11 11.8h2V16h2.4a1 1 0 0 1 1 1v1.2H7.6V17a1 1 0 0 1 1-1H11v-4.2Z" fill="url(#sbtr)"></path></svg>';
function vPlayoff(){
  var h = '<div class="sb-seeds">';
  for (var sd = 1; sd <= SB_FIELD; sd++) {
    var c = SB_ALL.map(function(t){ return { t: t, n: tw.seeds[t] ? tw.seeds[t][sd] : 0 }; }).filter(function(x){ return x.n > 0; }).sort(function(a, b){ return b.n - a.n || B.natPos[a.t] - B.natPos[b.t]; });
    var aq = function(t){ return tw.auto[t] === tw.po[t] && tw.auto[t] > 0 ? '<span class="sb-bye">AQ</span>' : ''; };
    var tip = function(x){ return T[x.t].name + ' \u00b7 ' + num(x.n) + ' of ' + tw.C + ' outcomes'; };
    var lead = c[0], rest = c.slice(1, 5);
    h += '<div class="sb-seed"><div class="sb-seed__n">' + sd + '</div><div class="sb-seed__b">' +
      (lead ? '<button type="button" class="sb-seed__lead" data-act="team" data-t="' + lead.t + '" title="' + tip(lead) + '">' + pill(lead.t, 26) + aq(lead.t) + '<b class="' + oc(lead.n / tw.C) + '">' + pct(lead.n / tw.C) + '</b></button>' : '') +
      (rest.length ? '<div class="sb-seed__c">' + rest.map(function(x){ return '<button type="button" class="sb-seed__t" data-act="team" data-t="' + x.t + '" title="' + tip(x) + '">' + pill(x.t, 13) + '<span>' + pct(x.n / tw.C) + '</span></button>'; }).join('') + (c.length > 5 ? '<span class="sb-seed__m">+' + (c.length - 5) + '</span>' : '') + '</div>' : '') +
      '</div></div>';
  }
  return h + '</div><p class="sb-note">Biggest pill = most likely team at that seed; smaller pills are the other teams that can land there. % = share of the ' + tw.C + ' Week 13 title-game outcomes (regular season with favorites winning). AQ = in only as an auto-bid champion. 16 teams, no byes; the five power-conference champions (ACC/B10/B12/P12/SEC) get auto bids and the AAC champion must earn an at-large bid — all seeded by final national ranking.</p>';
}

/* ---- bowls ---- */
function vBowls(){
  var tip = function(t, n){ return T[t].name + ' \u00b7 ' + num(n) + ' of ' + tw.C + ' outcomes \u00b7 avg final rank #' + Math.round(tw.rank[t]); };
  var lead = function(x){ return '<button type="button" class="sb-seed__lead" data-act="team" data-t="' + x.t + '" title="' + tip(x.t, x.n) + '">' + pill(x.t, 24) + '<span class="sb-bwx__rk">Rk #' + Math.round(tw.rank[x.t]) + '</span><b class="' + oc(x.n / tw.C) + '">' + pct(x.n / tw.C) + '</b></button>'; };
  return '<div class="sb-bowls">' + SB_BOWLS.map(function(b, bi){
    var c = SB_ALL.map(function(t){ var v = tw.bowls[t]; return { t: t, n: v ? v[bi * 2] + v[bi * 2 + 1] : 0 }; }).filter(function(x){ return x.n > 0; }).sort(function(p, q){ return q.n - p.n || tw.rank[p.t] - tw.rank[q.t]; });
    var top = c.slice(0, 2).sort(function(p, q){ return tw.rank[p.t] - tw.rank[q.t]; }), rest = c.slice(2, 7);
    var h = '<div class="sb-bw"><div class="sb-bw__h"><span class="sb-bw__n">' + b.name + '</span><span class="sb-bw__c">Pick ' + (bi + 1) + '</span></div><div class="sb-bwx">';
    if (!top.length) return h + '<div class="sb-pa__n">No eligible teams in any outcome</div></div></div>';
    h += '<div class="sb-bwx__s">' + lead(top[0]) + '</div>' + (top[1] ? '<span class="sb-vs">vs</span><div class="sb-bwx__s">' + lead(top[1]) + '</div>' : '') + '</div>';
    if (rest.length) h += '<div class="sb-bwx__o"><span class="sb-bwx__tie">Also possible</span><div class="sb-seed__c">' + rest.map(function(x){ return '<button type="button" class="sb-seed__t" data-act="team" data-t="' + x.t + '" title="' + tip(x.t, x.n) + '">' + pill(x.t, 13) + '<span>' + pct(x.n / tw.C) + ' \u00b7 #' + Math.round(tw.rank[x.t]) + '</span></button>'; }).join('') + (c.length > 7 ? '<span class="sb-seed__m">+' + (c.length - 7) + '</span>' : '') + '</div></div>';
    return h + '</div>';
  }).join('') + '</div><p class="sb-note">No conference tie-ins \u2014 matchups follow the final national ranking after championship week (record incl. CCG \u2192 national rank). After the 16 playoff teams, the best-ranked ' + SB_MIN_WINS + '+ win teams fill the bowls in order: Pick 1 gets the top two, Pick 2 the next two, and so on. Big pills = most likely matchup; % = share of the ' + tw.C + ' Week 13 title-game outcomes that put the team in that bowl (regular season with favorites winning); Rk = average final national rank.</p>';
}

/* ---- team sheet ---- */
function sheet(){
  var el = $('sheet'), t = ui.sheet;
  if (t == null) { el.innerHTML = ''; return; }
  var tmm = T[t], cf = C[tmm.conf], r = R(t), i = r.loc[t];
  var sIdx = proj.field.indexOf(t), bIdx = -1;
  proj.bowls.forEach(function(b, k){ if (b.a === t || b.b === t) bIdx = k; });
  var status = sIdx >= 0 ? 'Projected No. ' + (sIdx + 1) + ' seed' : bIdx >= 0 ? 'Projected ' + proj.bowls[bIdx].bowl.name : 'Projected out of postseason';
  var tile = function(l, v, sub){ return '<div class="sb-tile"><small>' + l + '</small><b>' + v + '</b>' + (sub ? '<small>' + sub + '</small>' : '') + '</div>'; };
  var tiles = r.over ? tile('CCG', '\u2014', 'pick to unlock') + tile('No. 1 seed', '\u2014', '') : tile('CCG', pct(r.top2[i] / r.M), num(r.top2[i]) + '/' + num(r.M)) + tile('No. 1 seed', pct(r.top1[i] / r.M), num(r.top1[i]) + '/' + num(r.M));
  tiles += tile('Playoff', pct(poV(t)), num(tw.po[t]) + '/' + tw.C) + tile('Auto bid', pct(tw.auto[t] / tw.C), num(tw.auto[t]) + '/' + tw.C);
  var h = '<div class="sb-scrim" data-act="close"></div><div class="sb-sheet" role="dialog" aria-label="' + tmm.name + '">' +
    '<div class="sb-sh__top"><div class="sb-sh__id">' + pill(t, 36) + '<div class="sb-sh__n">' + tmm.name + '</div><div class="sb-sh__m">' + cf.name + ' No. ' + (proj.orders[tmm.conf].indexOf(t) + 1) + ' \u00b7 Now <b>' + rec(B.W[t], B.L[t]) + '</b> \u00b7 Proj <b>' + rec(proj.W[t], proj.L[t]) + '</b></div><div class="sb-sh__st">' + status + '</div></div><button type="button" class="sb-x" data-act="close" aria-label="Close">\u00d7</button></div>' +
    '<div class="sb-ds"><div class="sb-tiles">' + tiles + '</div></div>';
  if (r.over) { el.innerHTML = h + '<div class="sb-ds">' + lockCard(tmm.conf) + '</div></div>'; return; }
  var on = r.ownN[i];
  if (on) {
    var rows = []; for (var k = on; k >= 0; k--) { var bn = r.M * binom(on, k) / Math.pow(2, on); rows.push({ k: k, bn: bn, c2: r.bC2[i][k], c1: r.bC1[i][k] }); }
    h += '<div class="sb-ds"><div class="sb-ds__h">What they need<span>own ' + on + ' open game' + (on > 1 ? 's' : '') + '</span></div><table class="sb-need"><thead><tr><th>Finish</th><th>Outcomes</th><th>CCG</th><th>No. 1</th></tr></thead><tbody>' +
      rows.map(function(q){ return '<tr><td>' + rec(q.k, on - q.k) + (q.k === on ? ' \u00b7 win out' : '') + '</td><td class="f">' + num(q.bn) + '</td><td class="' + oc(q.c2 / q.bn) + '">' + pct(q.c2 / q.bn) + '</td><td class="' + oc(q.c1 / q.bn) + '">' + pct(q.c1 / q.bn) + '</td></tr>'; }).join('') + '</tbody></table></div>';
  }
  var d = pathData(t, 2); lastPaths[t + ':2'] = d;
  h += '<div class="sb-ds"><div class="sb-ds__h sb-ds__h--st">Pathway to the title game<span class="sb-pa__s">' + pathStatus(d) + '</span></div><div style="display:grid;gap:6px">' + pathBody(d) + '</div></div>';
  var tie = proj.confs[tmm.conf].ties.filter(function(x){ return x.teams.indexOf(t) >= 0; })[0];
  h += '<div class="sb-ds"><div class="sb-ds__h">Tiebreakers<span>Proj AP% ' + (B.apProj[t] * 100).toFixed(1) + ' (now ' + (B.apNow[t] * 100).toFixed(1) + ') \u00b7 rank #' + B.natPos[t] + '</span></div><div class="sb-sh__m">In a tie for the 2nd spot in <b>' + num(r.tbIn[i] + r.tbOut[i]) + '</b> outcomes \u00b7 wins it in <b class="up">' + num(r.tbIn[i]) + '</b>, loses it in <b class="dn">' + num(r.tbOut[i]) + '</b></div>' + (tie ? '<div style="margin:8px -12px -12px">' + tieTable(tie) + '</div>' : '') + '</div>';
  var roots = d.helps.filter(function(x){ return x.w !== t && x.l !== t; }).slice(0, 5);
  h += '<div class="sb-ds"><div class="sb-ds__h">Root for<span>CCG share if this result happens</span></div>' +
    (roots.length ? roots.map(function(x){ return '<div class="sb-root">' + pill(x.w, 18) + '<span>over</span>' + pill(x.l, 18, 'dim') + '<span>Wk ' + x.g.week + '</span><span class="sb-root__d"><small>' + pct(x.pl) + '\u2192</small>' + pct(x.pw) + '</span></div>'; }).join('') : '<div class="sb-sh__m">No other open game moves their CCG share 1 point or more.</div>') + '</div></div>';
  el.innerHTML = h;
}
function binom(n, k){ var r = 1; for (var i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; }

/* ---- render ---- */
function view(){
  tabs();
  $('view').innerHTML = ui.tab === 'races' ? vRaces() : ui.tab === 'playoff' ? vPlayoff() : vBowls();
  sheet();
}
function all(){ recompute(); save(); bar(); if (root.classList.contains('is-open')) view(); else sheet(); }

root.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b || !root.contains(b)) return;
  if (!B) return;   // league data not loaded yet
  var a = b.getAttribute('data-act'), v = b.getAttribute('data-v'), t = b.getAttribute('data-t'), g = b.getAttribute('data-g');
  if (a === 'tab') { ui.tab = v; view(); return; }
  if (a === 'wk') { ui.wk = +v; view(); return; }
  if (a === 'conf') { ui.conf = +v; view(); return; }
  if (a === 'metric') { ui.metric = v; view(); return; }
  if (a === 'pex') { ui.pex[t] = !ui.pex[t]; view(); return; }
  if (a === 'pcut') { ui.pcut = +v; view(); return; }
  if (a === 'imp') { ui.open[g] = !ui.open[g]; view(); return; }
  if (a === 'team') { ui.sheet = +t; sheet(); return; }
  if (a === 'close') { ui.sheet = null; sheet(); return; }
  if (a === 'pick' || a === 'apply') { if (t === '' || (a === 'pick' && picks[g] === +t)) delete picks[g]; else picks[g] = +t; all(); return; }
  if (a === 'ccg') { var c = +b.getAttribute('data-c'); ccgPick[c] = ccgPick[c] === +t ? null : +t; all(); return; }
  if (a === 'po') { if (poPicks[g] === +t) delete poPicks[g]; else poPicks[g] = +t; all(); return; }
  if (a === 'lockwk') { var lc = +b.getAttribute('data-c'); B.open.forEach(function(gm){ if (gm.week === +v && T[gm.a].conf === lc && picks[gm.id] == null) picks[gm.id] = gm.p >= .5 ? gm.a : gm.b; }); all(); return; }
  if (a === 'play') { var dd = lastPaths[t + ':' + ui.pcut] || lastPaths[t + ':1']; var lst = dd && dd.pw && dd.pw[b.getAttribute('data-k')][+b.getAttribute('data-i')]; if (lst) { lst.lits.forEach(function(x){ picks[x.g.id] = x.w; }); ui.sheet = null; ui.tab = 'races'; ui.conf = T[+t].conf; all(); } return; }
  if (a === 'clearconf') { var cc2 = +b.getAttribute('data-c'); Object.keys(picks).forEach(function(k){ var gm = B.open[B.kOf[k]]; if (gm && T[gm.a].conf === cc2) delete picks[k]; }); all(); return; }
  if (a === 'path') { var d = lastPaths[+t]; if (d && d.path) { for (var k in d.path) picks[k] = d.path[k]; ui.sheet = null; ui.tab = 'races'; ui.conf = T[+t].conf; all(); } return; }
  if (a === 'setup') { var ex = lastTies[+b.getAttribute('data-i')]; if (ex) { for (var k2 in ex) picks[k2] = ex[k2]; ui.tab = 'races'; all(); } return; }
  if (a === 'bulk') { B.open.forEach(function(gm){ if (v === 'wk' && gm.week !== ui.wk) return; picks[gm.id] = v === 'dog' ? (gm.p >= .5 ? gm.b : gm.a) : (gm.p >= .5 ? gm.a : gm.b); }); all(); return; }
  if (a === 'reset') { picks = {}; ccgPick = nulls(); poPicks = {}; all(); return; }
});
var barEl = root.querySelector('.sb-bar');
function toggle(){
  if (!B) return;   // league data not loaded yet
  var open = !root.classList.contains('is-open');
  root.classList.toggle('is-open', open); barEl.setAttribute('aria-expanded', open);
  $('tog').textContent = open ? 'COLLAPSE' : 'PLAY IT OUT';
  if (open) view();
}
barEl.addEventListener('click', toggle);
barEl.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && ui.sheet != null) { ui.sheet = null; sheet(); } });

/* ---- boot: load live league data (or sample fallback), then render ---- */
function init(){
  function apply(data){
    sbApplyData(data);
    T = SB_TEAMS; C = SB_CONFS;
    B = sbBase(SB_ACTUAL_PLAYED);
    ccgPick = nulls();
    SB_CCG_RESULTS.forEach(function(w, c){ if (w != null) ccgPick[c] = w; });   // lock any played CCGs
    ui.wk = SB_ACTUAL_PLAYED + 1;
    all();
  }
  var done = false;
  function go(data){ if (done) return; done = true; apply(data); }
  try {
    if (window.CFFB_SB_LOAD) {
      window.CFFB_SB_LOAD()
        .then(function(d){ go(d && d.teams && d.teams.length ? d : sbSampleData()); })
        .catch(function(){ go(sbSampleData()); });
    } else { go(sbSampleData()); }
  } catch (e) { go(sbSampleData()); }
}
init();
})();
</script>
