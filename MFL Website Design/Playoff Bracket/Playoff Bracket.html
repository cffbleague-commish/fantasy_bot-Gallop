<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CFFB Playoff Bracket</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   CFFB Playoff Bracket — 16 teams, self-contained for MFL.
   Tokens + classes inlined from the CFFB design system so this
   pastes into MyFantasyLeague with zero external deps (no image
   files — team marks are pure-CSS chips).
   ============================================================ */
:root{
  --bg-canvas:#0A0A0A; --bg-surface:#141414; --bg-surface-elev:#1C1C1C;
  --bg-surface-hover:#1F1F1F; --border:#2A2A2A; --border-strong:#3A3A3A;
  --fg-primary:#F5F5F5; --fg-secondary:#9A9A9A; --fg-tertiary:#5A5A5A;
  --gold:#C9A227; --gold-light:#E8C547; --gold-dark:#8B6F1F;
  --gold-gradient:linear-gradient(135deg,#E8C547 0%,#C9A227 50%,#8B6F1F 100%);
  --live:#2D7A4E; --win:#2D7A4E; --loss:#B84545;
  --font-display:'Saira Condensed','Oswald',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --s-half:4px; --s-1:8px; --s-2:16px; --s-3:24px; --s-4:32px; --s-5:40px;
  --r-1:2px; --r-2:4px; --r-3:8px; --r-4:12px; --r-pill:999px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5); --shadow-md:0 8px 24px rgba(0,0,0,.6);
  --shadow-lg:0 20px 60px rgba(0,0,0,.7);
  --shadow-glow-gold:0 0 24px rgba(201,162,39,.28);
  --shadow-glow-live:0 0 12px rgba(45,122,78,.55);
  --inset-metallic:inset 0 1px 0 rgba(255,255,255,.06);
  --ease-out:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box;}
.cffb-pb,.cffb-pb *{margin:0;padding:0;}
.cffb-pb{
  background:
    radial-gradient(120% 70% at 50% -8%, rgba(201,162,39,.07), transparent 60%),
    var(--bg-canvas);
  color:var(--fg-primary);
  font-family:var(--font-body); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  font-variant-numeric:tabular-nums;
  padding:var(--s-4) var(--s-3) var(--s-5);
  min-height:100vh;
}
.cffb-pb__inner{ max-width:1320px; margin:0 auto; }

/* ---- Header ------------------------------------------------ */
.pb-head{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:var(--s-3); flex-wrap:wrap;
  border-bottom:1px solid var(--border);
  padding-bottom:var(--s-2); margin-bottom:var(--s-3);
}
.pb-head__l{ display:flex; flex-direction:column; gap:6px; }
.pb-eyebrow{
  display:inline-flex; align-items:center; gap:var(--s-1);
  font-weight:700; font-size:11px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--gold);
}
.pb-eyebrow::before{
  content:""; width:18px; height:18px; flex-shrink:0;
  background:var(--gold-gradient);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M6 3h12v3a6 6 0 0 1-5 5.9V15h2.5a1 1 0 0 1 1 1v1H7.5v-1a1 1 0 0 1 1-1H11v-3.1A6 6 0 0 1 6 6V3z'/></svg>") center/contain no-repeat;
          mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M6 3h12v3a6 6 0 0 1-5 5.9V15h2.5a1 1 0 0 1 1 1v1H7.5v-1a1 1 0 0 1 1-1H11v-3.1A6 6 0 0 1 6 6V3z'/></svg>") center/contain no-repeat;
}
.pb-title{
  font-family:var(--font-display); font-weight:700;
  font-size:clamp(30px,4.4vw,46px); line-height:1.0;
  text-transform:uppercase; letter-spacing:-.01em;
}
.pb-title em{ font-style:normal; display:block; line-height:1;
  background:var(--gold-gradient);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
}
.pb-sub{ font-size:13px; color:var(--fg-secondary); margin-top:8px; }
.pb-head__r{ display:flex; align-items:center; gap:var(--s-2); }
.pb-live{
  display:inline-flex; align-items:center; gap:var(--s-1);
  font-weight:700; font-size:11px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--live);
}
.pb-live__dot{ width:8px; height:8px; border-radius:50%;
  background:var(--live); box-shadow:var(--shadow-glow-live);
  animation:pb-pulse 1.4s ease-in-out infinite; }
@keyframes pb-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.55}}
.pb-week{
  font-family:var(--font-display); font-weight:700; text-transform:uppercase;
  font-size:14px; letter-spacing:.06em; color:var(--fg-secondary);
  padding:6px 12px; border:1px solid var(--border); border-radius:var(--r-2);
  background:var(--bg-surface-elev);
}
.pb-week b{ color:var(--fg-primary); }

/* ---- Bracket area ----------------------------------------- */
.pb-bracket{ position:relative; min-height:780px; }
.pb-svg{ position:absolute; inset:0; width:100%; height:100%;
  pointer-events:none; z-index:1; overflow:visible; }
.pb-grid{
  position:relative; z-index:2;
  display:flex; align-items:stretch;
  gap:0 clamp(14px,2vw,34px);
  min-height:780px;
}
.pb-col{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; }
.pb-col--final{ flex:1.05 1 0; }
.pb-round-label{
  height:30px; flex:0 0 auto; text-align:center;
  font-family:var(--font-display); font-weight:700;
  font-size:12px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--fg-tertiary);
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.pb-round-label span{ font-size:9.5px; color:var(--fg-tertiary);
  font-family:var(--font-body); font-weight:600; letter-spacing:.08em; }
.pb-col__body{ flex:1 1 auto; display:flex; flex-direction:column;
  justify-content:space-around; gap:0; }
.pb-col--final .pb-col__body{ justify-content:center; }

/* ---- Match card ------------------------------------------- */
.pb-match{
  background:var(--bg-surface);
  border:1px solid var(--border); border-radius:var(--r-3);
  overflow:hidden; box-shadow:var(--shadow-sm); position:relative;
}
.pb-match__tag{
  display:flex; align-items:center; justify-content:space-between;
  padding:3px 9px; background:var(--bg-surface-elev);
  border-bottom:1px solid var(--border);
}
.pb-match__tag-name{ font-family:var(--font-display); font-weight:600;
  font-size:9px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--fg-secondary); white-space:nowrap; }
.pb-match__status{ font-size:8.5px; font-weight:700; letter-spacing:.1em;
  text-transform:uppercase; color:var(--fg-tertiary); }
.pb-match__status.is-live{ color:var(--live); display:inline-flex; gap:5px; align-items:center; }
.pb-match__status.is-live::before{ content:""; width:5px; height:5px; border-radius:50%;
  background:var(--live); box-shadow:var(--shadow-glow-live);
  animation:pb-pulse 1.4s ease-in-out infinite; }
.pb-match__status.is-final{ color:var(--gold); }

/* team slot */
.pb-slot{
  display:flex; align-items:center; gap:8px;
  padding:6px 9px; cursor:pointer;
  border:none; width:100%; background:transparent; text-align:left;
  color:var(--fg-primary); font-family:inherit;
  transition:background .12s var(--ease-out); position:relative;
}
.pb-slot + .pb-slot{ border-top:1px solid var(--border); }
.pb-slot:hover{ background:var(--bg-surface-hover); }
.pb-slot:focus-visible{ outline:2px solid var(--gold); outline-offset:-2px; }
.pb-slot.is-selected{ background:rgba(201,162,39,.10); }
.pb-slot.is-selected::before{ content:""; position:absolute; left:0; top:0; bottom:0;
  width:3px; background:var(--gold-gradient); }
.pb-slot.is-loser{ opacity:.46; }
.pb-slot.is-tbd{ cursor:default; }
.pb-slot.is-tbd:hover{ background:transparent; }

.pb-seed{
  font-family:var(--font-display); font-weight:700; font-size:11px;
  color:var(--fg-tertiary); width:15px; text-align:center; flex-shrink:0;
}
.pb-chip{
  width:24px; height:24px; border-radius:50%; flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:8.5px;
  letter-spacing:.01em; color:#0A0A0A;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14), var(--shadow-sm);
}
.pb-slot__name{ font-family:var(--font-display); font-weight:600; font-size:13px;
  letter-spacing:.005em; text-transform:uppercase; line-height:1.02;
  flex:1; min-width:0; overflow-wrap:normal; word-break:keep-all; }
.pb-slot__name--tbd{ color:var(--fg-tertiary); }

/* team pill — primary identifier (stand-in for a real team logo/pill).
   Drop a real image in by giving a team a `logo` URL → renders <img>. */
.pb-pill{
  display:inline-flex; align-items:center; gap:6px;
  height:27px; padding:0 12px 0 8px; flex-shrink:0;
  border-radius:var(--r-pill);
  font-family:var(--font-display); font-weight:700; font-size:13px;
  letter-spacing:.04em; color:#0A0A0A; white-space:nowrap;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.20), inset 0 1px 0 rgba(255,255,255,.28), var(--shadow-sm);
}
.pb-pill__dot{ width:12px; height:12px; border-radius:50%; flex-shrink:0;
  background:rgba(0,0,0,.30); box-shadow:inset 0 0 0 1px rgba(255,255,255,.30); }
.pb-pill--tbd{ background:var(--bg-surface-elev); color:var(--fg-tertiary);
  box-shadow:inset 0 0 0 1px var(--border); }
.pb-pill--tbd .pb-pill__dot{ background:rgba(255,255,255,.06); box-shadow:inset 0 0 0 1px var(--border); }
.pb-pill-img{ height:30px; width:auto; max-width:130px; flex-shrink:0; display:block; vertical-align:middle; }
.pb-slot.is-loser .pb-pill{ filter:saturate(.5) brightness(.85); }

.pb-slot__score{
  font-family:var(--font-display); font-weight:700; font-size:14px;
  letter-spacing:-.01em; color:var(--fg-secondary); flex-shrink:0;
  min-width:38px; text-align:right; margin-left:auto; font-variant-numeric:tabular-nums;
}
.pb-slot.is-winner .pb-slot__score{ color:var(--gold); }
.pb-slot__score--tbd{ color:var(--fg-tertiary); font-size:12px; }

/* ---- Final / champion ------------------------------------- */
.pb-final-wrap{ display:flex; flex-direction:column; align-items:center; gap:var(--s-2); }
.pb-trophy{
  width:58px; height:58px; display:flex; align-items:center; justify-content:center;
  border-radius:50%; background:radial-gradient(circle at 50% 30%, rgba(201,162,39,.22), transparent 70%);
}
.pb-trophy svg{ width:48px; height:48px; }
.pb-final{ width:100%; box-shadow:var(--inset-metallic), var(--shadow-md); }
.pb-final .pb-match__tag{ background:linear-gradient(180deg, rgba(201,162,39,.16), var(--bg-surface-elev)); padding:5px 10px; }
.pb-final .pb-match__tag-name{ color:var(--gold); font-size:10px; }
.pb-final .pb-slot{ padding:9px 11px; }
.pb-final .pb-slot__name{ font-size:14.5px; }
.pb-final .pb-slot__score{ font-size:16px; min-width:42px; }
.pb-final .pb-pill{ height:30px; font-size:14px; }
.pb-final .pb-pill-img{ height:34px; }
.pb-champion-slot{
  text-align:center; padding:9px; border-top:1px dashed var(--border);
  background:rgba(201,162,39,.04);
}
.pb-champion-slot__label{ font-size:9px; font-weight:700; letter-spacing:.16em;
  text-transform:uppercase; color:var(--fg-tertiary); }
.pb-champion-slot__val{ font-family:var(--font-display); font-weight:700;
  font-size:15px; text-transform:uppercase; color:var(--fg-secondary); margin-top:2px; }

/* ---- Detail panel ----------------------------------------- */
.pb-detail{
  margin-top:var(--s-4);
  background:var(--bg-surface);
  border:1px solid var(--border); border-radius:var(--r-4);
  box-shadow:var(--shadow-md); overflow:hidden;
  display:none;
}
.pb-detail.is-open{ display:block; }
.pb-detail__bar{ height:4px; background:var(--gold-gradient); }
.pb-detail__top{
  display:flex; align-items:center; gap:var(--s-2);
  padding:var(--s-3); border-bottom:1px solid var(--border);
  background:linear-gradient(90deg, rgba(201,162,39,.06), transparent 60%);
  flex-wrap:wrap;
}
.pb-detail__chip{
  width:54px; height:54px; border-radius:50%; flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:15px;
  color:#0A0A0A; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16), var(--shadow-md);
}
.pb-detail__id{ display:flex; flex-direction:column; gap:4px; min-width:0; flex:1; }
.pb-detail__seedline{ display:flex; align-items:center; gap:var(--s-1); flex-wrap:wrap; }
.pb-detail__seedbadge{
  font-family:var(--font-display); font-weight:700; font-size:11px;
  letter-spacing:.08em; text-transform:uppercase; color:var(--gold);
  border:1px solid rgba(201,162,39,.4); border-radius:var(--r-1);
  padding:2px 8px; background:rgba(201,162,39,.08); white-space:nowrap;
}
.pb-detail__name{ font-family:var(--font-display); font-weight:700;
  font-size:clamp(24px,3.4vw,32px); line-height:1; text-transform:uppercase;
  letter-spacing:-.01em; }
.pb-detail__mgr{ font-size:12px; color:var(--fg-secondary); }
.pb-detail__mgr b{ color:var(--fg-primary); font-weight:600; }
.pb-statuspill{
  font-family:var(--font-display); font-weight:700; font-size:12px;
  letter-spacing:.06em; text-transform:uppercase;
  padding:6px 12px; border-radius:var(--r-pill); white-space:nowrap;
}
.pb-statuspill--live{ color:var(--live); background:rgba(45,122,78,.12); border:1px solid rgba(45,122,78,.45); }
.pb-statuspill--adv{ color:var(--gold); background:rgba(201,162,39,.1); border:1px solid rgba(201,162,39,.4); }
.pb-statuspill--out{ color:var(--loss); background:rgba(184,69,69,.1); border:1px solid rgba(184,69,69,.4); }
.pb-detail__close{
  margin-left:auto; width:34px; height:34px; flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--border); border-radius:var(--r-2);
  background:var(--bg-surface-elev); color:var(--fg-secondary);
  cursor:pointer; font-size:18px; line-height:1; transition:filter .12s;
}
.pb-detail__close:hover{ filter:brightness(1.3); color:var(--fg-primary); }

.pb-detail__body{ display:grid; grid-template-columns:1.1fr 1.3fr; gap:0; }
.pb-detail__col{ padding:var(--s-3); }
.pb-detail__col + .pb-detail__col{ border-left:1px solid var(--border); }
.pb-detail__h{ font-family:var(--font-body); font-weight:600; font-size:11px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--fg-secondary);
  margin-bottom:var(--s-2); }

.pb-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s-2); margin-bottom:var(--s-3); }
.pb-stat{ display:flex; flex-direction:column; gap:3px; }
.pb-stat__l{ font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--fg-tertiary); }
.pb-stat__v{ font-family:var(--font-display); font-weight:700; font-size:25px; line-height:1;
  letter-spacing:-.01em; }
.pb-stat__v.is-pos{ color:var(--win); } .pb-stat__v.is-neg{ color:var(--loss); }

.pb-path{ display:flex; flex-direction:column; gap:var(--s-1); }
.pb-path__row{ display:flex; align-items:center; gap:10px; font-size:12.5px; }
.pb-path__node{ font-family:var(--font-display); font-weight:700; font-size:10px;
  min-width:30px; height:26px; padding:0 6px; border-radius:var(--r-pill); flex-shrink:0;
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--border-strong); color:var(--fg-secondary); }
.pb-path__row.is-done .pb-path__node{ background:var(--win); border-color:var(--win); color:#fff; }
.pb-path__row.is-live .pb-path__node{ border-color:var(--live); color:var(--live);
  box-shadow:0 0 0 3px rgba(45,122,78,.18); }
.pb-path__row.is-out .pb-path__node{ background:var(--loss); border-color:var(--loss); color:#fff; }
.pb-path__row.is-next .pb-path__node{ border-style:dashed; }
.pb-path__txt{ color:var(--fg-secondary); }
.pb-path__txt b{ color:var(--fg-primary); font-weight:600; }

.pb-players{ display:flex; flex-direction:column; gap:var(--s-1); }
.pb-player{ display:flex; align-items:center; gap:10px;
  padding:8px 10px; border:1px solid var(--border); border-radius:var(--r-2);
  background:var(--bg-surface-elev); }
.pb-pos{ font-family:var(--font-display); font-weight:700; font-size:11px;
  min-width:30px; padding:3px 5px; border-radius:var(--r-1); text-align:center;
  color:#0A0A0A; flex-shrink:0; }
.pb-pos--qb{background:#C9A227}.pb-pos--rb{background:#3B82C4;color:#F5F5F5}
.pb-pos--wr{background:#7BA4C9}.pb-pos--te{background:#8B6F1F;color:#F5F5F5}
.pb-player__main{ min-width:0; flex:1; }
.pb-player__name{ font-family:var(--font-display); font-weight:600; font-size:15px;
  text-transform:uppercase; line-height:1.05; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pb-player__sub{ font-size:10.5px; color:var(--fg-secondary); }
.pb-player__pts{ font-family:var(--font-display); font-weight:700; font-size:16px;
  color:var(--gold); flex-shrink:0; }
.pb-player__pts small{ display:block; font-size:9px; color:var(--fg-tertiary);
  letter-spacing:.08em; text-align:right; font-weight:600; }

.pb-hint{ text-align:center; font-size:12px; color:var(--fg-tertiary); margin-top:var(--s-3); }
.pb-hint b{ color:var(--fg-secondary); }

/* ---- Responsive ------------------------------------------- */
@media (max-width:1080px){
  .cffb-pb{ padding:var(--s-3) var(--s-2) var(--s-4); }
  .pb-bracket{ overflow-x:auto; overflow-y:hidden; padding-bottom:var(--s-2);
    -webkit-overflow-scrolling:touch; }
  .pb-grid{ min-width:1040px; }
}
@media (max-width:680px){
  .pb-detail__body{ grid-template-columns:1fr; }
  .pb-detail__col + .pb-detail__col{ border-left:none; border-top:1px solid var(--border); }
}
</style>
</head>
<body>
<div class="cffb-pb">
<div class="cffb-pb__inner">

  <!-- Header -->
  <div class="pb-head">
    <div class="pb-head__l">
      <span class="pb-eyebrow">CFFB Postseason · Est. 2021</span>
      <h1 class="pb-title">Championship <em>Bracket</em></h1>
      <p class="pb-sub">Sixteen teams. Four rounds. One champion.</p>
    </div>
    <div class="pb-head__r">
      <span class="pb-live"><span class="pb-live__dot"></span>Semifinals Live</span>
      <span class="pb-week">WEEK <b>16</b></span>
    </div>
  </div>

  <!-- Bracket -->
  <div class="pb-bracket">
    <svg class="pb-svg" id="pbSvg" preserveAspectRatio="none"></svg>
    <div class="pb-grid" id="pbGrid"><!-- injected by JS --></div>
  </div>

  <!-- Detail panel -->
  <div class="pb-detail" id="pbDetail" aria-live="polite"></div>

  <p class="pb-hint">Tap any team to see <b>record, points, and their path to the title</b>.</p>

</div>
</div>

<script>
/* ============================================================
   Data — placeholder, edit freely. CFFB managers; "players" are
   the college athletes they drafted.
   ============================================================ */
const TEAMS = {
  tht:{name:'Tar Heel Terrors',mgr:'Marcus Webb',abbr:'THT',color:'#4B9CD3',seed:1,rec:'12-1',pf:'1,888.4',pa:'1,502.7',streak:'W6',
    players:[{pos:'QB',name:'D. Maddox',team:'North Carolina',pts:'24.8'},{pos:'RB',name:'J. Caldwell',team:'Tennessee',pts:'21.2'},{pos:'WR',name:'T. Okafor',team:'Ole Miss',pts:'18.6'}]},
  bdd:{name:'Bulldawg Dynasty',mgr:'Sarah Chen',abbr:'BDD',color:'#B84545',seed:2,rec:'11-2',pf:'1,842.6',pa:'1,544.0',streak:'W3',
    players:[{pos:'QB',name:'C. Beck',team:'Georgia',pts:'23.1'},{pos:'RB',name:'M. Trujillo',team:'Texas',pts:'19.9'},{pos:'WR',name:'A. Pearson',team:'LSU',pts:'17.4'}]},

Object.keys(TEAMS).forEach(k=>TEAMS[k].id=k);

/* Bracket state. Round of 16 + Quarterfinals FINAL; Semifinals LIVE; Final pending.
   Standard 16-team seeding: 1v16,8v9,5v12,4v13,6v11,3v14,7v10,2v15. */
const mk=(id,a,as,b,bs,status,winner)=>({id,a:{team:a,score:as},b:{team:b,score:bs},status,winner});

const R1=mk('R1','tht','151.2','bvr','98.4','final','tht');
const R2=mk('R2','tro','124.9','wol','128.6','final','wol');
const R3=mk('R3','gob','140.0','raz','121.3','final','gob');
const R4=mk('R4','bbr','133.5','vol','119.8','final','bbr');
const R5=mk('R5','hmi','144.1','agg','130.2','final','hmi');
const R6=mk('R6','bkr','138.7','tig','117.5','final','bkr');
const R7=mk('R7','soo','139.2','buc','141.9','final','buc');
const R8=mk('R8','bdd','149.6','duk','122.0','final','bdd');

const Q1=mk('Q1','tht','145.3','wol','121.7','final','tht');
const Q2=mk('Q2','gob','134.2','bbr','136.8','final','bbr');
const Q3=mk('Q3','hmi','128.9','bkr','130.5','final','bkr');
const Q4=mk('Q4','bdd','147.0','buc','125.6','final','bdd');

const S1=mk('S1','tht','84.2','bbr','71.5','live',null);
const S2=mk('S2','bkr','69.8','bdd','78.3','live',null);

const F =mk('F', null,null,null,null,'pending',null);

const ROUNDS=[
  {key:'RO16',name:'Round of 16',short:'R16',week:'Wk 14',matches:[R1,R2,R3,R4,R5,R6,R7,R8]},
  {key:'QF',  name:'Quarterfinals',short:'QF',week:'Wk 15',matches:[Q1,Q2,Q3,Q4]},
  {key:'SF',  name:'Semifinals',short:'SF',week:'Wk 16',matches:[S1,S2]},
  {key:'FIN', name:'Championship',short:'FIN',week:'Wk 17',matches:[F]},
];
const ROUND_OF=id=>ROUNDS.find(r=>r.matches.some(m=>m.id===id));

/* connector tree (left -> right) */
const PAIRS=[
  ['R1','Q1'],['R2','Q1'],['R3','Q2'],['R4','Q2'],
  ['R5','Q3'],['R6','Q3'],['R7','Q4'],['R8','Q4'],
  ['Q1','S1'],['Q2','S1'],['Q3','S2'],['Q4','S2'],
  ['S1','F'],['S2','F'],
];

/* ---------------- Render ---------------- */
/* Names are OFF by default — the team pill/logo carries identity.
   Flip to true to show full names beside each pill. */
const SHOW_NAMES = false;

function chip(t,cls){ return `<span class="${cls}" style="background:${t.color}">${t.abbr}</span>`; }

/* Team pill = the identifier. Give a team a `logo` URL to swap in a real
   pill/logo image (e.g. an MFL team icon) with zero other changes. */
function pillIcon(t){
  if(t.logo) return `<img class="pb-pill-img" src="${t.logo}" alt="${t.name}" title="${t.name}"/>`;
  return `<span class="pb-pill" style="background:${t.color}" title="${t.name}"><span class="pb-pill__dot"></span>${t.abbr}</span>`;
}

function slot(side,match,opts={}){
  const data=match[side];
  if(!data.team){
    return `<div class="pb-slot is-tbd">
      <span class="pb-seed"></span>
      <span class="pb-pill pb-pill--tbd"><span class="pb-pill__dot"></span>TBD</span>
      <span class="pb-slot__name pb-slot__name--tbd">${opts.tbdLabel||'To be decided'}</span>
      <span class="pb-slot__score pb-slot__score--tbd">—</span>
    </div>`;
  }
  const t=TEAMS[data.team];
  const isWinner=match.winner===data.team;
  const isLoser=match.winner&&match.winner!==data.team;
  const scoreCls=match.status==='pending'?'pb-slot__score pb-slot__score--tbd':'pb-slot__score';
  const scoreVal=data.score!=null?data.score:'—';
  const nameHtml=SHOW_NAMES?`<span class="pb-slot__name">${t.name}</span>`:'';
  return `<button class="pb-slot ${isWinner?'is-winner':''} ${isLoser?'is-loser':''}" data-team="${t.id}" type="button">
    <span class="pb-seed">${t.seed}</span>
    ${pillIcon(t)}
    ${nameHtml}
    <span class="${scoreCls}">${scoreVal}</span>
  </button>`;
}

function matchCard(match,opts={}){
  const r=ROUND_OF(match.id);
  let statusHtml='';
  if(match.status==='live') statusHtml='<span class="pb-match__status is-live">Live</span>';
  else if(match.status==='final') statusHtml='<span class="pb-match__status is-final">Final</span>';
  else statusHtml='<span class="pb-match__status">'+(r?r.week:'')+'</span>';
  return `<div class="pb-match ${opts.cls||''}" id="m-${match.id}" data-match="${match.id}">
    <div class="pb-match__tag">
      <span class="pb-match__tag-name">${opts.label||(r?r.short:'')}</span>
      ${statusHtml}
    </div>
    ${slot('a',match,opts)}
    ${slot('b',match,opts)}
  </div>`;
}

const TROPHY=`<svg viewBox="0 0 24 24" fill="none">
  <defs><linearGradient id="trg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E8C547"/><stop offset=".5" stop-color="#C9A227"/><stop offset="1" stop-color="#8B6F1F"/>
  </linearGradient></defs>
  <path d="M7 4h10v3.2a5 5 0 0 1-10 0V4Z" fill="url(#trg)"/>
  <path d="M7 5H4.2v1.2A2.8 2.8 0 0 0 7 9M17 5h2.8v1.2A2.8 2.8 0 0 1 17 9" stroke="url(#trg)" stroke-width="1.4" fill="none"/>
  <path d="M11 11.8h2V16h2.4a1 1 0 0 1 1 1v1.2H7.6V17a1 1 0 0 1 1-1H11v-4.2Z" fill="url(#trg)"/>
</svg>`;

function col(round, extra){
  const body=round.matches.map(m=>matchCard(m)).join('');
  return `<div class="pb-col">
    <div class="pb-round-label">${round.name}<span>${round.week}</span></div>
    <div class="pb-col__body">${body}</div>
  </div>`;
}

function render(){
  const grid=document.getElementById('pbGrid');
  grid.innerHTML=`
    ${col(ROUNDS[0])}
    ${col(ROUNDS[1])}
    ${col(ROUNDS[2])}
    <div class="pb-col pb-col--final">
      <div class="pb-round-label">Championship<span>Wk 17</span></div>
      <div class="pb-col__body">
        <div class="pb-final-wrap">
          <div class="pb-trophy">${TROPHY}</div>
          <div class="pb-match pb-final" id="m-F" data-match="F">
            <div class="pb-match__tag">
              <span class="pb-match__tag-name">Title Game</span>
              <span class="pb-match__status">Wk 17</span>
            </div>
            ${slot('a',F,{tbdLabel:'Semifinal 1 winner'})}
            ${slot('b',F,{tbdLabel:'Semifinal 2 winner'})}
            <div class="pb-champion-slot">
              <div class="pb-champion-slot__label">2025 League Champion</div>
              <div class="pb-champion-slot__val">— Awaiting Title Game —</div>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  bindSlots();
  drawConnectors();
}

/* ---------------- Connectors ---------------- */
function rectIn(el,container){
  const r=el.getBoundingClientRect(),c=container.getBoundingClientRect();
  return {left:r.left-c.left,right:r.right-c.left,midY:(r.top+r.bottom)/2-c.top};
}
function elbow(svg,x1,y1,x2,y2){
  const midX=(x1+x2)/2;
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',`M ${x1} ${y1} H ${midX} V ${y2} H ${x2}`);
  p.setAttribute('fill','none'); p.setAttribute('stroke','#3A3A3A'); p.setAttribute('stroke-width','1.5');
  svg.appendChild(p);
}
function drawConnectors(){
  const svg=document.getElementById('pbSvg');
  const bracket=document.querySelector('.pb-bracket');
  if(!svg||!bracket) return;
  svg.innerHTML='';
  const get=id=>document.getElementById('m-'+id);
  PAIRS.forEach(([f,t])=>{
    const ef=get(f), et=get(t); if(!ef||!et) return;
    const a=rectIn(ef,bracket), b=rectIn(et,bracket);
    elbow(svg,a.right,a.midY,b.left,b.midY);
  });
}
window.addEventListener('resize',drawConnectors);

/* ---------------- Path + status (derived) ---------------- */
function oppOf(m,id){ return m.a.team===id?m.b.team:m.a.team; }
function myScore(m,id){ return m.a.team===id?m.a.score:m.b.score; }
function theirScore(m,id){ return m.a.team===id?m.b.score:m.a.score; }
function findMatch(round,id){ return round.matches.find(m=>m.a.team===id||m.b.team===id); }

function buildPath(id){
  const rows=[];
  for(const r of ROUNDS){
    const m=findMatch(r,id); if(!m) continue;
    const opp=oppOf(m,id), oppT=opp?TEAMS[opp]:null;
    const my=myScore(m,id), th=theirScore(m,id);
    if(m.status==='final'){
      if(m.winner===id){ rows.push([r.short,`def. <b>${oppT.name}</b> ${my}–${th}`,'done']); }
      else { rows.push([r.short,`Lost to <b>${oppT.name}</b> ${th}–${my}`,'out']); break; }
    } else if(m.status==='live'){
      const lead=parseFloat(my)>=parseFloat(th);
      rows.push([r.short,`${lead?'Leading':'Trailing'} <b>${oppT.name}</b> ${my}–${th}`,'live']);
    } else {
      rows.push([r.short,'Awaiting opponent','next']);
    }
  }
  return rows;
}
function teamStatus(id){
  for(const r of ROUNDS){ const m=findMatch(r,id); if(m&&m.status==='live') return {k:'live',t:'In '+r.name.replace(/s$/,'')}; }
  for(const r of ROUNDS){ const m=findMatch(r,id); if(m&&m.status==='final'&&m.winner&&m.winner!==id) return {k:'out',t:'Eliminated'}; }
  if(F.status==='final'&&F.winner===id) return {k:'adv',t:'Champion'};
  return {k:'adv',t:'Advanced'};
}
function netOf(t){ return Math.round(parseFloat(t.pf.replace(/,/g,''))-parseFloat(t.pa.replace(/,/g,''))); }

/* ---------------- Detail panel ---------------- */
function bindSlots(){
  document.querySelectorAll('.pb-slot[data-team]').forEach(b=>{
    b.addEventListener('click',()=>openDetail(b.dataset.team));
  });
}
function statRow(label,val,cls=''){
  return `<div class="pb-stat"><span class="pb-stat__l">${label}</span><span class="pb-stat__v ${cls}">${val}</span></div>`;
}
function openDetail(id){
  const t=TEAMS[id]; if(!t) return;
  document.querySelectorAll('.pb-slot[data-team]').forEach(s=>s.classList.toggle('is-selected',s.dataset.team===id));
  const st=teamStatus(id);
  const pillCls=st.k==='live'?'pb-statuspill--live':st.k==='out'?'pb-statuspill--out':'pb-statuspill--adv';
  const pathHtml=buildPath(id).map(([node,txt,state])=>`
    <div class="pb-path__row is-${state}"><span class="pb-path__node">${node}</span><span class="pb-path__txt">${txt}</span></div>`).join('');
  const streakPos=t.streak.startsWith('W');
  const net=netOf(t);
  const d=document.getElementById('pbDetail');
  d.innerHTML=`
    <div class="pb-detail__bar"></div>
    <div class="pb-detail__top">
      <span class="pb-detail__chip" style="background:${t.color}">${t.abbr}</span>
      <span class="pb-detail__id">
        <span class="pb-detail__seedline">
          <span class="pb-detail__seedbadge">No. ${t.seed} Seed</span>
          <span class="pb-detail__mgr">Managed by <b>${t.mgr}</b></span>
        </span>
        <span class="pb-detail__name">${t.name}</span>
      </span>
      <span class="pb-statuspill ${pillCls}">${st.t}</span>
      <button class="pb-detail__close" id="pbClose" aria-label="Close" type="button">×</button>
    </div>
    <div class="pb-detail__body">
      <div class="pb-detail__col">
        <div class="pb-detail__h">Season Résumé</div>
        <div class="pb-stats">
          ${statRow('Record',t.rec)}
          ${statRow('Streak',t.streak,streakPos?'is-pos':'is-neg')}
          ${statRow('Seed','#'+t.seed)}
          ${statRow('Points For',t.pf)}
          ${statRow('Points Against',t.pa)}
          ${statRow('Net',(net>=0?'+':'')+net.toLocaleString(),net>=0?'is-pos':'is-neg')}
        </div>
      </div>
      <div class="pb-detail__col">
        <div class="pb-detail__h">Path to the Title</div>
        <div class="pb-path">${pathHtml}</div>
      </div>
    </div>`;
  d.classList.add('is-open');
  document.getElementById('pbClose').addEventListener('click',closeDetail);
  drawConnectors();
}
function closeDetail(){
  document.getElementById('pbDetail').classList.remove('is-open');
  document.querySelectorAll('.pb-slot.is-selected').forEach(s=>s.classList.remove('is-selected'));
}

render();
openDetail('tht');

/* redraw connectors once layout/fonts settle */
function redraw(){ drawConnectors(); }
window.addEventListener('load',redraw);
if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(redraw); }
setTimeout(redraw,150);
setTimeout(redraw,600);
</script>
